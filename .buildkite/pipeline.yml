agents:
  queue: "linux-small"

steps:
  - label: ":gear: Resolve daily JARN-MESH version"
    key: "resolve-daily-version"
    if: 'build.env("BUILDKITE_PIPELINE_SLUG") == "jarn-mesh-unified-core" && build.branch == "refactor/jarn-mesh-unified-core"'
    command: "bash .buildkite/upload-unified-pipeline.sh"
    timeout_in_minutes: 10
