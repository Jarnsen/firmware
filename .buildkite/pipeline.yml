agents:
  queue: "linux-small"

steps:
  - group: ":construction: JARN-MESH Unified Core"
    if: 'build.env("BUILDKITE_PIPELINE_SLUG") == "jarn-mesh-unified-core"'
    steps:
      - label: ":satellite: Heltec Tracker V1.1"
        key: "heltec-tracker-v11"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "Heltec Tracker V1.1"
          JARNSEN_PIO_ENV: "heltec-wireless-tracker"
          JARNSEN_BOOT_HARDWARE: "TRACKER V1.1"
          JARNSEN_TEST_ARTIFACT: "1"
          JARNSEN_ARTIFACT_LABEL: "Tracker-V1.1"
          JARNSEN_DEVICE_ID: "HELTEC_TRACKER_V1.1"

      - label: ":radio: Heltec V3"
        key: "heltec-v3"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "Heltec V3"
          JARNSEN_PIO_ENV: "heltec-v3"
          JARNSEN_BOOT_HARDWARE: "HELTEC V3"
          JARNSEN_TEST_ARTIFACT: "1"
          JARNSEN_ARTIFACT_LABEL: "Heltec-V3"
          JARNSEN_DEVICE_ID: "HELTEC_V3"

      - label: ":radio: Heltec V4"
        key: "heltec-v4"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "Heltec V4"
          JARNSEN_PIO_ENV: "heltec-v4"
          JARNSEN_BOOT_HARDWARE: "HELTEC V4"

      - label: ":round_pushpin: Seeed Wio Tracker L1"
        key: "wio-tracker-l1"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "Seeed Wio Tracker L1"
          JARNSEN_PIO_ENV: "seeed_wio_tracker_L1"
          JARNSEN_BOOT_HARDWARE: "WIO TRACKER L1"

      - label: ":radio: LILYGO T-Beam"
        key: "lilygo-tbeam"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "LILYGO T-Beam"
          JARNSEN_PIO_ENV: "tbeam"
          JARNSEN_BOOT_HARDWARE: "T-BEAM"

      - label: ":radio: LILYGO T-Beam Supreme"
        key: "lilygo-tbeam-supreme"
        branches: "refactor/jarn-mesh-unified-core"
        command: "bash .buildkite/run-unified-build.sh"
        timeout_in_minutes: 45
        env:
          JARNSEN_BOARD_NAME: "LILYGO T-Beam Supreme"
          JARNSEN_PIO_ENV: "tbeam-s3-core"
          JARNSEN_BOOT_HARDWARE: "T-BEAM SUPREME"
