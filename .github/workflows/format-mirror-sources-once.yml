name: Format mirror sources once

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/format-mirror-sources-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install clang-format==16.0.3

      - name: Format mirror C++ sources
        run: |
          clang-format -i \
            src/graphics/TacticalDisplayMirror.cpp \
            src/graphics/TacticalDisplayMirrorThread.cpp

      - name: Commit formatted sources and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/format-mirror-sources-once.yml
          git config user.name "Jarnsen Tactical Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/graphics/TacticalDisplayMirror.cpp \
            src/graphics/TacticalDisplayMirrorThread.cpp \
            .github/workflows/format-mirror-sources-once.yml
          git commit -m "style: format mirror sources"
          git push origin HEAD:feature/tactical-usb-display-mirror
