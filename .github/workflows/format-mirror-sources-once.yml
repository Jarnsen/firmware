name: Format mirror sources artifact

on:
  pull_request:
    branches:
      - develop
    paths:
      - src/graphics/TacticalDisplayMirror.cpp
      - src/graphics/TacticalDisplayMirrorThread.cpp
      - .github/workflows/format-mirror-sources-once.yml

permissions: read-all

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: python -m pip install clang-format==16.0.3

      - name: Format mirror C++ sources
        run: |
          clang-format -i \
            src/graphics/TacticalDisplayMirror.cpp \
            src/graphics/TacticalDisplayMirrorThread.cpp

      - name: Upload formatted mirror sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-mirror-sources
          path: |
            src/graphics/TacticalDisplayMirror.cpp
            src/graphics/TacticalDisplayMirrorThread.cpp
          if-no-files-found: error
          retention-days: 1
