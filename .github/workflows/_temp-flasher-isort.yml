name: Temporary Flasher isort

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-flasher-isort.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Format imports
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check isort==8.0.1
          python -m isort tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          python -m isort --check-only tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py

      - name: Commit Python formatting
        shell: bash
        run: |
          set -euo pipefail
          git add tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(flasher): normalize imports'
          git push origin HEAD:feat/mini-serial-flasher
