name: Temporary fluid mirror input optimization

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/temporary-mirror-fluid-input.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply low-latency keyboard repeat and frame scheduling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: anchor count {count}, expected 1")
              return text.replace(old, new, 1)

          viewer = Path("tools/tactical-display-mirror/tactical_display_mirror.py")
          text = viewer.read_text(encoding="utf-8")

          text = replace_once(
              text,
              "STATUS_REFRESH_MS = 50\nRENDER_DEBOUNCE_MS = 12\n",
              "STATUS_REFRESH_MS = 50\n"
              "RENDER_DEBOUNCE_MS = 12\n"
              "KEY_REPEAT_DELAY_MS = 180\n"
              "KEY_REPEAT_INTERVAL_MS = 45\n"
              "MAX_NAVIGATION_IN_FLIGHT = 2\n",
              "viewer constants",
          )
          text = replace_once(
              text,
              "KEY_COMMANDS = {\n",
              'REPEATABLE_COMMANDS = frozenset({"LEFT", "RIGHT", "UP", "DOWN"})\n\n'
              "KEY_COMMANDS = {\n",
              "repeatable commands",
          )
          text = replace_once(
              text,
              "        self.outgoing: queue.PriorityQueue[Tuple[int, int, bytes]] = (\n"
              "            queue.PriorityQueue()\n"
              "        )\n",
              "        self.outgoing: queue.PriorityQueue[\n"
              "            Tuple[int, int, Optional[str], int, int, str, bytes]\n"
              "        ] = queue.PriorityQueue()\n",
              "outgoing queue type",
          )
          text = replace_once(
              text,
              "        self.pending_commands: Dict[int, float] = {}\n"
              "        self.pending_lock = threading.Lock()\n"
              "        self.next_command_id = 1\n",
              "        self.pending_commands: Dict[int, Tuple[float, str]] = {}\n"
              "        self.pending_lock = threading.Lock()\n"
              "        self.coalesce_generation: Dict[str, int] = {}\n"
              "        self.coalesce_lock = threading.Lock()\n"
              "        self.pressed_keys: Dict[int, str] = {}\n"
              "        self.repeat_after_ids: Dict[int, str] = {}\n"
              "        self.next_command_id = 1\n",
              "viewer state",
          )
          text = replace_once(
              text,
              '        root.bind_all("<KeyPress>", self._on_key_press)\n'
              '        root.bind_all("<MouseWheel>", self._on_mouse_wheel)\n',
              '        root.bind_all("<KeyPress>", self._on_key_press)\n'
              '        root.bind_all("<KeyRelease>", self._on_key_release)\n'
              '        root.bind_all("<FocusOut>", self._release_all_keys)\n'
              '        root.bind_all("<MouseWheel>", self._on_mouse_wheel)\n',
              "key bindings",
          )

          old = (
              "    def _writer_loop(self) -> None:\n"
              "        while not self.stop_event.is_set():\n"
              "            try:\n"
              "                priority, order, payload = self.outgoing.get(timeout=0.1)\n"
              "            except queue.Empty:\n"
              "                continue\n"
              "            del priority, order\n"
              "            port: Optional[serial.Serial]\n"
              "            with self.serial_lock:\n"
              "                port = self.serial_port\n"
              "            if port is None or not port.is_open:\n"
              "                continue\n"
              "            try:\n"
              "                with self.serial_lock:\n"
              "                    port.write(payload)\n"
              "            except (\n"
              "                serial.SerialException,\n"
              "                serial.SerialTimeoutException,\n"
              "                OSError,\n"
              "            ) as exc:\n"
              '                self._put_message(f"Senden fehlgeschlagen: {exc}")\n'
          )
          new = (
              "    def _writer_loop(self) -> None:\n"
              "        while not self.stop_event.is_set():\n"
              "            try:\n"
              "                (\n"
              "                    priority,\n"
              "                    order,\n"
              "                    coalesce_key,\n"
              "                    generation,\n"
              "                    request_id,\n"
              "                    command,\n"
              "                    payload,\n"
              "                ) = self.outgoing.get(timeout=0.1)\n"
              "            except queue.Empty:\n"
              "                continue\n"
              "            del priority, order\n\n"
              "            if coalesce_key and not self._is_current_generation(\n"
              "                coalesce_key, generation\n"
              "            ):\n"
              "                continue\n\n"
              '            if coalesce_key == "navigation":\n'
              "                stale = False\n"
              "                while not self.stop_event.is_set():\n"
              "                    with self.pending_lock:\n"
              "                        in_flight = sum(\n"
              "                            1\n"
              "                            for _sent_at, pending_command in self.pending_commands.values()\n"
              "                            if pending_command in REPEATABLE_COMMANDS\n"
              "                        )\n"
              "                    if in_flight < MAX_NAVIGATION_IN_FLIGHT:\n"
              "                        break\n"
              "                    if not self._is_current_generation(coalesce_key, generation):\n"
              "                        stale = True\n"
              "                        break\n"
              "                    time.sleep(0.004)\n"
              "                if stale or self.stop_event.is_set():\n"
              "                    continue\n\n"
              "            port: Optional[serial.Serial]\n"
              "            with self.serial_lock:\n"
              "                port = self.serial_port\n"
              "            if port is None or not port.is_open:\n"
              "                continue\n\n"
              "            if request_id:\n"
              "                with self.pending_lock:\n"
              "                    self.pending_commands[request_id] = (time.monotonic(), command)\n"
              "            try:\n"
              "                with self.serial_lock:\n"
              "                    port.write(payload)\n"
              "            except (\n"
              "                serial.SerialException,\n"
              "                serial.SerialTimeoutException,\n"
              "                OSError,\n"
              "            ) as exc:\n"
              "                if request_id:\n"
              "                    with self.pending_lock:\n"
              "                        self.pending_commands.pop(request_id, None)\n"
              '                self._put_message(f"Senden fehlgeschlagen: {exc}")\n'
          )
          text = replace_once(text, old, new, "writer loop")

          old = (
              "    def _queue_wire_message(self, payload: bytes, priority: int = 0) -> None:\n"
              "        order = time.monotonic_ns()\n"
              "        self.outgoing.put((priority, order, payload))\n\n"
              "    def _on_key_press(self, event: tk.Event) -> Optional[str]:\n"
              "        # Keep shortcuts such as Ctrl+S available instead of treating the S as DOWN.\n"
              "        if int(event.state) & 0x000C:\n"
              "            return None\n"
              "        command = KEY_COMMANDS.get(event.keysym)\n"
              "        if command is None:\n"
              "            return None\n"
              "        self._send_command(command)\n"
              '        return "break"\n'
          )
          new = (
              "    def _queue_wire_message(\n"
              "        self,\n"
              "        payload: bytes,\n"
              "        priority: int = 0,\n"
              "        coalesce_key: Optional[str] = None,\n"
              "        request_id: int = 0,\n"
              '        command: str = "",\n'
              "    ) -> None:\n"
              "        generation = 0\n"
              "        if coalesce_key:\n"
              "            with self.coalesce_lock:\n"
              "                generation = self.coalesce_generation.get(coalesce_key, 0) + 1\n"
              "                self.coalesce_generation[coalesce_key] = generation\n"
              "        order = time.monotonic_ns()\n"
              "        self.outgoing.put(\n"
              "            (\n"
              "                priority,\n"
              "                order,\n"
              "                coalesce_key,\n"
              "                generation,\n"
              "                request_id,\n"
              "                command,\n"
              "                payload,\n"
              "            )\n"
              "        )\n\n"
              "    def _is_current_generation(self, coalesce_key: str, generation: int) -> bool:\n"
              "        with self.coalesce_lock:\n"
              "            return self.coalesce_generation.get(coalesce_key) == generation\n\n"
              "    def _on_key_press(self, event: tk.Event) -> Optional[str]:\n"
              "        # Keep shortcuts such as Ctrl+S available instead of treating the S as DOWN.\n"
              "        if int(event.state) & 0x000C:\n"
              "            return None\n"
              "        command = KEY_COMMANDS.get(event.keysym)\n"
              "        if command is None:\n"
              "            return None\n\n"
              "        key_id = int(event.keycode)\n"
              "        if key_id in self.pressed_keys:\n"
              '            return "break"\n\n'
              "        self.pressed_keys[key_id] = command\n"
              "        self._send_command(command)\n"
              "        if command in REPEATABLE_COMMANDS:\n"
              "            self.repeat_after_ids[key_id] = self.root.after(\n"
              "                KEY_REPEAT_DELAY_MS,\n"
              "                lambda key_id=key_id, command=command: self._repeat_key(\n"
              "                    key_id, command\n"
              "                ),\n"
              "            )\n"
              '        return "break"\n\n'
              "    def _on_key_release(self, event: tk.Event) -> Optional[str]:\n"
              "        key_id = int(event.keycode)\n"
              "        command = self.pressed_keys.pop(key_id, None)\n"
              "        after_id = self.repeat_after_ids.pop(key_id, None)\n"
              "        if after_id is not None:\n"
              "            try:\n"
              "                self.root.after_cancel(after_id)\n"
              "            except tk.TclError:\n"
              "                pass\n"
              '        return "break" if command is not None else None\n\n'
              "    def _repeat_key(self, key_id: int, command: str) -> None:\n"
              "        if self.pressed_keys.get(key_id) != command:\n"
              "            self.repeat_after_ids.pop(key_id, None)\n"
              "            return\n"
              "        self._send_command(command)\n"
              "        self.repeat_after_ids[key_id] = self.root.after(\n"
              "            KEY_REPEAT_INTERVAL_MS,\n"
              "            lambda key_id=key_id, command=command: self._repeat_key(\n"
              "                key_id, command\n"
              "            ),\n"
              "        )\n\n"
              "    def _release_all_keys(self, _event: Optional[tk.Event] = None) -> None:\n"
              "        self.pressed_keys.clear()\n"
              "        for after_id in self.repeat_after_ids.values():\n"
              "            try:\n"
              "                self.root.after_cancel(after_id)\n"
              "            except tk.TclError:\n"
              "                pass\n"
              "        self.repeat_after_ids.clear()\n"
          )
          text = replace_once(text, old, new, "queue and key handlers")

          text = replace_once(
              text,
              "        with self.pending_lock:\n"
              "            self.pending_commands[request_id] = time.monotonic()\n"
              '        payload = f"@TMC {request_id} {command}\\n".encode("ascii")\n'
              "        self._queue_wire_message(payload, priority=-1000)\n",
              '        payload = f"@TMC {request_id} {command}\\n".encode("ascii")\n'
              "        self._queue_wire_message(\n"
              "            payload,\n"
              "            priority=-1000,\n"
              "            coalesce_key=(\n"
              '                "navigation" if command in REPEATABLE_COMMANDS else None\n'
              "            ),\n"
              "            request_id=request_id,\n"
              "            command=command,\n"
              "        )\n",
              "send command",
          )
          text = replace_once(
              text,
              "        with self.pending_lock:\n"
              "            sent_at = self.pending_commands.pop(request_id, None)\n"
              "        if sent_at is None:\n"
              "            return\n"
              "        latency_ms = (time.monotonic() - sent_at) * 1000.0\n",
              "        with self.pending_lock:\n"
              "            pending = self.pending_commands.pop(request_id, None)\n"
              "        if pending is None:\n"
              "            return\n"
              "        sent_at, _command = pending\n"
              "        latency_ms = (time.monotonic() - sent_at) * 1000.0\n",
              "ack tuple",
          )
          text = replace_once(
              text,
              "                for request_id, sent_at in self.pending_commands.items()\n"
              "                if sent_at < cutoff\n",
              "                for request_id, (sent_at, _command) in self.pending_commands.items()\n"
              "                if sent_at < cutoff\n",
              "pending expiry",
          )
          text = replace_once(
              text,
              "    def close(self) -> None:\n"
              "        self.stop_event.set()\n",
              "    def close(self) -> None:\n"
              "        self._release_all_keys()\n"
              "        self.stop_event.set()\n",
              "close keys",
          )
          viewer.write_text(text, encoding="utf-8")

          mirror = Path("src/graphics/TacticalDisplayMirror.cpp")
          text = mirror.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "constexpr uint32_t MIRROR_FRAME_INTERVAL_MS = 100;\n"
              "constexpr uint32_t MIRROR_INPUT_PRIORITY_MS = 80;\n",
              "constexpr uint32_t MIRROR_FRAME_INTERVAL_MS = 60;\n"
              "constexpr uint32_t MIRROR_ACTIVE_FRAME_INTERVAL_MS = 100;\n"
              "constexpr uint32_t MIRROR_INPUT_PRIORITY_MS = 8;\n"
              "constexpr uint32_t MIRROR_INPUT_BURST_MS = 260;\n",
              "mirror timing constants",
          )
          text = replace_once(
              text,
              "constexpr size_t CHUNK_PAYLOAD_BYTES = 48;\n",
              "constexpr size_t CHUNK_PAYLOAD_BYTES = 60;\n",
              "chunk payload",
          )
          text = replace_once(
              text,
              "uint32_t inputPriorityUntil = 0;\nPendingFrame pendingFrame;\n",
              "uint32_t inputPriorityUntil = 0;\n"
              "uint32_t lastInputAt = 0;\n"
              "PendingFrame pendingFrame;\n",
              "last input state",
          )
          text = replace_once(
              text,
              "void prioritizeMirrorInput() {\n"
              "  inputPriorityUntil = millis() + MIRROR_INPUT_PRIORITY_MS;\n"
              "  clearPendingFrame();\n"
              "}\n",
              "void prioritizeMirrorInput() {\n"
              "  const uint32_t now = millis();\n"
              "  const bool newInputBurst =\n"
              "      !lastInputAt ||\n"
              "      static_cast<uint32_t>(now - lastInputAt) > MIRROR_INPUT_BURST_MS;\n"
              "  lastInputAt = now;\n"
              "  inputPriorityUntil = now + MIRROR_INPUT_PRIORITY_MS;\n"
              "  if (newInputBurst)\n"
              "    clearPendingFrame();\n"
              "}\n",
              "input prioritization",
          )
          text = replace_once(
              text,
              "  if (static_cast<uint32_t>(now - lastFrameCompletedAt) <\n"
              "      MIRROR_FRAME_INTERVAL_MS)\n"
              "    return;\n",
              "  const bool inputActive =\n"
              "      lastInputAt &&\n"
              "      static_cast<uint32_t>(now - lastInputAt) <= MIRROR_INPUT_BURST_MS;\n"
              "  const uint32_t frameInterval = inputActive\n"
              "                                     ? MIRROR_ACTIVE_FRAME_INTERVAL_MS\n"
              "                                     : MIRROR_FRAME_INTERVAL_MS;\n"
              "  if (static_cast<uint32_t>(now - lastFrameCompletedAt) < frameInterval)\n"
              "    return;\n",
              "adaptive frame interval",
          )
          mirror.write_text(text, encoding="utf-8")

          thread = Path("src/graphics/TacticalDisplayMirrorThread.cpp")
          text = thread.read_text(encoding="utf-8")
          text = replace_once(
              text,
              '    : concurrency::OSThread("display-mirror", 10) {}\n',
              '    : concurrency::OSThread("display-mirror", 5) {}\n',
              "thread constructor interval",
          )
          text = replace_once(
              text,
              "  return 10;\n",
              "  return 5;\n",
              "thread run interval",
          )
          thread.write_text(text, encoding="utf-8")
          PY

      - name: Format and validate changed sources
        run: |
          python -m pip install black==26.5.1 clang-format==16.0.3
          black tools/tactical-display-mirror/tactical_display_mirror.py
          clang-format -i src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp
          python -m py_compile tools/tactical-display-mirror/tactical_display_mirror.py

      - name: Update mirror documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/tactical-display-mirror/README.md")
          text = path.read_text(encoding="utf-8")
          anchor = "- double-buffered drawing and a newest-frame-only queue\n"
          addition = (
              "- double-buffered drawing and a newest-frame-only queue\n"
              "- independent 180 ms / 45 ms key-repeat timing for held arrows or WASD\n"
              "- navigation command coalescing with at most two commands in flight\n"
              "- adaptive mirror scheduling while controls are active\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit("README feature anchor not found exactly once")
          path.write_text(text.replace(anchor, addition, 1), encoding="utf-8")
          PY

      - name: Commit optimization and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-mirror-fluid-input.yml
          git config user.name "Jarnsen Tactical Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graphics/TacticalDisplayMirror.cpp \
                  src/graphics/TacticalDisplayMirrorThread.cpp \
                  tools/tactical-display-mirror/tactical_display_mirror.py \
                  tools/tactical-display-mirror/README.md \
                  .github/workflows/temporary-mirror-fluid-input.yml
          git commit -m "perf: make mirror controls more responsive"
          git push origin HEAD:feature/tactical-usb-display-mirror
