name: JARNSEN-MESH Flasher Linux HIL
run-name: "JARNSEN-MESH-FLASHER Linux HIL · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-linux-hil.yml

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-linux-hil-${{ github.ref }}
  cancel-in-progress: true

env:
  JARNSEN_HIL_REFERENCE_BUILD: "184"

jobs:
  virtualbox-host-inventory:
    name: JARNO-PC · VirtualBox USB host inventory
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Assert dedicated Windows host
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner=$env:RUNNER_NAME"
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing host diagnostics on unexpected Windows runner '$env:RUNNER_NAME'."
          }

      - name: Non-destructive VirtualBox and USB host inventory
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null
          $report = Join-Path $PWD 'ci-logs\virtualbox-host-usb-inventory.txt'

          $candidates = @(
            (Get-Command VBoxManage.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe'
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          if (-not $candidates) {
            "RESULT=VBOXMANAGE_NOT_FOUND" | Tee-Object -FilePath $report
            throw 'VBoxManage.exe was not found on JARNO-PC.'
          }

          $vbox = $candidates[0]
          "JARNSEN-MESH-FLASHER VirtualBox host inventory" | Tee-Object -FilePath $report
          "Runner=$env:RUNNER_NAME" | Tee-Object -FilePath $report -Append
          "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD" | Tee-Object -FilePath $report -Append
          "VBoxManage=$vbox" | Tee-Object -FilePath $report -Append
          "=== VirtualBox version ===" | Tee-Object -FilePath $report -Append
          (& $vbox --version 2>&1) | Tee-Object -FilePath $report -Append
          "=== Running VMs ===" | Tee-Object -FilePath $report -Append
          (& $vbox list runningvms 2>&1) | Tee-Object -FilePath $report -Append
          "=== Host USB devices ===" | Tee-Object -FilePath $report -Append
          (& $vbox list usbhost 2>&1) | Tee-Object -FilePath $report -Append
          "RESULT=HOST_INVENTORY_COMPLETE" | Tee-Object -FilePath $report -Append
          Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY

  usb-inventory:
    name: Jarnsen-Build · read-only USB identity inventory
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Assert dedicated Linux HIL runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'ReferenceBuild=%s\n' "$JARNSEN_HIL_REFERENCE_BUILD"
          if [ "${RUNNER_NAME:-}" != "Jarnsen-Build" ]; then
            echo "Refusing HIL inventory on unexpected Linux runner '${RUNNER_NAME:-unknown}'." >&2
            exit 10
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner=${RUNNER_NAME:-unknown}"
          echo "Machine=$(hostname)"
          echo "User=$(id -un)"
          echo "Groups=$(id -Gn)"
          echo "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          uname -a
          if command -v python3 >/dev/null 2>&1; then python3 --version; fi
          if [ -r /etc/os-release ]; then cat /etc/os-release; fi

      - name: Non-destructive USB and serial inventory
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p ci-logs
          report="ci-logs/linux-usb-inventory.txt"
          : > "$report"

          log() {
            printf '%s\n' "$*" | tee -a "$report"
          }

          log "JARNSEN-MESH-FLASHER Linux HIL USB inventory"
          log "Runner=${RUNNER_NAME:-unknown}"
          log "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          log "Machine=$(hostname)"
          log "User=$(id -un)"
          log "Groups=$(id -Gn)"
          log "Timestamp=$(date --iso-8601=seconds 2>/dev/null || date)"
          log "MODE=READ_ONLY_NO_PORT_OPEN_NO_RESET_NO_FLASH"
          log ""

          log "=== lsusb ==="
          if command -v lsusb >/dev/null 2>&1; then
            lsusb 2>&1 | tee -a "$report" || true
          else
            log "lsusb unavailable"
          fi
          log ""

          log "=== stable serial links ==="
          stable_links=0
          for dir in /dev/serial/by-id /dev/serial/by-path; do
            log "[$dir]"
            if [ -d "$dir" ]; then
              while IFS= read -r entry; do
                [ -n "$entry" ] || continue
                stable_links=$((stable_links + 1))
                printf '%s\n' "$entry" | tee -a "$report"
              done < <(find "$dir" -maxdepth 1 -type l -printf '%f -> %l\n' 2>&1 | sort || true)
            else
              log "missing"
            fi
          done
          log "stable_link_count=$stable_links"
          log ""

          mapfile -t devices < <(
            compgen -G '/dev/ttyACM*' || true
            compgen -G '/dev/ttyUSB*' || true
          )

          log "=== USB serial devices (${#devices[@]}) ==="
          for dev in "${devices[@]}"; do
            [ -e "$dev" ] || continue
            log "--- $dev ---"
            log "realpath=$(readlink -f "$dev" 2>/dev/null || printf '%s' "$dev")"
            log "mode=$(stat -c '%A %a owner=%U group=%G' "$dev" 2>/dev/null || echo unknown)"
            if [ -r "$dev" ]; then log "readable=yes"; else log "readable=no"; fi
            if [ -w "$dev" ]; then log "writable=yes"; else log "writable=no"; fi
            if command -v udevadm >/dev/null 2>&1; then
              udevadm info --query=property --name="$dev" 2>/dev/null \
                | grep -E '^(DEVNAME|ID_VENDOR_ID|ID_MODEL_ID|ID_VENDOR=|ID_MODEL=|ID_SERIAL=|ID_SERIAL_SHORT=|ID_PATH=|ID_USB_DRIVER=)' \
                | sort \
                | tee -a "$report" || true
            else
              log "udevadm unavailable"
            fi
          done

          log ""
          log "=== identity evidence (never identify a board by VID:PID alone) ==="
          if grep -Eiq '303a[:_ -]?1001|303A[:_ -]?1001' "$report"; then
            log "transport_evidence=ESP32-S3-native-USB-303A:1001"
          fi
          if grep -Eiq '10c4[:_ -]?ea60|10C4[:_ -]?EA60' "$report"; then
            log "transport_evidence=CP210x-10C4:EA60"
          fi

          normalized="$(tr -cd '[:alnum:]\n' < "$report" | tr '[:lower:]' '[:upper:]')"
          exact_known=0
          if grep -Fq '48CA435C2FEC' <<< "$normalized"; then
            log "exact_identity=SUPREME_SERIAL_48CA435C2FEC"
            exact_known=$((exact_known + 1))
          fi
          if grep -Fq 'F09E9E760710' <<< "$normalized"; then
            log "exact_identity=TRACKER_SERIAL_F09E9E760710"
            exact_known=$((exact_known + 1))
          fi
          log "exact_known_identity_count=$exact_known"

          if [ "${#devices[@]}" -eq 0 ]; then
            log "RESULT=NO_USB_SERIAL_DEVICES_PASSED_TO_GUEST"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi

          if [ "$stable_links" -eq 0 ]; then
            log "RESULT=USB_SERIAL_VISIBLE_BUT_NO_STABLE_LINUX_LINKS"
          elif [ "$exact_known" -eq 0 ]; then
            log "RESULT=USB_SERIAL_VISIBLE_IDENTITY_NOT_YET_PROVEN"
          else
            log "RESULT=EXACT_KNOWN_IDENTITY_VISIBLE_READ_ONLY"
          fi

          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - name: Python serial enumeration if available
        if: always()
        shell: bash
        run: |
          set -u
          report="ci-logs/linux-usb-inventory.txt"
          {
            echo
            echo "=== pyserial list_ports (enumeration only; ports are not opened) ==="
            if command -v python3 >/dev/null 2>&1 && python3 -c 'import serial' >/dev/null 2>&1; then
              python3 -m serial.tools.list_ports -v || true
            else
              echo "pyserial not installed on runner; shell/udev inventory above remains authoritative."
            fi
          } 2>&1 | tee -a "$report"
