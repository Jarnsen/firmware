name: JARNSEN-MESH Flasher Linux HIL
run-name: "JARNSEN-MESH-FLASHER Linux HIL · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-linux-hil.yml

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-linux-hil-${{ github.ref }}
  cancel-in-progress: true

env:
  JARNSEN_HIL_REFERENCE_BUILD: "184"
  JARNSEN_HIL_VM: "Jarnsen-Build"
  JARNSEN_SUPREME_SERIAL: "48:CA:43:5C:2F:EC"

jobs:
  virtualbox-host-attach:
    name: JARNO-PC · exact Supreme USB handoff
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    outputs:
      supreme_uuid: ${{ steps.attach.outputs.supreme_uuid }}
      handoff_state: ${{ steps.attach.outputs.handoff_state }}

    steps:
      - name: Assert dedicated Windows host
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner=$env:RUNNER_NAME"
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing USB handoff on unexpected Windows runner '$env:RUNNER_NAME'."
          }

      - name: Reconcile exact Supreme capture and hand off to VM
        id: attach
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          function Get-ExactHostBlock {
            $usb = (& $vbox list usbhost 2>&1 | Out-String)
            $blocks = @($usb -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object { $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) })
          }

          function Get-ExactVmBlock {
            $details = (& $vbox showvminfo $env:JARNSEN_HIL_VM --details 2>&1 | Out-String)
            Write-Host '=== VM details ==='
            Write-Host $details
            $blocks = @($details -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object { $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) })
          }

          $running = (& $vbox list runningvms 2>&1 | Out-String)
          Write-Host $running
          if ($running -notmatch ('"' + [regex]::Escape($env:JARNSEN_HIL_VM) + '"')) {
            throw "VirtualBox VM '$env:JARNSEN_HIL_VM' is not running."
          }

          Write-Host '=== VM USB configuration (read-only) ==='
          $vmInfo = (& $vbox showvminfo $env:JARNSEN_HIL_VM --machinereadable 2>&1 | Out-String)
          $vmInfo -split "`r?`n" |
            Where-Object { $_ -match '^(name|ostype|chipset|usb|USB|ehci|xhci|XHCI|EHCI)' } |
            ForEach-Object { Write-Host $_ }

          $hostBlocks = @(Get-ExactHostBlock)
          if ($hostBlocks.Count -ne 1) {
            throw "Expected exactly one Supreme with serial $env:JARNSEN_SUPREME_SERIAL, found $($hostBlocks.Count)."
          }
          Write-Host '=== Exact Supreme host state ==='
          Write-Host $hostBlocks[0]
          if ($hostBlocks[0] -notmatch 'UUID:\s*([0-9a-fA-F-]{36})') {
            throw 'Exact Supreme was found, but its VirtualBox host USB UUID could not be parsed.'
          }
          $hostUuid = $Matches[1]
          "supreme_uuid=$hostUuid" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Exact Supreme host UUID=$hostUuid"
          Write-Host 'MODE=USB_HANDOFF_ONLY_NO_RESET_NO_FLASH'

          if ($hostBlocks[0] -match 'Current State:\s*Captured') {
            Write-Host 'Supreme is already Captured. Checking whether the running VM actually owns an exact matching attachment.'
            $vmBlocks = @(Get-ExactVmBlock)
            Write-Host "Exact VM attachment count=$($vmBlocks.Count)"
            if ($vmBlocks.Count -eq 1) {
              Write-Host '=== Existing exact Supreme VM attachment ==='
              Write-Host $vmBlocks[0]
              if ($vmBlocks[0] -notmatch 'UUID:\s*([0-9a-fA-F-]{36})') {
                throw 'Exact Supreme VM attachment exists, but its VM-side USB UUID could not be parsed.'
              }
              $vmUuid = $Matches[1]
              Write-Host "Detaching pre-existing VM-side Supreme UUID=$vmUuid before clean re-attach."
              & $vbox controlvm $env:JARNSEN_HIL_VM usbdetach $vmUuid
              if ($LASTEXITCODE -ne 0) {
                throw "Could not detach the exact pre-existing Supreme VM attachment; exit code $LASTEXITCODE."
              }
              for ($i = 0; $i -lt 10; $i++) {
                Start-Sleep -Seconds 1
                $hostBlocks = @(Get-ExactHostBlock)
                if ($hostBlocks.Count -eq 1 -and $hostBlocks[0] -notmatch 'Current State:\s*Captured') { break }
              }
              if ($hostBlocks.Count -ne 1 -or $hostBlocks[0] -match 'Current State:\s*Captured') {
                throw 'Exact Supreme remained Captured after detaching its proven VM-side attachment.'
              }
            } elseif ($vmBlocks.Count -eq 0) {
              Write-Host 'RESULT=STALE_CAPTURE_HOST_SAYS_CAPTURED_VM_HAS_NO_EXACT_ATTACHMENT'
              "handoff_state=stale-captured-no-vm-attachment" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              exit 0
            } else {
              throw "More than one exact Supreme attachment is reported inside the VM: $($vmBlocks.Count)."
            }
          }

          Write-Host "Attaching exact Supreme host UUID=$hostUuid to '$env:JARNSEN_HIL_VM'."
          & $vbox controlvm $env:JARNSEN_HIL_VM usbattach $hostUuid
          if ($LASTEXITCODE -ne 0) { throw "VirtualBox usbattach failed with exit code $LASTEXITCODE." }

          $captured = $false
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 1
            $after = @(Get-ExactHostBlock)
            if ($after.Count -eq 1) {
              Write-Host $after[0]
              if ($after[0] -match 'Current State:\s*Captured') {
                $captured = $true
                break
              }
            }
          }
          if (-not $captured) {
            throw 'VirtualBox did not keep the exact Supreme in Captured state after usbattach.'
          }
          "handoff_state=fresh-captured" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'RESULT=EXACT_SUPREME_CAPTURED_FOR_LINUX_GUEST'

  usb-inventory:
    name: Jarnsen-Build · read-only Supreme identity inventory
    needs: virtualbox-host-attach
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      HANDOFF_STATE: ${{ needs.virtualbox-host-attach.outputs.handoff_state }}

    steps:
      - name: Assert dedicated Linux HIL runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'ReferenceBuild=%s\n' "$JARNSEN_HIL_REFERENCE_BUILD"
          printf 'HandoffState=%s\n' "${HANDOFF_STATE:-unknown}"
          if [ "${RUNNER_NAME:-}" != "Jarnsen-Build" ]; then
            echo "Refusing HIL inventory on unexpected Linux runner '${RUNNER_NAME:-unknown}'." >&2
            exit 10
          fi

      - name: Wait for exact Supreme USB enumeration
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$JARNSEN_SUPREME_SERIAL" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
          echo 'MODE=READ_ONLY_NO_PORT_OPEN_NO_RESET_NO_FLASH'

          for attempt in $(seq 1 20); do
            found=0
            for node in /sys/bus/usb/devices/*; do
              [ -d "$node" ] || continue
              [ -r "$node/idVendor" ] || continue
              [ -r "$node/idProduct" ] || continue
              vendor="$(tr '[:lower:]' '[:upper:]' < "$node/idVendor" 2>/dev/null || true)"
              product="$(tr '[:lower:]' '[:upper:]' < "$node/idProduct" 2>/dev/null || true)"
              serial="$(cat "$node/serial" 2>/dev/null || true)"
              normalized="$(printf '%s' "$serial" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
              if [ "$vendor" = '303A' ] && [ "$product" = '1001' ] && [ "$normalized" = "$expected" ]; then
                echo "EXACT_SUPREME_SYSFS=$node"
                echo "EXACT_SUPREME_SERIAL=$serial"
                found=1
                break
              fi
            done
            [ "$found" -eq 1 ] && exit 0
            sleep 1
          done

          echo "RESULT=EXACT_SUPREME_USB_NOT_VISIBLE_IN_GUEST handoff=${HANDOFF_STATE:-unknown}" >&2
          echo '=== lsusb ===' >&2
          command -v lsusb >/dev/null 2>&1 && lsusb >&2 || true
          echo '=== recent kernel USB messages ===' >&2
          (dmesg --ctime 2>/dev/null || journalctl -k --no-pager 2>/dev/null || true) | tail -n 120 >&2
          exit 2

      - name: Verify exact Supreme identity without opening port
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$JARNSEN_SUPREME_SERIAL" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
          echo "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          echo 'MODE=READ_ONLY_NO_PORT_OPEN_NO_RESET_NO_FLASH'
          echo '=== lsusb ==='
          command -v lsusb >/dev/null 2>&1 && lsusb || true
          echo '=== stable serial links ==='
          ls -la /dev/serial/by-id 2>/dev/null || true
          ls -la /dev/serial/by-path 2>/dev/null || true

          usb_found=0
          for node in /sys/bus/usb/devices/*; do
            [ -d "$node" ] || continue
            vendor="$(tr '[:lower:]' '[:upper:]' < "$node/idVendor" 2>/dev/null || true)"
            product="$(tr '[:lower:]' '[:upper:]' < "$node/idProduct" 2>/dev/null || true)"
            serial="$(cat "$node/serial" 2>/dev/null || true)"
            normalized="$(printf '%s' "$serial" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
            if [ "$vendor" = '303A' ] && [ "$product" = '1001' ] && [ "$normalized" = "$expected" ]; then
              usb_found=$((usb_found + 1))
              echo "EXACT_SUPREME_SYSFS=$node"
            fi
          done
          if [ "$usb_found" -ne 1 ]; then
            echo "RESULT=EXACT_SUPREME_USB_IDENTITY_NOT_UNIQUE count=$usb_found" >&2
            exit 3
          fi

          serial_found=0
          for dev in /dev/ttyACM* /dev/ttyUSB*; do
            [ -e "$dev" ] || continue
            echo "--- $dev ---"
            props="$(udevadm info --query=property --name="$dev" 2>/dev/null || true)"
            printf '%s\n' "$props" | grep -E '^(DEVNAME|ID_VENDOR_ID|ID_MODEL_ID|ID_SERIAL=|ID_SERIAL_SHORT=|ID_PATH=|ID_USB_DRIVER=)' || true
            normalized="$(printf '%s' "$props" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
            if grep -Fq "$expected" <<< "$normalized"; then
              serial_found=$((serial_found + 1))
              echo "EXACT_SUPREME_DEVICE=$dev"
              echo "EXACT_SUPREME_REALPATH=$(readlink -f "$dev")"
            fi
          done

          if [ "$serial_found" -eq 0 ]; then
            echo 'RESULT=EXACT_SUPREME_USB_VISIBLE_BUT_NO_SERIAL_NODE' >&2
            echo '=== recent kernel USB messages ===' >&2
            (dmesg --ctime 2>/dev/null || journalctl -k --no-pager 2>/dev/null || true) | tail -n 120 >&2
            exit 4
          fi
          if [ "$serial_found" -ne 1 ]; then
            echo "RESULT=EXACT_SUPREME_SERIAL_IDENTITY_NOT_UNIQUE count=$serial_found" >&2
            exit 5
          fi
          echo 'RESULT=EXACT_SUPREME_IDENTITY_VISIBLE_READ_ONLY'

  virtualbox-host-detach:
    name: JARNO-PC · return Supreme USB to Windows
    if: ${{ always() }}
    needs:
      - virtualbox-host-attach
      - usb-inventory
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Return exact Supreme to Windows host
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          SUPREME_UUID: ${{ needs.virtualbox-host-attach.outputs.supreme_uuid }}
          HANDOFF_STATE: ${{ needs.virtualbox-host-attach.outputs.handoff_state }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing USB cleanup on unexpected Windows runner '$env:RUNNER_NAME'."
          }
          if (-not $env:SUPREME_UUID) {
            Write-Host 'No Supreme UUID was emitted; nothing can be detached.'
            exit 0
          }

          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          function Get-ExactHostBlock {
            $usb = (& $vbox list usbhost 2>&1 | Out-String)
            $blocks = @($usb -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object { $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) })
          }

          function Get-ExactVmBlock {
            $details = (& $vbox showvminfo $env:JARNSEN_HIL_VM --details 2>&1 | Out-String)
            $blocks = @($details -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object { $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) })
          }

          $before = @(Get-ExactHostBlock)
          if ($before.Count -ne 1) {
            throw "Cleanup expected exactly one Supreme with serial $env:JARNSEN_SUPREME_SERIAL, found $($before.Count)."
          }
          Write-Host '=== Supreme host state before cleanup ==='
          Write-Host $before[0]
          Write-Host "HandoffState=$env:HANDOFF_STATE"

          $vmBlocks = @(Get-ExactVmBlock)
          Write-Host "Exact VM attachment count during cleanup=$($vmBlocks.Count)"
          if ($vmBlocks.Count -eq 1) {
            Write-Host '=== Exact VM attachment during cleanup ==='
            Write-Host $vmBlocks[0]
            if ($vmBlocks[0] -notmatch 'UUID:\s*([0-9a-fA-F-]{36})') {
              throw 'Exact VM attachment exists during cleanup, but its UUID cannot be parsed.'
            }
            $vmUuid = $Matches[1]
            & $vbox controlvm $env:JARNSEN_HIL_VM usbdetach $vmUuid
            if ($LASTEXITCODE -ne 0) {
              throw "Could not detach proven exact Supreme VM attachment UUID=$vmUuid; exit code $LASTEXITCODE."
            }
          } elseif ($vmBlocks.Count -gt 1) {
            throw "Cleanup found more than one exact Supreme VM attachment: $($vmBlocks.Count)."
          } elseif ($before[0] -match 'Current State:\s*Captured') {
            Write-Host 'RESULT=STALE_CAPTURE_CONFIRMED_HOST_CAPTURED_VM_HAS_NO_EXACT_ATTACHMENT'
            Write-Host 'Cleanup will not guess another UUID or device.'
            exit 6
          } else {
            Write-Host 'Exact Supreme is already not attached to the VM; cleanup is idempotent.'
          }

          $after = $before
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 1
            $after = @(Get-ExactHostBlock)
            if ($after.Count -eq 1 -and $after[0] -notmatch 'Current State:\s*Captured') { break }
          }
          if ($after.Count -ne 1) {
            throw "After cleanup, exact Supreme count is $($after.Count), expected 1."
          }
          Write-Host '=== Supreme host state after cleanup ==='
          Write-Host $after[0]
          if ($after[0] -match 'Current State:\s*Captured') {
            throw 'Exact Supreme is still Captured by VirtualBox after cleanup.'
          }
          Write-Host 'RESULT=SUPREME_CONFIRMED_RETURNED_TO_WINDOWS'
