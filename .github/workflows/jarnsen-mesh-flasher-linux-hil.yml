name: JARNSEN-MESH Flasher Linux HIL
run-name: "JARNSEN-MESH-FLASHER Linux HIL · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-linux-hil.yml

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-linux-hil-${{ github.ref }}
  cancel-in-progress: true

env:
  JARNSEN_HIL_REFERENCE_BUILD: "184"
  JARNSEN_HIL_VM: "Jarnsen-Build"
  JARNSEN_SUPREME_SERIAL: "48:CA:43:5C:2F:EC"

jobs:
  virtualbox-host-attach:
    name: JARNO-PC · exact Supreme USB handoff
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    outputs:
      supreme_uuid: ${{ steps.attach.outputs.supreme_uuid }}

    steps:
      - name: Assert dedicated Windows host
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner=$env:RUNNER_NAME"
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing USB handoff on unexpected Windows runner '$env:RUNNER_NAME'."
          }

      - name: Locate exact Supreme and attach to running VM
        id: attach
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          $running = (& $vbox list runningvms 2>&1 | Out-String)
          Write-Host $running
          if ($running -notmatch ('"' + [regex]::Escape($env:JARNSEN_HIL_VM) + '"')) {
            throw "VirtualBox VM '$env:JARNSEN_HIL_VM' is not running."
          }

          $usb = (& $vbox list usbhost 2>&1 | Out-String)
          Write-Host $usb
          $blocks = @($usb -split '(?:\r?\n){2,}')
          $matches = @($blocks | Where-Object { $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) })
          if ($matches.Count -ne 1) {
            throw "Expected exactly one Supreme with serial $env:JARNSEN_SUPREME_SERIAL, found $($matches.Count)."
          }
          if ($matches[0] -notmatch 'UUID:\s*([0-9a-fA-F-]{36})') {
            throw 'Exact Supreme was found, but its VirtualBox USB UUID could not be parsed.'
          }
          $uuid = $Matches[1]
          "supreme_uuid=$uuid" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Exact Supreme UUID=$uuid"
          Write-Host 'MODE=USB_HANDOFF_ONLY_NO_RESET_NO_FLASH'

          & $vbox controlvm $env:JARNSEN_HIL_VM usbattach $uuid
          if ($LASTEXITCODE -ne 0) { throw "VirtualBox usbattach failed with exit code $LASTEXITCODE." }
          Start-Sleep -Seconds 3

          $after = (& $vbox list usbhost 2>&1 | Out-String)
          Write-Host $after
          Write-Host 'RESULT=SUPREME_USB_HANDOFF_REQUESTED'

  usb-inventory:
    name: Jarnsen-Build · read-only Supreme identity inventory
    needs: virtualbox-host-attach
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Assert dedicated Linux HIL runner
        shell: bash
        run: |
          set -euo pipefail
          printf 'Runner=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'ReferenceBuild=%s\n' "$JARNSEN_HIL_REFERENCE_BUILD"
          if [ "${RUNNER_NAME:-}" != "Jarnsen-Build" ]; then
            echo "Refusing HIL inventory on unexpected Linux runner '${RUNNER_NAME:-unknown}'." >&2
            exit 10
          fi

      - name: Wait for guest USB enumeration
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 15); do
            if compgen -G '/dev/ttyACM*' >/dev/null || compgen -G '/dev/ttyUSB*' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'No USB serial device appeared in the Linux guest.' >&2
          exit 2

      - name: Verify exact Supreme identity without opening port
        shell: bash
        run: |
          set -euo pipefail
          echo "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          echo 'MODE=READ_ONLY_NO_PORT_OPEN_NO_RESET_NO_FLASH'
          command -v lsusb >/dev/null 2>&1 && lsusb || true
          ls -la /dev/serial/by-id 2>/dev/null || true
          ls -la /dev/serial/by-path 2>/dev/null || true

          found=0
          for dev in /dev/ttyACM* /dev/ttyUSB*; do
            [ -e "$dev" ] || continue
            echo "--- $dev ---"
            props="$(udevadm info --query=property --name="$dev" 2>/dev/null || true)"
            printf '%s\n' "$props" | grep -E '^(DEVNAME|ID_VENDOR_ID|ID_MODEL_ID|ID_SERIAL=|ID_SERIAL_SHORT=|ID_PATH=|ID_USB_DRIVER=)' || true
            normalized="$(printf '%s' "$props" | tr -cd '[:alnum:]' | tr '[:lower:]' '[:upper:]')"
            if grep -Fq '48CA435C2FEC' <<< "$normalized"; then
              found=$((found + 1))
              echo "EXACT_SUPREME_DEVICE=$dev"
              echo "EXACT_SUPREME_REALPATH=$(readlink -f "$dev")"
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "RESULT=EXACT_SUPREME_IDENTITY_NOT_UNIQUE count=$found" >&2
            exit 3
          fi
          echo 'RESULT=EXACT_SUPREME_IDENTITY_VISIBLE_READ_ONLY'

  virtualbox-host-detach:
    name: JARNO-PC · return Supreme USB to Windows
    if: ${{ always() }}
    needs:
      - virtualbox-host-attach
      - usb-inventory
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Return exact Supreme to Windows host
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          SUPREME_UUID: ${{ needs.virtualbox-host-attach.outputs.supreme_uuid }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing USB cleanup on unexpected Windows runner '$env:RUNNER_NAME'."
          }
          if (-not $env:SUPREME_UUID) {
            Write-Host 'No Supreme UUID was emitted; nothing can be detached.'
            exit 0
          }

          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          Write-Host "Returning Supreme UUID=$env:SUPREME_UUID from VM '$env:JARNSEN_HIL_VM' to Windows."
          & $vbox controlvm $env:JARNSEN_HIL_VM usbdetach $env:SUPREME_UUID
          if ($LASTEXITCODE -ne 0) { throw "VirtualBox usbdetach failed with exit code $LASTEXITCODE." }
          Start-Sleep -Seconds 3
          & $vbox list usbhost
          Write-Host 'RESULT=SUPREME_RETURNED_TO_WINDOWS'
