name: Format mirror with Trunk once

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/format-mirror-trunk-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - name: Install Trunk
        run: |
          curl https://get.trunk.io -fsSL | bash -s -- -y
          echo "$HOME/.trunk/bin" >> "$GITHUB_PATH"

      - name: Format mirror sources exactly as Trunk expects
        run: |
          trunk fmt src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp
          trunk check src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp
          git diff --check

      - name: Commit formatted sources and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp
          git rm .github/workflows/format-mirror-trunk-once.yml
          git commit -m "style: format mirror sources with trunk"
          git push origin HEAD:feature/tactical-usb-display-mirror
