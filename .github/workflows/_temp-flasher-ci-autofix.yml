name: Temporary flasher CI autofix

on:
  push:
    branches:
      - feat/mini-serial-flasher

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Normalize changed flasher files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            black==26.5.1 \
            isort==8.0.1 \
            ruff==0.15.13

          mapfile -t py_files < <(
            git diff --name-only --diff-filter=ACMR origin/develop...HEAD -- \
              'tools/jarnsen_mesh_flasher/*.py' \
              'tools/jarnsen_mesh_flasher/tests/*.py'
          )

          if ((${#py_files[@]})); then
            python -m ruff check --fix "${py_files[@]}" || true
            python -m isort "${py_files[@]}"
            python -m black "${py_files[@]}"
          fi

          python - <<'PY'
          from pathlib import Path
          import subprocess

          names = subprocess.check_output(
              [
                  "git",
                  "diff",
                  "--name-only",
                  "--diff-filter=ACMR",
                  "origin/develop...HEAD",
              ],
              text=True,
          ).splitlines()
          allowed_workflows = {
              ".github/workflows/_temp-supreme-tracker-hil.yml",
              ".github/workflows/jarnsen-mesh-flasher-runner-recovery.yml",
              ".github/workflows/jarnsen-mesh-flasher-windows.yml",
          }
          for name in names:
              if not (
                  name.startswith("tools/jarnsen_mesh_flasher/")
                  or name in allowed_workflows
                  or name == "FLASHER_VERSION.json"
              ):
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              normalized = text.replace("\u2014", "-").replace("\u2013", "-")
              if normalized != text:
                  path.write_text(normalized, encoding="utf-8")
          PY

          python -m compileall -q tools/jarnsen_mesh_flasher

      - name: Commit autofixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temp-flasher-ci-autofix.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(flasher): normalize branch for CI'
          git push origin HEAD:feat/mini-serial-flasher
