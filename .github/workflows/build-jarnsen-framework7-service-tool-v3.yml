name: Build Jarnsen Framework7 Service Tool v3

on:
  push:
    branches:
      - feature/framework7-service-tool-v3
    paths:
      - 'tools/**'
      - '.github/workflows/build-jarnsen-framework7-service-tool-v3.yml'
  workflow_dispatch:

concurrency:
  group: jarnsen-framework7-v3
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-windows-app:
    runs-on: [self-hosted, Windows, X64]
    env:
      APP_BUILD_SHA: ${{ github.sha }}
      JARNSEN_TOOL_VERSION: '3.1.1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_BUILD_ISOLATION: '1'
      PIP_LOG: ${{ github.workspace }}\ci-logs\pip.log
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bootstrap isolated Python 3.12
        run: '& tools/ci/setup_jarnsen_ci_python.ps1'

      - name: Prepare portable Python build backend
        run: |
          & "$env:JARNSEN_PY" -m pip install --disable-pip-version-check --upgrade setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Python build backend setup failed with exit code $LASTEXITCODE" }
          & "$env:JARNSEN_PY" -c "import setuptools, setuptools.build_meta, wheel; print('setuptools build backend OK')"
          if ($LASTEXITCODE -ne 0) { throw "setuptools.build_meta validation failed" }

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build and validate Framework7 Windows app
        run: '& tools/ci/build_framework7_service_tool.ps1'

      - name: Upload Framework7 preview artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-framework7-v3
          path: artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Collect CI errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '& tools/ci/collect_jarnsen_ci_errors.ps1'

      - name: Upload errors artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARNSEN-SERVICE-TOOL-errors-Build-${{ github.run_number }}
          path: errors/
          if-no-files-found: warn
          retention-days: 14
