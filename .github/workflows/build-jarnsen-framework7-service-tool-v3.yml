name: Build Jarnsen Framework7 Service Tool v3
run-name: "JARNSEN-SERVICE-TOOL · v3.1.1-beta.3 · Build ${{ github.run_number }}"

on:
  push:
    branches:
      - feature/framework7-service-tool-v3
    paths:
      - 'tools/**'
      - 'SERVICE_TOOL_VERSION.json'
      - '.github/workflows/build-jarnsen-framework7-service-tool-v3.yml'
  workflow_dispatch:

concurrency:
  group: jarnsen-framework7-v3
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-windows-app:
    runs-on: [self-hosted, Windows, X64]
    env:
      APP_BUILD_SHA: ${{ github.sha }}
      PYTHONNOUSERSITE: '1'
      PIP_NO_BUILD_ISOLATION: '1'
      PIP_LOG: ${{ github.workspace }}\\ci-logs\\pip.log
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Bootstrap isolated Python 3.12
        run: '& tools/ci/setup_jarnsen_ci_python.ps1'
      - name: Resolve Service Tool version and build stage
        id: version
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $version = (& "$env:JARNSEN_PY" tools/jarnsen_service_tool_version.py).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) { throw 'Service Tool version resolution failed' }
          $stage = 'Release'; $buildLabel = 'Release'; $preRelease = 'false'
          if ($version -match '-alpha\.(\d+)$') { $stage = 'Alpha'; $buildLabel = "Alpha Build $($Matches[1])"; $preRelease = 'true' }
          elseif ($version -match '-beta\.(\d+)$') { $stage = 'Beta'; $buildLabel = "Beta Build $($Matches[1])"; $preRelease = 'true' }
          elseif ($version -match '-rc\.(\d+)$') { $stage = 'Release Candidate'; $buildLabel = "RC Build $($Matches[1])"; $preRelease = 'true' }
          "JARNSEN_TOOL_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "JARNSEN_TOOL_STAGE=$stage" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "JARNSEN_TOOL_BUILD_LABEL=$buildLabel" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "JARNSEN_TOOL_PRERELEASE=$preRelease" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "stage=$stage" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "build_label=$buildLabel" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Service Tool: v$version · $buildLabel"
      - name: Stamp resolved version into packaged source
        run: |
          $path = 'tools/JARNSEN_FRAMEWORK7_SERVICE_TOOL_V31.py'
          $source = Get-Content $path -Raw
          $source = [regex]::Replace($source, '3\.1\.1(?:-(?:alpha|beta|rc)\.\d+)?', $env:JARNSEN_TOOL_VERSION)
          foreach ($marker in @("Framework7 v$env:JARNSEN_TOOL_VERSION entry point", "version=$env:JARNSEN_TOOL_VERSION", "base.APP_VERSION = `"$env:JARNSEN_TOOL_VERSION`"")) {
            if ($source -notmatch [regex]::Escape($marker)) { throw "Framework7 version stamp failed: $marker" }
          }
          Set-Content -Path $path -Value $source -Encoding utf8
      - name: Prepare portable Python build backend
        run: |
          & "$env:JARNSEN_PY" -m pip install --disable-pip-version-check --upgrade setuptools wheel
          if ($LASTEXITCODE -ne 0) { throw "Python build backend setup failed with exit code $LASTEXITCODE" }
          & "$env:JARNSEN_PY" -c "import setuptools, setuptools.build_meta, wheel; print('setuptools build backend OK')"
          if ($LASTEXITCODE -ne 0) { throw 'setuptools.build_meta validation failed' }
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate visible version badge and USB popup script
        run: |
          & node --check tools/service_tool_web/version-v38.js
          if ($LASTEXITCODE -ne 0) { throw 'version-v38.js syntax validation failed' }
          & node --check tools/service_tool_web/usb-status-v320.js
          if ($LASTEXITCODE -ne 0) { throw 'usb-status-v320.js syntax validation failed' }
          $index = Get-Content tools/service_tool_web/index.html -Raw
          foreach ($marker in @('version-v38.css','version-v38.js','usb-status-v320.js')) { if ($index -notmatch [regex]::Escape($marker)) { throw "Service Tool asset wiring missing: $marker" } }
      - name: Build and validate Framework7 Windows app
        run: |
          & "$env:JARNSEN_PY" tools/patch_framework7_full_diagnostics_v313.py tools
          if ($LASTEXITCODE -ne 0) { throw 'Framework7 full diagnostics patch failed' }
          & tools/ci/build_framework7_service_tool.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Framework7 Windows build failed' }
      - name: Prepare versioned artifact and release notes
        if: success()
        run: |
          $version = $env:JARNSEN_TOOL_VERSION
          Copy-Item artifact/Jarnsen-Node-Service-Tool.exe "artifact/Jarnsen-Node-Service-Tool-v$version.exe" -Force
          Copy-Item artifact/jarnsen-node-service-tool.json "artifact/jarnsen-node-service-tool-v$version.json" -Force
          @"
          # Jarnsen Node Service Tool v$version
          **Status:** $env:JARNSEN_TOOL_STAGE  
          **Build:** $env:JARNSEN_TOOL_BUILD_LABEL  
          **Workflow:** Build ${{ github.run_number }}  
          **Commit:** ${{ github.sha }}
          ## Schwerpunkt dieses Builds
          - Framework7/iOS-Oberfläche als primäre Service-Tool-UI
          - vollständige v2.1.28-Funktionsparität bzw. Verbesserung
          - Neue-Nodes-/Serienbereitstellung über USB
          - Bespielvorlagen und wiederholtes Provisioning mit nur neuen Long-/Short-Namen
          - Firmwarequelle: aktuellste geprüfte Jarnsen-Firmware, gezielte GitHub-Auswahl oder lokale BIN/ZIP
          - Hardware-Guard, SHA-256-Prüfung und Soll/Ist-Rückprüfung vor erfolgreichem Abschluss
          - sichtbare Versions- und Buildkennzeichnung direkt im Tool
          ## Reifestatus
          Dieser Stand ist **$env:JARNSEN_TOOL_STAGE**. Er wird erst nach grünem CI-Build und Hardware-Abnahme zum Release Candidate hochgestuft.
          "@ | Set-Content -Encoding utf8 artifact/RELEASE.md
      - name: Upload Framework7 preview artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Jarnsen-Node-Service-Tool-v${{ steps.version.outputs.version }}
          path: |
            artifact/Jarnsen-Node-Service-Tool-v${{ steps.version.outputs.version }}.exe
            artifact/jarnsen-node-service-tool-v${{ steps.version.outputs.version }}.json
            artifact/RELEASE.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish visible Service Tool release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tag = 'jarnsen-service-tool-latest'
          $title = "Jarnsen Node Service Tool v$env:JARNSEN_TOOL_VERSION · $env:JARNSEN_TOOL_BUILD_LABEL · Build ${{ github.run_number }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0

          if (!$exists) {
            $createFlags = @('--repo', $env:GITHUB_REPOSITORY, '--target', '${{ github.sha }}', '--title', $title, '--notes-file', 'artifact/RELEASE.md')
            if ($env:JARNSEN_TOOL_PRERELEASE -eq 'true') { $createFlags += '--prerelease' }
            gh release create $tag @createFlags
            if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
          } else {
            # Do not pass --target when editing a rolling release. target_commitish
            # is creation metadata and trying to retarget the existing release/tag
            # caused GitHub's integration token to return HTTP 403 in Build 180.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes-file artifact/RELEASE.md
            if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht aktualisiert werden" }
          }

          $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseId)) { throw 'Service Tool Release-ID konnte nicht gelesen werden' }
          if ($env:JARNSEN_TOOL_PRERELEASE -eq 'true') { gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f prerelease=true -f make_latest=false *> $null }
          else { gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" -f prerelease=false -f make_latest=true *> $null }
          if ($LASTEXITCODE -ne 0) { throw 'Sichtbarkeit/Latest-Status des Service Tool Releases konnte nicht gesetzt werden' }

          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber artifact/Jarnsen-Node-Service-Tool.exe "artifact/Jarnsen-Node-Service-Tool-v$env:JARNSEN_TOOL_VERSION.exe" artifact/jarnsen-node-service-tool.json "artifact/jarnsen-node-service-tool-v$env:JARNSEN_TOOL_VERSION.json" artifact/RELEASE.md
          if ($LASTEXITCODE -ne 0) { throw 'Service Tool Release-Assets konnten nicht veröffentlicht werden' }
      - name: Mirror Service Tool into Tracker and V3 releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          foreach ($tag in @('jarnsen-tracker-latest','jarnsen-v3-latest')) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            $releaseExists = $LASTEXITCODE -eq 0
            if (!$releaseExists) {
              Write-Warning "Hardware-Tag $tag hat aktuell kein GitHub Release; Spiegelung wird übersprungen."
              $global:LASTEXITCODE = 0
              continue
            }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber artifact/Jarnsen-Node-Service-Tool.exe "artifact/Jarnsen-Node-Service-Tool-v$env:JARNSEN_TOOL_VERSION.exe" artifact/jarnsen-node-service-tool.json "artifact/jarnsen-node-service-tool-v$env:JARNSEN_TOOL_VERSION.json"
            if ($LASTEXITCODE -ne 0) { throw "Service Tool konnte nicht nach $tag gespiegelt werden" }
          }
          $global:LASTEXITCODE = 0
      - name: Collect CI errors
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '& tools/ci/collect_jarnsen_ci_errors.ps1'
      - name: Upload errors artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARNSEN-SERVICE-TOOL-errors-Build-${{ github.run_number }}
          path: errors/
          if-no-files-found: warn
          retention-days: 14
