name: Temporary Trunk green fix

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-trunk-green-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply and validate Python fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/jarnsen_mesh_flasher/_trunk_green_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/jarnsen_mesh_flasher/radio_profiles.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'for profile, key in MODEM_SETTING_KEYS.items():',
              'for _profile, key in MODEM_SETTING_KEYS.items():',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check \
            ruff==0.15.13 \
            black==26.5.1 \
            isort==8.0.1 \
            flake8==7.3.0 \
            bandit==1.9.4

          python -m ruff check \
            --select B007,B009,B010,B905 \
            --fix --unsafe-fixes \
            tools/jarnsen_mesh_flasher
          python -m isort tools/jarnsen_mesh_flasher tools/jarnsen_mesh_flasher_version.py
          python -m black tools/jarnsen_mesh_flasher tools/jarnsen_mesh_flasher_version.py
          python -m compileall -q tools/jarnsen_mesh_flasher tools/jarnsen_mesh_flasher_version.py

          python -m ruff check --select B,D401 tools/jarnsen_mesh_flasher
          python -m flake8 --select E402 tools/jarnsen_mesh_flasher
          python -m bandit -q -r -t B607 tools/jarnsen_mesh_flasher

      - name: Commit non-workflow fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/jarnsen_mesh_flasher/_trunk_green_fix.py
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(flasher): resolve Trunk code blockers'
          git push origin HEAD:feat/mini-serial-flasher

# rerun-marker: ruff-loop-cleanup
