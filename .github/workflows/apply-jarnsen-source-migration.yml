name: Apply JARNSEN source migration

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - '.jarnsen-source-migration'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: refactor/jarn-mesh-unified-core
          fetch-depth: 0

      - name: Apply verified source migration
        shell: bash
        run: |
          set -euo pipefail
          python .github/migrations/apply_jarnsen_migration.py
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git rm -f .jarnsen-source-migration .github/migrations/apply_jarnsen_migration.py
          git diff --cached --check
          git commit -m 'fix: unify JARNSEN display ownership and build packaging'
          git push origin HEAD:refactor/jarn-mesh-unified-core
