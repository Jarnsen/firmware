name: Apply Tracker GNSS and Display Timing Windows

on:
  push:
    branches:
      - automation/tracker-gnss-display-finalize
    paths:
      - .github/workflows/apply-tracker-gnss-display-windows.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute guarded transform embedded in staging workflow
        run: |
          @'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-tracker-gnss-display-finalize.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = textwrap.dedent(workflow[start:end])

          label = "'button press display timer')"
          label_pos = source.index(label)
          block_start = source.rfind('common = replace_once', 0, label_pos)
          block_end = label_pos + len(label)
          block_lines = source[block_start:block_end].splitlines()
          inner_lines = {
              'serviceLastActivityMs = now;',
              'displayStartedMs = now ? now : 1;',
              'displayWindowMs = lowBattery() ? TRACKER_COMMON_LOW_BATTERY_DISPLAY_MS : TRACKER_COMMON_DISPLAY_MS;',
              'displayVisible = true;',
              'resetDisplayWindow(now);',
          }
          fixed = []
          for line in block_lines:
              stripped = line.strip()
              if stripped in inner_lines:
                  fixed.append(' ' * 20 + stripped)
              elif stripped == '}':
                  fixed.append(' ' * 16 + stripped)
              else:
                  fixed.append(line)
          source = source[:block_start] + '\n'.join(fixed) + source[block_end:]
          exec(compile(source, 'tracker-gnss-display-transform.py', 'exec'))
          '@ | Set-Content -Encoding utf8 .tracker_transform_extract.py
          python .tracker_transform_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Commit transformed source
        run: |
          git config user.name "JARNSEN Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/vehicle/TrackerCommonPolicy.cpp src/vehicle/TrackerEnhancements.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "tracker: finalize GNSS and display timing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:automation/tracker-gnss-display-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
