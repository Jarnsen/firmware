name: Apply Tracker GNSS and Display Timing Windows

on:
  push:
    branches:
      - automation/tracker-gnss-display-finalize
    paths:
      - .github/workflows/apply-tracker-gnss-display-windows.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute guarded transform with indentation-normalized UI anchors
        run: |
          @'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-tracker-gnss-display-finalize.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = textwrap.dedent(workflow[start:end])

          def normalize_labeled_block(source, label, indent_map):
              label_pos = source.index(label)
              block_start = source.rfind('common = replace_once', 0, label_pos)
              block_end = label_pos + len(label)
              lines = source[block_start:block_end].splitlines()
              fixed = []
              for line in lines:
                  stripped = line.strip()
                  if stripped in indent_map:
                      fixed.append(' ' * indent_map[stripped] + stripped)
                  else:
                      fixed.append(line)
              return source[:block_start] + '\n'.join(fixed) + source[block_end:]

          source = normalize_labeled_block(source, "'button press display timer')", {
              'serviceLastActivityMs = now;': 20,
              'displayStartedMs = now ? now : 1;': 20,
              'displayWindowMs = lowBattery() ? TRACKER_COMMON_LOW_BATTERY_DISPLAY_MS : TRACKER_COMMON_DISPLAY_MS;': 20,
              'displayVisible = true;': 20,
              'resetDisplayWindow(now);': 20,
              '}': 16,
          })
          source = normalize_labeled_block(source, "'display close uses configured window')", {
              '(uint32_t)(serviceNow - displayStartedMs) >= displayWindowMs) {': 23,
              '!displayWindowActive()) {': 23,
              'closeDisplay();': 16,
              '}': 12,
          })

          exec(compile(source, 'tracker-gnss-display-transform.py', 'exec'))
          '@ | Set-Content -Encoding utf8 .tracker_transform_extract.py
          python .tracker_transform_extract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Commit transformed source
        run: |
          git config user.name "JARNSEN Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/vehicle/TrackerCommonPolicy.cpp src/vehicle/TrackerEnhancements.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "tracker: finalize GNSS and display timing"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:automation/tracker-gnss-display-finalize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
