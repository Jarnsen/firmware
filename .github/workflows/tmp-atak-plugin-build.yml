name: TMP Build Jarnsen Mrs ATAK Plugin

on:
  push:
    branches:
      - tmp/atak-jarnsen-mrs-build
    paths:
      - tmp/JarnsenMrsPlugin/**
      - .github/workflows/tmp-atak-plugin-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ATAK plugin compile
    runs-on: [self-hosted, Windows, X64, jarn-pc]
    timeout-minutes: 60

    defaults:
      run:
        working-directory: tmp/JarnsenMrsPlugin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $answers = (1..100 | ForEach-Object { 'y' }) -join [Environment]::NewLine
          $answers | & sdkmanager.bat --licenses | Out-Host
          & sdkmanager.bat "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Download official ATAK-CIV SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:TEMP 'jarnsen-atak-sdk.zip'
          $dir = Join-Path $env:TEMP 'jarnsen-atak-sdk'
          Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          & curl.exe -fL --retry 5 --retry-delay 3 -o $zip "https://github.com/TAK-Product-Center/atak-civ/releases/download/5.5.1.8/ATAK-CIV-5.5.1.8-SDK.zip"
          if ($LASTEXITCODE -ne 0) { throw "ATAK SDK download failed" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force

      - name: Prepare ATAK DevKit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:TEMP 'jarnsen-atak-sdk'

          $takdev = Get-ChildItem -Path $dir -Recurse -File -Filter 'atak-gradle-takdev*.jar' | Select-Object -First 1
          $mainjar = Get-ChildItem -Path $dir -Recurse -File -Filter 'main.jar' | Select-Object -First 1
          $keystore = Get-ChildItem -Path $dir -Recurse -File -Filter 'android_keystore' | Select-Object -First 1
          $mapping = Get-ChildItem -Path $dir -Recurse -File -Filter 'mapping.txt' | Select-Object -First 1
          $corerules = Get-ChildItem -Path $dir -Recurse -File -Filter 'proguard-release-keep.txt' | Select-Object -First 1

          Write-Host "TAKDEV=$($takdev.FullName)"
          Write-Host "MAINJAR=$($mainjar.FullName)"
          Write-Host "KEYSTORE=$($keystore.FullName)"
          Write-Host "MAPPING=$($mapping.FullName)"
          Write-Host "CORERULES=$($corerules.FullName)"

          if (-not $takdev) { throw "atak-gradle-takdev jar not found" }
          if (-not $mainjar) { throw "main.jar not found" }
          if (-not $keystore) { throw "android_keystore not found" }

          Copy-Item $takdev.FullName '.\atak-gradle-takdev.jar' -Force
          New-Item -ItemType Directory -Force -Path '.\sdk' | Out-Null
          Copy-Item $mainjar.FullName '.\sdk\main.jar' -Force
          Copy-Item $keystore.FullName '.\sdk\android_keystore' -Force

          if ($mapping) {
            Copy-Item $mapping.FullName '.\sdk\mapping.txt' -Force
          } else {
            New-Item -ItemType File -Force -Path '.\sdk\mapping.txt' | Out-Null
          }

          if ($corerules) {
            Copy-Item $corerules.FullName '.\sdk\proguard-release-keep.txt' -Force
          } else {
            New-Item -ItemType File -Force -Path '.\sdk\proguard-release-keep.txt' | Out-Null
          }

      - name: Compile CIV debug APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gradle.bat --no-daemon --stacktrace :app:assembleCivDebug
          if ($LASTEXITCODE -ne 0) { throw "Gradle build failed" }

      - name: Find APK
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path '.\app\build\outputs' -Recurse -File -Filter '*.apk' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host $_.FullName }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarnsen-Mrs-Plugin-ATAK-5.5.1.8
          path: tmp/JarnsenMrsPlugin/app/build/outputs/**/*.apk
          if-no-files-found: error
