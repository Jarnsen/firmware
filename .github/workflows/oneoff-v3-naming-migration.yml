name: One-off V3 naming migration

on:
  push:
    branches:
      - heltec-v3-repeater-light-sleep
    paths:
      - .github/workflows/oneoff-v3-naming-migration.yml
      - tools/patch_v3_naming_v171.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-v3-repeater-light-sleep
      - name: Apply checked V3 naming migration
        run: python tools/patch_v3_naming_v171.py
      - name: Create migrated blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in .github/workflows/build-heltec-v3-repeater-light-sleep.yml src/infrastructure/HeltecV3BuildInfo.h; do
            CONTENT=$(base64 -w0 "$FILE")
            RESPONSE=$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" -f content="$CONTENT" -f encoding=base64)
            SHA=$(echo "$RESPONSE" | python -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
            echo "MIGRATED_BLOB $FILE $SHA"
          done
