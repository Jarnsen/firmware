name: Temporary Tactical mirror hotfix

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/temporary-mirror-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply mirror stability and color fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mirror = Path("src/graphics/TacticalDisplayMirror.cpp")
          text = mirror.read_text(encoding="utf-8")

          replacements = [
              (
                  "constexpr uint32_t MIRROR_INPUT_PRIORITY_MS = 80;\nconstexpr size_t CHUNK_PAYLOAD_BYTES = 48;",
                  "constexpr uint32_t MIRROR_INPUT_PRIORITY_MS = 80;\n"
                  "constexpr uint32_t COLOR_FRAME_VALID_MS = 2000;\n"
                  "constexpr size_t COLOR_MONO_DIFFERENCE_BITS = 512;\n"
                  "constexpr size_t CHUNK_PAYLOAD_BYTES = 48;",
              ),
              (
                  "uint32_t emittedColorSequence = 0;\nbool colorBuilding = false;",
                  "uint32_t emittedColorSequence = 0;\n"
                  "uint32_t colorPublishedAt = 0;\n"
                  "bool colorBuilding = false;",
              ),
              (
                  "bool beforeDeadline(uint32_t now, uint32_t deadline)\n"
                  "{\n"
                  "    return static_cast<int32_t>(now - deadline) < 0;\n"
                  "}\n",
                  "bool beforeDeadline(uint32_t now, uint32_t deadline)\n"
                  "{\n"
                  "    return static_cast<int32_t>(now - deadline) < 0;\n"
                  "}\n\n"
                  "bool colorMonoMatchesDisplay(const uint8_t *displayBuffer, size_t monoBytes)\n"
                  "{\n"
                  "    if (!displayBuffer || colorPublishedMono.size() != monoBytes)\n"
                  "        return false;\n\n"
                  "    size_t differentBits = 0;\n"
                  "    for (size_t i = 0; i < monoBytes; ++i) {\n"
                  "        differentBits += static_cast<size_t>(\n"
                  "            __builtin_popcount(static_cast<unsigned>(colorPublishedMono[i] ^ displayBuffer[i])));\n"
                  "        if (differentBits > COLOR_MONO_DIFFERENCE_BITS)\n"
                  "            return false;\n"
                  "    }\n"
                  "    return true;\n"
                  "}\n\n"
                  "void mergeDisplayMonoOverlay(const uint8_t *displayBuffer)\n"
                  "{\n"
                  "    if (!displayBuffer || colorPublishedMono.empty() || colorPublished.empty())\n"
                  "        return;\n\n"
                  "    for (uint16_t y = 0; y < colorHeight; ++y) {\n"
                  "        const size_t pageOffset = static_cast<size_t>(y / 8U) * colorWidth;\n"
                  "        const uint8_t mask = static_cast<uint8_t>(1U << (y & 7U));\n"
                  "        for (uint16_t x = 0; x < colorWidth; ++x) {\n"
                  "            const size_t monoIndex = pageOffset + x;\n"
                  "            const bool finalPixel = (displayBuffer[monoIndex] & mask) != 0;\n"
                  "            const bool capturedPixel = (colorPublishedMono[monoIndex] & mask) != 0;\n"
                  "            const size_t pixelIndex = static_cast<size_t>(y) * colorWidth + x;\n"
                  "            if (finalPixel && !capturedPixel && colorPublished[pixelIndex] == 0x0000)\n"
                  "                colorPublished[pixelIndex] = 0xffff;\n"
                  "        }\n"
                  "    }\n"
                  "}\n",
              ),
              (
                  "    concurrency::LockGuard guard(&colorLock);\n"
                  "    if (colorSequence == emittedColorSequence || colorPublished.empty() || colorPublishedMono.empty() ||\n"
                  "        display->getWidth() != colorWidth || display->getHeight() != colorHeight)\n"
                  "        return false;\n\n"
                  "    const size_t monoBytes = static_cast<size_t>(colorWidth) * colorHeight / 8;\n"
                  "    if (colorPublishedMono.size() != monoBytes || memcmp(colorPublishedMono.data(), display->buffer, monoBytes) != 0)\n"
                  "        return false;\n",
                  "    concurrency::LockGuard guard(&colorLock);\n"
                  "    const uint32_t now = millis();\n"
                  "    if (colorSequence == emittedColorSequence || colorPublished.empty() || colorPublishedMono.empty() ||\n"
                  "        !colorPublishedAt || static_cast<uint32_t>(now - colorPublishedAt) > COLOR_FRAME_VALID_MS ||\n"
                  "        display->getWidth() != colorWidth || display->getHeight() != colorHeight)\n"
                  "        return false;\n\n"
                  "    const size_t monoBytes = static_cast<size_t>(colorWidth) * colorHeight / 8;\n"
                  "    if (!colorMonoMatchesDisplay(display->buffer, monoBytes))\n"
                  "        return false;\n\n"
                  "    mergeDisplayMonoOverlay(display->buffer);\n",
              ),
              (
                  "    colorWidth = width;\n"
                  "    colorHeight = height;\n"
                  "    colorWorking.assign(static_cast<size_t>(width) * height, backgroundRgb565);\n"
                  "    colorWorkingMono.clear();\n",
                  "    colorWidth = width;\n"
                  "    colorHeight = height;\n"
                  "    const size_t pixelCount = static_cast<size_t>(width) * height;\n"
                  "    if (colorWorking.size() != pixelCount)\n"
                  "        colorWorking.resize(pixelCount);\n"
                  "    std::fill(colorWorking.begin(), colorWorking.end(), backgroundRgb565);\n"
                  "    colorWorkingMono.clear();\n",
              ),
              (
                  "    if (colorPublished == colorWorking && colorPublishedMono == colorWorkingMono) {\n"
                  "        colorBuilding = false;\n"
                  "        return;\n"
                  "    }\n\n"
                  "    colorPublished = colorWorking;\n"
                  "    colorPublishedMono = colorWorkingMono;\n"
                  "    colorBuilding = false;\n"
                  "    ++colorSequence;\n",
                  "    colorPublishedAt = millis();\n"
                  "    if (colorPublished == colorWorking && colorPublishedMono == colorWorkingMono) {\n"
                  "        colorBuilding = false;\n"
                  "        return;\n"
                  "    }\n\n"
                  "    colorPublished = colorWorking;\n"
                  "    colorPublishedMono = colorWorkingMono;\n"
                  "    colorBuilding = false;\n"
                  "    ++colorSequence;\n",
              ),
              (
                  "    concurrency::LockGuard guard(&colorLock);\n"
                  "    if (!monoBuffer || colorPublished.empty() || !colorWidth || !colorHeight || !colorSequence ||\n"
                  "        colorPublishedMono.size() != monoBytes || memcmp(colorPublishedMono.data(), monoBuffer, monoBytes) != 0)\n"
                  "        return false;\n"
                  "    width = colorWidth;\n",
                  "    concurrency::LockGuard guard(&colorLock);\n"
                  "    const uint32_t now = millis();\n"
                  "    if (!monoBuffer || colorPublished.empty() || !colorWidth || !colorHeight || !colorSequence ||\n"
                  "        !colorPublishedAt || static_cast<uint32_t>(now - colorPublishedAt) > COLOR_FRAME_VALID_MS ||\n"
                  "        !colorMonoMatchesDisplay(monoBuffer, monoBytes))\n"
                  "        return false;\n"
                  "    mergeDisplayMonoOverlay(monoBuffer);\n"
                  "    width = colorWidth;\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Mirror patch anchor count {count}, expected 1: {old[:80]!r}")
              text = text.replace(old, new, 1)
          mirror.write_text(text, encoding="utf-8")

          thread = Path("src/graphics/TacticalDisplayMirrorThread.cpp")
          text = thread.read_text(encoding="utf-8")
          old = "    inputBroker->injectInputEvent(&event);\n    return true;"
          new = (
              "#if defined(HAS_FREE_RTOS) && !defined(ARCH_RP2040)\n"
              "    inputBroker->queueInputEvent(&event);\n"
              "#else\n"
              "    inputBroker->injectInputEvent(&event);\n"
              "#endif\n"
              "    return true;"
          )
          if text.count(old) != 1:
              raise SystemExit("Input queue patch anchor not found exactly once")
          thread.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Format changed sources
        run: |
          python -m pip install black==26.5.1 clang-format==16.0.3
          black tools/tactical-display-mirror/tactical_display_mirror.py
          clang-format -i src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-mirror-hotfix.yml
          git config user.name "Jarnsen Tactical Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graphics/TacticalDisplayMirror.cpp \
                  src/graphics/TacticalDisplayMirrorThread.cpp \
                  tools/tactical-display-mirror/tactical_display_mirror.py \
                  .github/workflows/temporary-mirror-hotfix.yml
          git commit -m "fix: stabilize mirror navigation and RGB565 matching"
          git push origin HEAD:feature/tactical-usb-display-mirror
