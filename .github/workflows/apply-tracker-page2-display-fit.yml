name: Apply Tracker Page2 Display Fit

on:
  push:
    branches:
      - automation/tracker-page2-display-fit
    paths:
      - .github/workflows/apply-tracker-page2-display-fit.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded page2 transform
        run: |
          python tools/ci/apply_tracker_page2_display_fit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --stat

      - name: Commit transformed source
        run: |
          git config user.name "JARNSEN Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/vehicle/TrackerStatusModule.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m "display: fit tracker node page to runtime geometry"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:automation/tracker-page2-display-fit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
