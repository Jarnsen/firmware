name: Temporary flasher targeted green fix

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-flasher-green-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply targeted fixes
        shell: bash
        run: |
          set -euo pipefail
          python tools/jarnsen_mesh_flasher/_ci_green_fix.py
          python -m pip install --disable-pip-version-check black==26.5.1 isort==8.0.1 ruff==0.15.13
          python -m ruff check --fix tools/jarnsen_mesh_flasher || true
          python -m isort tools/jarnsen_mesh_flasher
          python -m black tools/jarnsen_mesh_flasher
          python -m compileall -q tools/jarnsen_mesh_flasher

      - name: Commit targeted fixes and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temp-flasher-green-fix.yml
          rm -f tools/jarnsen_mesh_flasher/_ci_green_fix.py
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(flasher): harden HIL reference and CI security'
          git push origin HEAD:feat/mini-serial-flasher
