name: Apply Drone Repeater Unified-Core migration

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - '.github/scripts/apply_drone_repeater_migration.py'
      - '.github/workflows/apply-drone-repeater-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-drone-repeater-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    name: Apply and validate Drone Repeater migration
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: refactor/jarn-mesh-unified-core
          fetch-depth: 0

      - name: Apply migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/scripts/apply_drone_repeater_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run static gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = @(
            'python -m py_compile tools/jarnsen_preflight.py',
            'python -m py_compile tools/jarnsen_runtime_reliability_preflight.py',
            'python -m py_compile tools/jarnsen_final_parity_preflight.py',
            'python -m py_compile tools/jarnsen_packaging_preflight.py',
            'python -m py_compile tools/jarnsen_drone_repeater_preflight.py',
            'python tools/jarnsen_preflight.py',
            'python tools/jarnsen_runtime_reliability_preflight.py',
            'python tools/jarnsen_final_parity_preflight.py',
            'python tools/jarnsen_packaging_preflight.py',
            'python tools/jarnsen_drone_repeater_preflight.py',
            'git diff --check'
          )
          foreach ($cmd in $commands) {
            Write-Host "> $cmd"
            Invoke-Expression $cmd
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Commit migration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/scripts/apply_drone_repeater_migration.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rm .github/workflows/apply-drone-repeater-migration.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add src tools docs .github/workflows/build-jarn-mesh-unified-core.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name "Jarnsen"
          git config user.email "jarno.karsch@vodafone.de"
          git commit -m "feat: migrate Drone Repeater into Unified Core"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refactor/jarn-mesh-unified-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
