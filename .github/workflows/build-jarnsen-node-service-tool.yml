name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
      - heltec-v3-repeater-light-sleep
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml

concurrency:
  group: jarnsen-node-service-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip
      - name: Install packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash
      - name: Patch service tool status and UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tools/JARNSEN_NODE_SERVICE_TOOL.py")
          source = path.read_text(encoding="utf-8")

          battery_helper = '''def current_battery_line(text: str) -> str:
              live = list(re.finditer(r"(?m)^LIVE \\| BATTERY\\s+\\| ([^\\r\\n]+)", text))
              if live:
                  return live[-1].group(1)
              historical = list(re.finditer(r"\\| BATTERY\\s+\\| ([^\\r\\n]+)", text))
              return historical[-1].group(1) if historical else ""
          '''
          battery_helper = "\n".join(line[10:] if line.startswith("          ") else line for line in battery_helper.splitlines())
          ina_helper = battery_helper + '''

          def current_ina_state(text: str, unknown: str = "--") -> str:
              """Return the newest INA226 state in chronological log order."""
              state = unknown
              mapping = {
                  "ACTIVE": "ACTIVE",
                  "OK": "ACTIVE",
                  "WAIT": "WAIT",
                  "MISSING": "MISSING",
                  "OFF": "OFF",
              }
              for line in text.splitlines():
                  upper = line.upper()
                  if "BATTERY" in upper:
                      match = re.search(r"(?:^|\\s)ina=(ACTIVE|OK|WAIT|MISSING|OFF)(?:\\s|$)", line, re.IGNORECASE)
                      if match:
                          state = mapping[match.group(1).upper()]
                  if "INA226" not in upper:
                      continue
                  if re.search(r"\\b(?:READY|SAMPLE)\\b", upper):
                      state = "ACTIVE"
                  elif "ACK FAIL" in upper or "SENSOR MISSING" in upper or "SENSOR NOT READY" in upper or "ENABLED BUT SENSOR" in upper:
                      state = "MISSING"
                  elif "INA226=OFF" in upper or "INA226: OFF" in upper or "INA226 | OFF" in upper:
                      state = "OFF"
              return state
          '''
          ina_helper = "\n".join(line[10:] if line.startswith("          ") else line for line in ina_helper.splitlines())

          old_analyse = '''    ina = (
              "ACTIVE"
              if "ina=ACTIVE" in text or "INA226: ACTIVE" in text
              else ("OFF" if "ina=OFF" in text else "nicht ermittelt")
          )'''
          new_analyse = '''    ina = current_ina_state(text, "nicht ermittelt")'''

          old_snapshot = '''    ina = (
              "ACTIVE"
              if "ina=ACTIVE" in text or "INA226: ACTIVE" in text
              else (
                  "OFF"
                  if "ina=OFF" in text or "INA226: OFF" in text or "INA226 --" in text
                  else "--"
              )
          )'''
          new_snapshot = '''    ina = current_ina_state(text)'''

          version_anchor = 'GITHUB_REPOSITORY = "Jarnsen/firmware"'
          version_block = '''GITHUB_REPOSITORY = "Jarnsen/firmware"
          APP_VERSION = "1.2.0"
          APP_BUILD = "${{ github.sha }}"[:8]
          '''
          version_block = "\n".join(line[10:] if line.startswith("          ") else line for line in version_block.splitlines()).rstrip()

          title_old = '''        self.title_label = ttk.Label(
              title_row, text="Jarnsen Node Service Tool", style="Title.TLabel"
          )
          self.title_label.pack(side="left")'''
          title_new = '''        self.title_label = ttk.Label(
              title_row, text="Jarnsen Node Service Tool", style="Title.TLabel"
          )
          self.title_label.pack(side="left")
          self.app_version_label = ttk.Label(
              title_row,
              text=f"App v{APP_VERSION} · Build {APP_BUILD}",
              style="Subtitle.TLabel",
          )
          self.app_version_label.pack(side="left", padx=(12, 0))'''

          theme_old = '''        self.theme.pack(side="right")
          self.theme.bind("<<ComboboxSelected>>", lambda _event: self.apply_theme())'''
          theme_new = '''        self.theme.pack(side="right")
          self.restart_button = ttk.Button(
              title_row, text="App neu starten", command=self.restart_app
          )
          self.restart_button.pack(side="right", padx=(8, 8))
          self.theme.bind("<<ComboboxSelected>>", lambda _event: self.apply_theme())'''

          close_old = '''    def close_app(self) -> None:
              self.stop_event.set()
              self.live_stop.set()
              self.destroy()'''
          close_new = '''    def restart_app(self) -> None:
              if not messagebox.askyesno(
                  "App neu starten",
                  "Jarnsen Node Service Tool jetzt neu starten? Laufende Downloads werden beendet.",
              ):
                  return
              self.stop_event.set()
              self.live_stop.set()
              self.update_idletasks()
              try:
                  if getattr(sys, "frozen", False):
                      argv = [sys.executable, *sys.argv[1:]]
                  else:
                      argv = [sys.executable, os.path.abspath(sys.argv[0]), *sys.argv[1:]]
                  os.execv(sys.executable, argv)
              except Exception as exc:
                  messagebox.showerror("Neustart fehlgeschlagen", str(exc))

          def close_app(self) -> None:
              self.stop_event.set()
              self.live_stop.set()
              self.destroy()'''

          replacements = [
              (battery_helper, ina_helper, "INA helper anchor"),
              (old_analyse, new_analyse, "analyse_log INA parser"),
              (old_snapshot, new_snapshot, "diagnostic_snapshot INA parser"),
              (version_anchor, version_block, "app version anchor"),
              (title_old, title_new, "version label UI"),
              (theme_old, theme_new, "restart button UI"),
              (close_old, close_new, "restart method"),
          ]
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"{label} not found exactly once (count={source.count(old)})")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          print("Service tool patched: chronological INA state, app version, restart button")
          '@ | python -
      - name: Validate source
        shell: pwsh
        run: python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-submodules send2trash
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }
      - name: Collect app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          @"
          Jarnsen Node Service Tool v1.2.0
          ===============================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.
          Keine Python-Installation erforderlich.

          INA226-Status wird chronologisch aus BATTERY/READY/SAMPLE ausgewertet.
          App-Version und Build werden oben angezeigt; die App kann ueber den
          neuen Neustart-Button sauber neu gestartet werden.
          "@ | Set-Content -Encoding utf8 artifact/README.txt
      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error
