name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - jarnsen-node-service-tool
      - fix/service-tool-v2123-post-reset
    paths:
      - 'tools/**'
      - '.github/workflows/build-jarnsen-node-service-tool.yml'
  workflow_dispatch:

concurrency:
  group: jarnsen-node-service-tool-shared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install packager and serial flasher
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash esptool tkintermapview meshtastic==2.7.11

      - name: Patch shared service tool
        shell: pwsh
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          python tools/patch_jarnsen_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v14.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v15.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v16.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v17.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v18.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v19.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_metrics.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_ui.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_finalize.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_history.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v201_access.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_pages.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_fix.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/apply_jarnsen_service_tool_v211.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v212.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v213.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v214.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v215.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v216.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v217.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_errors.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_ble_busy.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_map_safety.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v219.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2111.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2112.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2113.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2115.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2116.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2116_fix.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2117.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2118.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2119_pre.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2119.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2120.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2121.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2122_compat.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2123.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2124.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/apply_jarnsen_service_tool_v2125.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Validate source and patchers
        shell: pwsh
        run: |
          Get-ChildItem tools/patch_jarnsen_service_tool*.py | ForEach-Object {
            python -m py_compile $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m py_compile tools/apply_jarnsen_service_tool_v211.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile tools/apply_jarnsen_service_tool_v2125.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile tools/validate_generated_service_tool.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_generated_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-all esptool
          --collect-submodules send2trash
          --collect-all tkintermapview
          --collect-all meshtastic
          --hidden-import _tkinter
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Test packaged app including Tcl Tk
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - name: Collect shared app and manifest
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          $exe = Get-Item artifact/Jarnsen-Node-Service-Tool.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            app = "Jarnsen Node Service Tool"
            version = "2.1.28"
            source_sha = "${{ github.sha }}"
            channel = "shared"
            executable = $exe.Name
            executable_size = $exe.Length
            executable_sha256 = $hash
            supported_devices = @("HELTEC_TRACKER_V1.1", "HELTEC_V3_REPEATER")
            hardware_profiles = @("TRACKER", "V3")
            features = @(
              "tabbed-full-profile-editor",
              "descriptor-driven-profile-controls",
              "protobuf-upb-profile-editor-compat",
              "profile-setting-cards",
              "enum-bool-dropdowns",
              "standard-jarnsen-a-jarnsen-b-rf-modes",
              "gated-authorized-frequency-a-b-ui",
              "authorized-hop-limit-up-to-20-gated",
              "authorized-duty-cycle-override-gated",
              "normal-meshtastic-limits-without-authorization",
              "one-jarnsen-pin-240180",
              "bluetooth-fixed-pin-240180",
              "service-admin-pin-policy",
              "15-minute-admin-unlock-policy",
              "persistent-full-lock-policy",
              "double-click-third-hold-3s-lock-gesture",
              "mesh-lock-alert-policy",
              "locked-full-unlocked-status-policy",
              "policy-last-usb-handoff",
              "profile-json-all-values-editor",
              "symmetric-read-write-profile-sections",
              "direct-admin-statusmessage-tak-write",
              "blank-target-name-preservation",
              "profile-source-name-prefill",
              "firmware-owned-position-verification",
              "firmware-owned-bluetooth-enabled-verification",
              "neighbor-info-policy-verification",
              "lora-standard-policy-verification",
              "delta-log-generation-cursor-sync",
              "jarnsen-tool-usb-handshake",
              "explicit-node-usb-ack",
              "manual-full-log-resync",
              "managed-node-log-sync-state",
              "full-device-reset-profile-provisioning",
              "serial-latest-firmware-plus-otabt",
              "canonical-tracker-jarn-mesh-manifest",
              "firmware-version-history-summary",
              "physical-usb-com-refind",
              "managed-node-database",
              "firmware-update-database-sync",
              "auto-usb-log-on-attach",
              "resilient-auto-usb-retry",
              "sticky-auto-usb-session",
              "post-reset-auto-usb-log-grace",
              "jarn-mesh-semantic-version-display",
              "profile-readback-verification",
              "usb-first-auto-profile-transport",
              "ble-authentication-guidance",
              "ble-ota",
              "serial-github-flash",
              "historical-position-map",
              "all-nodes-overview",
              "modern-all-nodes-kpi-overview",
              "expanded-ble-node-list",
              "screenshot-date-time-clock"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifact/jarnsen-node-service-tool.json
          @"
          Jarnsen Node Service Tool v2.1.28
          ================================
          - Tracker-Updates verwenden nur noch das offizielle JARN-MESH-v1.9.1-Manifest; der alte vehicle-motion-wake Alias wird vom Tool nicht mehr benutzt
          - Log-Historie zeigt Firmwarestände aus den neu eingelesenen JARN-MESH-Metadaten statt aus möglicherweise veralteten DB-Anzeigespalten
          - Oberhalb der Log-Historie erscheint ein eigener Versionsverlauf mit den letzten Firmware-/Build-Wechseln
          - Automatischer USB-Logdownload bleibt eine zusammenhängende Sitzung und gibt nicht zwischen kurzzeitigen Windows-CDC-Fehlern fälschlich auf
          - Bis zu acht COM/HELLO-Versuche mit physischem USB-Wiederfinden und 45-Sekunden-Fenster pro Versuch
          - Nur ein echter Benutzer-Abbruch oder das Schließen der App beendet die laufende Auto-USB-Sitzung vorzeitig
          - Neue Firmware-ACKs werden als eigener Schritt erkannt: COM offen -> HELLO gesendet -> Node bestätigt -> Exportmarker
          - ClearCommError, kurzzeitiges Zugriff-verweigert und COM-Neunummerierung werden beim Auto-Log selbstständig abgefangen
          - Firmwareanzeige nutzt die JARN-MESH Versionsnummer aus dem Diagnostikheader; die interne Meshtastic-Version bleibt nur als technische Zusatzinformation erhalten
          - Alle-Nodes-Seite übersichtlicher: KPI-Karten, größere Zeilen, Scrollleisten und mehr Platz für die wichtigsten Spalten
          - Linke Bluetooth-Node-Liste nutzt die verfügbare Höhe und zeigt deutlich mehr Nodes gleichzeitig
          - Datum/Uhrzeit laufen dauerhaft im Kopfbereich und sind damit auf Screenshots direkt sichtbar
          - Bluetooth-Fehler „Insufficient Authentication“ wird korrekt als Windows-Kopplungs-/Authentifizierungsproblem erklärt
          - Standard-LoRa-Policy wird vor der Rückprüfung normalisiert; kein falsches „Config lora“ nur wegen RF-Policy-Override
          - Profil-Editor bleibt mit der aktuellen Protobuf/upb-Laufzeit kompatibel
          - Beim Einlesen eines Grundprofils werden Long/Short Name der Node gelesen und direkt als Zielname vorausgefüllt
          - Werkreset/Provisionierung, verwaltete Node-Datenbank und Firmware-Status-Sync bleiben erhalten
          "@ | Set-Content -Encoding utf8 artifact/README.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error

      - name: Publish one app to all supported hardware releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tags = @('jarnsen-service-tool-latest','jarnsen-tracker-latest','jarnsen-v3-latest')
          foreach ($tag in $tags) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Automatisch gepflegter Jarnsen-Release."
              if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
            }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber artifact/Jarnsen-Node-Service-Tool.exe artifact/jarnsen-node-service-tool.json
            if ($LASTEXITCODE -ne 0) { throw "Service Tool konnte nicht nach $tag verteilt werden" }
          }

      - name: Publish README to shared app release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release upload jarnsen-service-tool-latest --repo $env:GITHUB_REPOSITORY --clobber artifact/README.txt
