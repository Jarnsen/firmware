name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - jarnsen-node-service-tool
    paths:
      - 'tools/**'
      - '.github/workflows/build-jarnsen-node-service-tool.yml'
  workflow_dispatch:

concurrency:
  group: jarnsen-node-service-tool-shared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install packager and serial flasher
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash esptool tkintermapview meshtastic==2.7.11

      - name: Patch shared service tool
        shell: pwsh
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          python tools/patch_jarnsen_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v14.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v15.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v16.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v17.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v18.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v19.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_metrics.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_ui.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_finalize.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_history.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v201_access.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_pages.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_fix.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/apply_jarnsen_service_tool_v211.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v212.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v213.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v214.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v215.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v216.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v217.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_errors.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_ble_busy.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v218_map_safety.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v219.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2111.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2112.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v2113.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Validate source and patchers
        shell: pwsh
        run: |
          $patchers = @(
            'tools/patch_jarnsen_service_tool.py',
            'tools/patch_jarnsen_service_tool_v14.py',
            'tools/patch_jarnsen_service_tool_v15.py',
            'tools/patch_jarnsen_service_tool_v16.py',
            'tools/patch_jarnsen_service_tool_v17.py',
            'tools/patch_jarnsen_service_tool_v18.py',
            'tools/patch_jarnsen_service_tool_v19.py',
            'tools/patch_jarnsen_service_tool_v20_metrics.py',
            'tools/patch_jarnsen_service_tool_v20_ui.py',
            'tools/patch_jarnsen_service_tool_v20_finalize.py',
            'tools/patch_jarnsen_service_tool_v20_history.py',
            'tools/patch_jarnsen_service_tool_v201_access.py',
            'tools/patch_jarnsen_service_tool_v21.py',
            'tools/patch_jarnsen_service_tool_v21_pages.py',
            'tools/patch_jarnsen_service_tool_v21_fix.py',
            'tools/patch_jarnsen_service_tool_v211_stability.py',
            'tools/apply_jarnsen_service_tool_v211.py',
            'tools/patch_jarnsen_service_tool_v212.py',
            'tools/patch_jarnsen_service_tool_v213.py',
            'tools/patch_jarnsen_service_tool_v214.py',
            'tools/patch_jarnsen_service_tool_v215.py',
            'tools/patch_jarnsen_service_tool_v216.py',
            'tools/patch_jarnsen_service_tool_v217.py',
            'tools/patch_jarnsen_service_tool_v218.py',
            'tools/patch_jarnsen_service_tool_v218_errors.py',
            'tools/patch_jarnsen_service_tool_v218_ble_busy.py',
            'tools/patch_jarnsen_service_tool_v218_map_safety.py',
            'tools/patch_jarnsen_service_tool_v219.py',
            'tools/patch_jarnsen_service_tool_v2111.py',
            'tools/patch_jarnsen_service_tool_v2112.py',
            'tools/patch_jarnsen_service_tool_v2113.py',
            'tools/validate_generated_service_tool.py'
          )
          foreach ($file in $patchers) {
            python -m py_compile $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/validate_generated_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-all esptool
          --collect-submodules send2trash
          --collect-all tkintermapview
          --collect-all meshtastic
          --hidden-import _tkinter
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Test packaged app including Tcl Tk
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - name: Collect shared app and manifest
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          $exe = Get-Item artifact/Jarnsen-Node-Service-Tool.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            app = "Jarnsen Node Service Tool"
            version = "2.1.13"
            source_sha = "${{ github.sha }}"
            channel = "shared"
            executable = $exe.Name
            executable_size = $exe.Length
            executable_sha256 = $hash
            supported_devices = @("HELTEC_TRACKER_V1.1", "HELTEC_V3_REPEATER")
            hardware_profiles = @("TRACKER", "V3")
            features = @(
              "editable-base-config-profiles",
              "profile-role-display",
              "profile-active-channel-display",
              "profile-actions-state-repair",
              "protobuf-safe-config-profile-capture",
              "frequency-independent-profile-capture",
              "reliable-onefile-temp-cmd-restart",
              "windowed-meshtastic-config-stream-compatibility",
              "four-meshtastic-base-config-profiles",
              "optional-channel-psk-profile-transfer",
              "authorized-915-two-frequency-slots",
              "device-identity-key-preservation",
              "configuration-reboot-readback-verification",
              "safe-online-map-object-clear",
              "ble-visible-but-not-free-status",
              "high-visibility-route-endpoints",
              "stationary-dwell-markers",
              "satellite-position-map",
              "hybrid-position-map",
              "jump-to-last-position",
              "manual-ble-selection-override",
              "historical-position-map",
              "position-map-day-filter",
              "position-map-date-range-filter",
              "central-selected-or-all-ble-log-download",
              "bluetooth-preflight-auto-repair",
              "multi-node-skip-on-failure",
              "persistent-tool-log",
              "all-nodes-overview",
              "two-page-node-overview",
              "no-scroll-1080p-dashboard",
              "serial-monitor",
              "bluetooth-serial-monitor",
              "serial-github-flash",
              "ble-ota",
              "diagnostic-bundle",
              "power-analytics"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifact/jarnsen-node-service-tool.json
          @"
          Jarnsen Node Service Tool v2.1.13
          ================================
          - Grundprofile zeigen jetzt die Meshtastic-Geräterolle und alle aktiven Kanäle mit Index, Name und PRIMARY/SECONDARY
          - vorhandene Profile können jederzeit erneut von einer Node eingelesen/aktualisiert werden
          - Profile können lokal bearbeitet werden: Profilname, Geräterolle, Kanalrolle und Kanalname
          - Auf Node übertragen wird nach abgeschlossenem Einlesen zuverlässig wieder freigeschaltet
          - leere Profilplätze lassen nur Einlesen/Aktualisieren zu; Übertragen/Bearbeiten/Löschen bleiben dort gesperrt
          - vollständige übrige Grundkonfiguration, Module, PSK-Option und Authorized-915-Vorbereitung aus v2.1.12 bleiben erhalten
          - Node-ID, private/public/admin Device-Keys und feste Positionsdaten werden weiterhin nicht übertragen
          "@ | Set-Content -Encoding utf8 artifact/README.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error

      - name: Publish one app to all supported hardware releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tags = @('jarnsen-service-tool-latest','jarnsen-tracker-latest','jarnsen-v3-latest')
          foreach ($tag in $tags) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Automatisch gepflegter Jarnsen-Release."
              if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
            }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber artifact/Jarnsen-Node-Service-Tool.exe artifact/jarnsen-node-service-tool.json
            if ($LASTEXITCODE -ne 0) { throw "Service Tool konnte nicht nach $tag verteilt werden" }
          }

      - name: Publish README to shared app release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release upload jarnsen-service-tool-latest --repo $env:GITHUB_REPOSITORY --clobber artifact/README.txt
