name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
      - heltec-v3-repeater-light-sleep
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml

concurrency:
  group: jarnsen-node-service-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip
      - name: Install packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial
      - name: Validate source
        shell: pwsh
        run: python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Collect app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          @"
          Jarnsen Node Service Tool
          =========================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.
          Keine Python-Installation erforderlich.

          Vor dem Start andere Serial-Monitore und Web-Flasher schliessen.
          "@ | Set-Content -Encoding utf8 artifact/README.txt
      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error
