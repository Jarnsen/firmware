name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - jarnsen-node-service-tool
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - tools/patch_jarnsen_service_tool.py
      - tools/patch_jarnsen_service_tool_v14.py
      - tools/patch_jarnsen_service_tool_v15.py
      - tools/patch_jarnsen_service_tool_v16.py
      - tools/patch_jarnsen_service_tool_v17.py
      - tools/patch_jarnsen_service_tool_v18.py
      - tools/patch_jarnsen_service_tool_v19.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  workflow_dispatch:

concurrency:
  group: jarnsen-node-service-tool-shared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip

      - name: Install packager and serial flasher
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash esptool

      - name: Patch shared service tool
        shell: pwsh
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          python tools/patch_jarnsen_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v14.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v15.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v16.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v17.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v18.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v19.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Validate source and patchers
        shell: pwsh
        run: |
          python -m py_compile tools/patch_jarnsen_service_tool.py
          python -m py_compile tools/patch_jarnsen_service_tool_v14.py
          python -m py_compile tools/patch_jarnsen_service_tool_v15.py
          python -m py_compile tools/patch_jarnsen_service_tool_v16.py
          python -m py_compile tools/patch_jarnsen_service_tool_v17.py
          python -m py_compile tools/patch_jarnsen_service_tool_v18.py
          python -m py_compile tools/patch_jarnsen_service_tool_v19.py
          python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-all esptool
          --collect-submodules send2trash
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - name: Collect shared app and manifest
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/

          $exe = Get-Item artifact/Jarnsen-Node-Service-Tool.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            app = "Jarnsen Node Service Tool"
            version = "1.9.0"
            source_sha = "${{ github.sha }}"
            channel = "shared"
            executable = $exe.Name
            executable_size = $exe.Length
            executable_sha256 = $hash
            supported_devices = @("HELTEC_TRACKER_V1.1", "HELTEC_V3_REPEATER")
            hardware_profiles = @("TRACKER", "V3")
            features = @(
              "adaptive-dpi-scaling",
              "whole-window-ui-zoom",
              "automatic-1080p-125dpi-fit",
              "paged-left-controls",
              "fixed-control-navigation",
              "scrollable-controls-fallback",
              "cleared-completion-progress",
              "movement-filtered-position-map",
              "serial-monitor",
              "bluetooth-serial-monitor",
              "serial-filter-search-pause-markers",
              "serial-session-logging",
              "serial-long-node-name-filename",
              "serial-copy-complete-log",
              "serial-live-power",
              "serial-github-flash",
              "ble-ota",
              "ota-recovery-assistant",
              "node-diagnostic-log-clear",
              "human-readable-runtime",
              "self-update-sha256",
              "diagnostic-bundle",
              "config-snapshot",
              "firmware-before-after",
              "anomaly-detection",
              "generic-hardware-profiles",
              "power-analytics",
              "battery-capacity-learning"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifact/jarnsen-node-service-tool.json

          @"
          Jarnsen Node Service Tool v1.9.0
          ===============================
          Eine gemeinsame portable Windows-App fuer Tracker V1.1, Heltec V3
          und spaetere Hardwareprofile. Keine Python-Installation erforderlich.

          Neu in v1.9.0:
          - Positionskarte aus den >25-m-TRACK_POINT-Eintraegen des Diagnoselogs
          - Strecke wird automatisch auf alle vorhandenen Punkte eingepasst
          - MGRS, Zeit, Quelle und Genauigkeit pro Punkt
          - Zoom und erneutes Einpassen direkt in der Kartenansicht
          - Positionskarten-Selbsttest im verpackten Windows-Build

          Seit v1.8.0 enthalten:
          - die linke Bedienseite ist in Nodes / USB / Bluetooth / Werkzeuge aufgeteilt
          - immer nur der gewaehlte Bereich ist sichtbar; dadurch ist bei 1920x1080/125 Prozent kein Scrollen noetig
          - Navigation, Abbrechen und Logordner bleiben dauerhaft sichtbar
          - eine Scrollleiste erscheint nur noch als Notfall-Fallback bei sehr kleinen Fenstern
          - nach Logdownload, USB-/BLE-Firmwareupdate, Fehler oder Abbruch wird der Fortschrittsbalken wieder geleert
          - die abschliessende Erfolgs- oder Fehlermeldung bleibt separat im Status sichtbar

          Seit v1.7.0 enthalten:
          - Serieller Monitor kann jetzt USB/COM oder Bluetooth als Quelle verwenden
          - Bluetooth nutzt den Meshtastic LOGRADIO-Livestream und schreibt ebenfalls einen kompletten Sitzungslog
          - BT-Logstream wird nur fuer die aktive Service-Sitzung freigegeben und danach wieder abgeschaltet
          - Zoom skaliert jetzt die gesamte Bedienoberflaeche: DPI, Abstaende, Tree-Zeilen, Canvas-Hoehen und Bedienelemente
          - neue Zoomstufen Automatisch / 75 / 85 / 100 / 115 / 130 Prozent
          - Automatisch kompensiert Windows-DPI; bei 1920x1080 mit 125 Prozent ergibt sich typischerweise etwa 80 Prozent App-Skalierung

          Weiter enthalten:
          - serielle Auto-Logs enthalten den langen Node-Namen im Dateinamen
          - kompletter serieller Sitzungslog per Button in die Zwischenablage
          - Laufzeiten als Tage / Stunden / Minuten
          - Node-Diagnose-Log nach Sicherheitsabfrage direkt per BLE loeschen
          - SHA-256-geprueftes App-Selbstupdate
          - Ein-Klick-Diagnosepaket mit Logs, App-/Portdaten und Konfig-Snapshot
          - Filter, Suche, Anzeige-Pause, Marker und Fehlerhervorhebung im Monitor
          - Live-Power-Anzeige mit Session-Durchschnitt und INA/BATTERY-Verlauf
          - Vorher/Nachher-Vergleich beim Firmwarewechsel und relative Anomalieerkennung
          - USB/serieller GitHub-Firmwareupload und Bluetooth-OTA
          - dieselbe EXE wird automatisch in Tracker- und V3-Release verteilt

          Hinweis BT-Seriellog:
          Fuer den gezielt freigegebenen BT-Livestream wird eine aktuelle Jarnsen-Firmware
          mit BTLOGON/BTLOGOFF-Unterstuetzung benoetigt. Der normale Meshtastic-Schalter
          debug_log_api_enabled muss dafuer nicht dauerhaft aktiviert werden.
          "@ | Set-Content -Encoding utf8 artifact/README.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error

      - name: Publish one app to all supported hardware releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tags = @(
            "jarnsen-service-tool-latest",
            "jarnsen-tracker-latest",
            "jarnsen-v3-latest"
          )
          foreach ($tag in $tags) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Automatisch gepflegter Jarnsen-Release."
              if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
            }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber `
              artifact/Jarnsen-Node-Service-Tool.exe `
              artifact/jarnsen-node-service-tool.json
            if ($LASTEXITCODE -ne 0) { throw "Service Tool konnte nicht nach $tag verteilt werden" }
          }

      - name: Publish README to shared app release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release upload jarnsen-service-tool-latest --repo $env:GITHUB_REPOSITORY --clobber artifact/README.txt
