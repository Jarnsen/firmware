name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
      - heltec-v3-repeater-light-sleep
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml

concurrency:
  group: jarnsen-node-service-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip
      - name: Install packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash
      - name: Normalize current INA226 status parser
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("tools/JARNSEN_NODE_SERVICE_TOOL.py")
          source = path.read_text(encoding="utf-8")

          old_analyse = '''    ina = (
              "ACTIVE"
              if "ina=ACTIVE" in text or "INA226: ACTIVE" in text
              else ("OFF" if "ina=OFF" in text else "nicht ermittelt")
          )'''
          new_analyse = '''    ina_token = dict(
              re.findall(r"(?:^|\\s)([A-Za-z][A-Za-z0-9]*)=([^\\s]+)", battery)
          ).get("ina", "").upper()
          ina = {
              "ACTIVE": "ACTIVE",
              "OK": "ACTIVE",
              "WAIT": "WAIT",
              "MISSING": "MISSING",
              "OFF": "OFF",
          }.get(
              ina_token,
              "ACTIVE" if "INA226: READY" in text else "nicht ermittelt",
          )'''

          old_snapshot = '''    ina = (
              "ACTIVE"
              if "ina=ACTIVE" in text or "INA226: ACTIVE" in text
              else (
                  "OFF"
                  if "ina=OFF" in text or "INA226: OFF" in text or "INA226 --" in text
                  else "--"
              )
          )'''
          new_snapshot = '''    ina_token = tokens.get("ina", "").upper()
          ina = {
              "ACTIVE": "ACTIVE",
              "OK": "ACTIVE",
              "WAIT": "WAIT",
              "MISSING": "MISSING",
              "OFF": "OFF",
          }.get(
              ina_token,
              "ACTIVE" if "INA226: READY" in text else "--",
          )'''

          if source.count(old_analyse) != 1:
              raise SystemExit("analyse_log INA226 parser block not found exactly once")
          if source.count(old_snapshot) != 1:
              raise SystemExit("diagnostic_snapshot INA226 parser block not found exactly once")

          source = source.replace(old_analyse, new_analyse, 1)
          source = source.replace(old_snapshot, new_snapshot, 1)
          path.write_text(source, encoding="utf-8")
          print("INA226 parser normalized: current BATTERY state wins; OK -> ACTIVE")
          '@ | python -
      - name: Validate source
        shell: pwsh
        run: python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-submodules send2trash
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }
      - name: Collect app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          @"
          Jarnsen Node Service Tool
          =========================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.
          Keine Python-Installation erforderlich.

          USB oder verschluesseltes Bluetooth LE verwenden. Die App fuehrt zur
          sicheren Windows-Bluetooth-Kopplung; die PIN-Eingabe erfolgt in Windows.
          Layouts: iOS, Modern, Modern Pro, Retro 90er und Matrix.
          Vor USB-Downloads andere Serial-Monitore und Web-Flasher schliessen.
          "@ | Set-Content -Encoding utf8 artifact/README.txt
      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error
