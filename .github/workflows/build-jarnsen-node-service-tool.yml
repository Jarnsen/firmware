name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - jarnsen-node-service-tool
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - tools/patch_jarnsen_service_tool.py
      - tools/patch_jarnsen_service_tool_v14.py
      - tools/patch_jarnsen_service_tool_v15.py
      - tools/patch_jarnsen_service_tool_v16.py
      - tools/patch_jarnsen_service_tool_v17.py
      - tools/patch_jarnsen_service_tool_v18.py
      - tools/patch_jarnsen_service_tool_v19.py
      - tools/patch_jarnsen_service_tool_v20_metrics.py
      - tools/patch_jarnsen_service_tool_v20_ui.py
      - tools/patch_jarnsen_service_tool_v20_finalize.py
      - tools/patch_jarnsen_service_tool_v20_history.py
      - tools/patch_jarnsen_service_tool_v201_access.py
      - tools/patch_jarnsen_service_tool_v21.py
      - tools/patch_jarnsen_service_tool_v21_pages.py
      - tools/patch_jarnsen_service_tool_v21_fix.py
      - tools/patch_jarnsen_service_tool_v211_stability.py
      - tools/apply_jarnsen_service_tool_v211.py
      - tools/validate_generated_service_tool.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  workflow_dispatch:

concurrency:
  group: jarnsen-node-service-tool-shared
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12
          cache: pip

      - name: Install packager and serial flasher
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash esptool tkintermapview

      - name: Patch shared service tool
        shell: pwsh
        env:
          APP_BUILD_SHA: ${{ github.sha }}
        run: |
          python tools/patch_jarnsen_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v14.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v15.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v16.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v17.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v18.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v19.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_metrics.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_ui.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_finalize.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v20_history.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v201_access.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_pages.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/patch_jarnsen_service_tool_v21_fix.py tools/JARNSEN_NODE_SERVICE_TOOL.py
          python tools/apply_jarnsen_service_tool_v211.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Validate source and patchers
        shell: pwsh
        run: |
          python -m py_compile tools/patch_jarnsen_service_tool.py
          python -m py_compile tools/patch_jarnsen_service_tool_v14.py
          python -m py_compile tools/patch_jarnsen_service_tool_v15.py
          python -m py_compile tools/patch_jarnsen_service_tool_v16.py
          python -m py_compile tools/patch_jarnsen_service_tool_v17.py
          python -m py_compile tools/patch_jarnsen_service_tool_v18.py
          python -m py_compile tools/patch_jarnsen_service_tool_v19.py
          python -m py_compile tools/patch_jarnsen_service_tool_v20_metrics.py
          python -m py_compile tools/patch_jarnsen_service_tool_v20_ui.py
          python -m py_compile tools/patch_jarnsen_service_tool_v20_finalize.py
          python -m py_compile tools/patch_jarnsen_service_tool_v20_history.py
          python -m py_compile tools/patch_jarnsen_service_tool_v201_access.py
          python -m py_compile tools/patch_jarnsen_service_tool_v21.py
          python -m py_compile tools/patch_jarnsen_service_tool_v21_pages.py
          python -m py_compile tools/patch_jarnsen_service_tool_v21_fix.py
          python -m py_compile tools/patch_jarnsen_service_tool_v211_stability.py
          python -m py_compile tools/apply_jarnsen_service_tool_v211.py
          python -m py_compile tools/validate_generated_service_tool.py
          python tools/validate_generated_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-all esptool
          --collect-submodules send2trash
          --collect-all tkintermapview
          --hidden-import _tkinter
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Test packaged app including Tcl Tk
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - name: Collect shared app and manifest
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/

          $exe = Get-Item artifact/Jarnsen-Node-Service-Tool.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            app = "Jarnsen Node Service Tool"
            version = "2.1.1"
            source_sha = "${{ github.sha }}"
            channel = "shared"
            executable = $exe.Name
            executable_size = $exe.Length
            executable_sha256 = $hash
            supported_devices = @("HELTEC_TRACKER_V1.1", "HELTEC_V3_REPEATER")
            hardware_profiles = @("TRACKER", "V3")
            features = @(
              "persistent-tool-log",
              "tcl-tk-startup-diagnostics",
              "ble-scan-fallback",
              "serial-throughput-diagnostics",
              "all-nodes-overview",
              "two-page-node-overview",
              "no-scroll-1080p-dashboard",
              "osm-position-map",
              "topographic-position-map",
              "offline-schema-map-fallback",
              "workflow-ui",
              "persistent-node-selector",
              "persistent-cancel",
              "direct-add-node",
              "direct-bluetooth-access",
              "direct-serial-access",
              "persistent-github-check",
              "smart-log-download",
              "smart-ble-ota",
              "advanced-controls-toggle",
              "v3-motion-status",
              "v3-gps-quality",
              "v3-live-position-count",
              "tracker-capacity-learning",
              "history-schema-migration",
              "movement-filtered-position-map",
              "adaptive-dpi-scaling",
              "whole-window-ui-zoom",
              "serial-monitor",
              "bluetooth-serial-monitor",
              "serial-github-flash",
              "ble-ota",
              "ota-recovery-assistant",
              "node-diagnostic-log-clear",
              "human-readable-runtime",
              "self-update-sha256",
              "diagnostic-bundle",
              "power-analytics"
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifact/jarnsen-node-service-tool.json

          @"
          Jarnsen Node Service Tool v2.1.1
          ===============================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.

          Stabilitaets- und Diagnoseupdate v2.1.1:
          - eigener Tool-Log pro Sitzung unter Downloads\Meshtastic-Logs\Tool-Logs
          - letzte 20 Tool-Sitzungen bleiben erhalten
          - Start, Tcl/Tk, Bluetooth-Scan, serielle Transfers und Exceptions werden protokolliert
          - Service-Seite bietet Tool-Log oeffnen
          - Windows-Build basiert auf Python 3.12 fuer robustere Tcl/Tk-Paketierung
          - Self-Test initialisiert jetzt wirklich Tk/Tcl; fehlendes init.tcl laesst den Build scheitern
          - Tcl/Tk-Verzeichnisse im PyInstaller-Onefile-Bundle werden beim Start automatisch erkannt
          - BLE-Suche zeigt bei fehlenden Service-UUIDs Windows-BLE-Kandidaten als Fallback an
          - serieller Download protokolliert Bytes, Dauer und effektive KiB/s

          Weiter enthalten:
          - Alle-Nodes-Startseite sowie Status- und Diagnose-Seite ohne Scrollen auf 1920x1080
          - OpenStreetMap, OpenTopoMap und Offline-Schema
          - + Node, Bluetooth, Seriell und GitHub pruefen dauerhaft erreichbar
          - USB/serieller Recovery, BLE OTA, Live, Historie und Diagnosepakete
          "@ | Set-Content -Encoding utf8 artifact/README.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error

      - name: Publish one app to all supported hardware releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          $tags = @(
            "jarnsen-service-tool-latest",
            "jarnsen-tracker-latest",
            "jarnsen-v3-latest"
          )
          foreach ($tag in $tags) {
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) {
              gh release create $tag --repo $env:GITHUB_REPOSITORY --title $tag --notes "Automatisch gepflegter Jarnsen-Release."
              if ($LASTEXITCODE -ne 0) { throw "Release $tag konnte nicht erstellt werden" }
            }
            gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber `
              artifact/Jarnsen-Node-Service-Tool.exe `
              artifact/jarnsen-node-service-tool.json
            if ($LASTEXITCODE -ne 0) { throw "Service Tool konnte nicht nach $tag verteilt werden" }
          }

      - name: Publish README to shared app release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh release upload jarnsen-service-tool-latest --repo $env:GITHUB_REPOSITORY --clobber artifact/README.txt
