name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
      - heltec-v3-repeater-light-sleep
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - .github/workflows/build-jarnsen-node-service-tool.yml

concurrency:
  group: jarnsen-node-service-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip
      - name: Install packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash
      - name: Patch service tool status and UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          path = Path("tools/JARNSEN_NODE_SERVICE_TOOL.py")
          source = path.read_text(encoding="utf-8")

          def function_span(text: str, name: str) -> tuple[int, int]:
              start = text.find(f"def {name}(")
              if start < 0:
                  raise SystemExit(f"function {name} not found")
              next_def = text.find("\ndef ", start + 1)
              next_class = text.find("\nclass ", start + 1)
              candidates = [value for value in (next_def, next_class) if value >= 0]
              end = min(candidates) if candidates else len(text)
              return start, end

          def replace_ina_assignment(text: str, function_name: str, replacement: str) -> str:
              start, end = function_span(text, function_name)
              block = text[start:end]
              marker = "    ina = ("
              rel = block.find(marker)
              if rel < 0:
                  # Support rebuilding a source that already contains an earlier normalized one-line parser.
                  match = re.search(r"(?m)^    ina = .*current_ina_state.*$", block)
                  if match:
                      block = block[:match.start()] + replacement + block[match.end():]
                      return text[:start] + block + text[end:]
                  raise SystemExit(f"INA assignment not found in {function_name}")
              pos = rel
              line_end = block.find("\n", pos)
              if line_end < 0:
                  line_end = len(block)
              depth = block[pos:line_end].count("(") - block[pos:line_end].count(")")
              scan = line_end
              while depth > 0 and scan < len(block):
                  next_end = block.find("\n", scan + 1)
                  if next_end < 0:
                      next_end = len(block)
                  segment = block[scan + 1:next_end]
                  depth += segment.count("(") - segment.count(")")
                  scan = next_end
              block = block[:pos] + replacement + block[scan:]
              return text[:start] + block + text[end:]

          if "def current_ina_state(" not in source:
              insert_at = source.find("\ndef log_metrics(")
              if insert_at < 0:
                  raise SystemExit("log_metrics anchor not found")
              helper = r'''

          def current_ina_state(text: str, unknown: str = "--") -> str:
              """Use the newest INA226 state event in actual log order."""
              state = unknown
              mapping = {
                  "ACTIVE": "ACTIVE",
                  "OK": "ACTIVE",
                  "WAIT": "WAIT",
                  "MISSING": "MISSING",
                  "OFF": "OFF",
              }
              for line in text.splitlines():
                  upper = line.upper()
                  if "BATTERY" in upper:
                      match = re.search(
                          r"(?:^|\s)ina=(ACTIVE|OK|WAIT|MISSING|OFF)(?:\s|$)",
                          line,
                          re.IGNORECASE,
                      )
                      if match:
                          state = mapping[match.group(1).upper()]
                  if "INA226" not in upper:
                      continue
                  if re.search(r"\b(?:READY|SAMPLE)\b", upper):
                      state = "ACTIVE"
                  elif any(
                      token in upper
                      for token in (
                          "ACK FAIL",
                          "SENSOR MISSING",
                          "SENSOR NOT READY",
                          "ENABLED BUT SENSOR",
                      )
                  ):
                      state = "MISSING"
                  elif any(
                      token in upper
                      for token in ("INA226=OFF", "INA226: OFF", "INA226 | OFF")
                  ):
                      state = "OFF"
              return state
          '''
              # YAML removes ten leading spaces from each line of this block.
              helper = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in helper.splitlines()
              )
              source = source[:insert_at] + helper + source[insert_at:]

          source = replace_ina_assignment(
              source,
              "analyse_log",
              '    ina = current_ina_state(text, "nicht ermittelt")',
          )
          source = replace_ina_assignment(
              source,
              "diagnostic_snapshot",
              '    ina = current_ina_state(text)',
          )

          if "APP_VERSION =" not in source:
              anchor = 'GITHUB_REPOSITORY = "Jarnsen/firmware"'
              if source.count(anchor) != 1:
                  raise SystemExit("GITHUB_REPOSITORY anchor not found exactly once")
              source = source.replace(
                  anchor,
                  anchor
                  + '\nAPP_VERSION = "1.2.0"'
                  + '\nAPP_BUILD = "${{ github.event.pull_request.head.sha || github.sha }}"[:8]',
                  1,
              )

          version_anchor = '        self.title_label.pack(side="left")'
          if "self.app_version_label" not in source:
              if source.count(version_anchor) != 1:
                  raise SystemExit("title label anchor not found exactly once")
              source = source.replace(
                  version_anchor,
                  version_anchor
                  + '''
              self.app_version_label = ttk.Label(
                  title_row,
                  text=f"App v{APP_VERSION} · Build {APP_BUILD}",
                  style="Subtitle.TLabel",
              )
              self.app_version_label.pack(side="left", padx=(12, 0))'''.replace("\n              ", "\n        "),
                  1,
              )

          theme_anchor = '        self.theme.pack(side="right")'
          if "self.restart_button" not in source:
              if source.count(theme_anchor) != 1:
                  raise SystemExit("theme pack anchor not found exactly once")
              source = source.replace(
                  theme_anchor,
                  theme_anchor
                  + '''
              self.restart_button = ttk.Button(
                  title_row, text="App neu starten", command=self.restart_app
              )
              self.restart_button.pack(side="right", padx=(8, 8))'''.replace("\n              ", "\n        "),
                  1,
              )

          if "    def restart_app(self)" not in source:
              close_anchor = "    def close_app(self) -> None:\n"
              if source.count(close_anchor) != 1:
                  raise SystemExit("close_app anchor not found exactly once")
              restart_method = '''    def restart_app(self) -> None:
              if not messagebox.askyesno(
                  "App neu starten",
                  "Jarnsen Node Service Tool jetzt neu starten? Laufende Downloads werden beendet.",
              ):
                  return
              self.stop_event.set()
              self.live_stop.set()
              self.update_idletasks()
              try:
                  if getattr(sys, "frozen", False):
                      argv = [sys.executable, *sys.argv[1:]]
                  else:
                      argv = [sys.executable, os.path.abspath(sys.argv[0]), *sys.argv[1:]]
                  os.execv(sys.executable, argv)
              except Exception as exc:
                  messagebox.showerror("Neustart fehlgeschlagen", str(exc))

          '''
              restart_method = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in restart_method.splitlines()
              ) + "\n"
              source = source.replace(close_anchor, restart_method + close_anchor, 1)

          # Build-time sanity checks for exactly the user-visible changes.
          for required in (
              'APP_VERSION = "1.2.0"',
              "def current_ina_state(",
              'ina = current_ina_state(text, "nicht ermittelt")',
              "ina = current_ina_state(text)",
              "self.app_version_label",
              'text="App neu starten"',
              "def restart_app(self)",
          ):
              if required not in source:
                  raise SystemExit(f"missing patched source marker: {required}")

          path.write_text(source, encoding="utf-8")
          print("Service tool patched: chronological INA state, app version, restart button")
          '@ | python -
      - name: Validate source
        shell: pwsh
        run: python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-submodules send2trash
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py
      - name: Test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }
      - name: Collect app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          @"
          Jarnsen Node Service Tool v1.2.0
          ===============================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.
          Keine Python-Installation erforderlich.

          INA226-Status wird chronologisch aus BATTERY/READY/SAMPLE ausgewertet.
          App-Version und Build werden oben angezeigt; die App kann ueber den
          neuen Neustart-Button sauber neu gestartet werden.
          "@ | Set-Content -Encoding utf8 artifact/README.txt
      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error
