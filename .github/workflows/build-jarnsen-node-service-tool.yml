name: Build Jarnsen Node Service Tool

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
      - heltec-v3-repeater-light-sleep
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - tools/patch_jarnsen_service_tool.py
      - .github/workflows/build-jarnsen-node-service-tool.yml
  pull_request:
    branches:
      - develop
    paths:
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - tools/patch_jarnsen_service_tool.py
      - .github/workflows/build-jarnsen-node-service-tool.yml

concurrency:
  group: jarnsen-node-service-tool-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows-app:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.13
          cache: pip

      - name: Install packager
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller pyserial bleak send2trash

      - name: Patch service tool status and UI
        shell: pwsh
        env:
          APP_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/patch_jarnsen_service_tool.py tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Validate source and patcher
        shell: pwsh
        run: |
          python -m py_compile tools/patch_jarnsen_service_tool.py
          python -m py_compile tools/JARNSEN_NODE_SERVICE_TOOL.py
          Select-String -Path tools/JARNSEN_NODE_SERVICE_TOOL.py -Pattern 'WLANSTART' -Quiet | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "WLANSTART fehlt im gepatchten Service Tool" }

      - name: Build portable Windows app
        shell: pwsh
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Jarnsen-Node-Service-Tool
          --collect-submodules serial
          --collect-all bleak
          --collect-submodules send2trash
          --hidden-import winrt.windows.devices.enumeration
          tools/JARNSEN_NODE_SERVICE_TOOL.py

      - name: Test packaged app
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/Jarnsen-Node-Service-Tool.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content Jarnsen-Node-Service-Tool-self-test.txt
          if ($process.ExitCode -ne 0) { throw "Packaged app self-test failed" }

      - name: Collect app and shared manifest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item dist/Jarnsen-Node-Service-Tool.exe artifact/
          $exe = Get-Item artifact/Jarnsen-Node-Service-Tool.exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            channel = "shared"
            version = "1.3.0"
            source_sha = "${{ github.event.pull_request.head.sha || github.sha }}"
            supported_devices = @("HELTEC_TRACKER_V1.1", "HELTEC_V3_REPEATER")
            executable_size = [int64]$exe.Length
            executable_sha256 = $hash
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 artifact/jarnsen-node-service-tool.json
          @"
          Jarnsen Node Service Tool v1.3.0
          ===============================
          Portable Windows-App fuer Tracker V1.1 und Heltec V3.
          Keine Python-Installation erforderlich.

          Neu: WLAN-Service kann verschluesselt per Bluetooth mit "WLAN starten" geoeffnet werden.
          INA226-Status wird chronologisch aus BATTERY/READY/SAMPLE ausgewertet.
          App-Version und Build werden oben angezeigt.
          Der Button "App neu starten" beendet laufende Arbeit und startet das Tool neu.
          "@ | Set-Content -Encoding utf8 artifact/README.txt

      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarnsen-node-service-tool-windows
          path: artifact/
          if-no-files-found: error

      - name: Publish shared Node Service Tool
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "jarnsen-service-tool-latest"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Jarnsen Node Service Tool - aktuell" --notes "Automatisch gepruefte gemeinsame Windows-App fuer Tracker V1.1 und Heltec V3."
            if ($LASTEXITCODE -ne 0) { throw "Shared Service-Tool Release konnte nicht angelegt werden" }
          }
          gh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber artifact/Jarnsen-Node-Service-Tool.exe artifact/jarnsen-node-service-tool.json
          if ($LASTEXITCODE -ne 0) { throw "Shared Service-Tool Release Upload fehlgeschlagen" }
