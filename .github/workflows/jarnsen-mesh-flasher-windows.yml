name: Build JARNSEN-MESH Flasher
run-name: "JARNSEN-MESH-FLASHER · v1.0.0-alpha.1 · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feat/mini-serial-flasher
    paths:
      - "tools/jarnsen_mesh_flasher/**"
      - "tools/jarnsen_mesh_flasher_version.py"
      - "FLASHER_VERSION.json"
      - ".github/workflows/jarnsen-mesh-flasher-windows.yml"

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows EXE · v1.0.0-alpha.1
    runs-on: [self-hosted, Windows, X64, jarn-pc]
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve JARNSEN-MESH-FLASHER version
        id: version
        shell: powershell
        run: |
          $hostPy = Join-Path $env:pythonLocation "python.exe"
          if (!(Test-Path $hostPy)) {
            throw "setup-python interpreter not found: $hostPy"
          }

          $version = (& $hostPy tools\jarnsen_mesh_flasher_version.py).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Flasher version resolution failed"
          }

          $stage = "Release"
          $buildLabel = "Release"
          if ($version -match '-alpha\.(\d+)$') {
            $stage = "Alpha"
            $buildLabel = "Alpha Build $($Matches[1])"
          }
          elseif ($version -match '-beta\.(\d+)$') {
            $stage = "Beta"
            $buildLabel = "Beta Build $($Matches[1])"
          }
          elseif ($version -match '-rc\.(\d+)$') {
            $stage = "Release Candidate"
            $buildLabel = "RC Build $($Matches[1])"
          }

          # Keep the generated Python file ASCII-only. Windows PowerShell 5.1 can
          # otherwise mojibake UTF-8 characters in inline run blocks. Python turns
          # the unicode escape into the visible middle dot at runtime.
          $versionFile = "tools\jarnsen_mesh_flasher\_build_version.py"
          $source = @(
            "from runtime_config import configure_runtime"
            ""
            ('APP_VERSION = "' + $version + ' \u00b7 Build ${{ github.run_number }}"')
            ""
            "configure_runtime()"
            ""
          ) -join [Environment]::NewLine
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($versionFile, $source, $utf8NoBom)

          "version=$version" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "build_label=$buildLabel" >> $env:GITHUB_OUTPUT
          "JARNSEN_FLASHER_VERSION=$version" >> $env:GITHUB_ENV
          "JARNSEN_FLASHER_STAGE=$stage" >> $env:GITHUB_ENV
          "JARNSEN_FLASHER_BUILD_LABEL=$buildLabel" >> $env:GITHUB_ENV

          Write-Host "JARNSEN-MESH-FLASHER - v$version - Build ${{ github.run_number }}"
          Write-Host "$buildLabel - $stage"
          & $hostPy --version

      - name: Install dependencies
        shell: powershell
        run: |
          $hostPy = Join-Path $env:pythonLocation "python.exe"
          if (Test-Path ".venv-flasher") {
            Remove-Item ".venv-flasher" -Recurse -Force
          }

          & $hostPy -m venv .venv-flasher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r tools\jarnsen_mesh_flasher\requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install "pyinstaller>=6.11,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python sources
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m compileall -q tools\jarnsen_mesh_flasher tools\jarnsen_mesh_flasher_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools\jarnsen_mesh_flasher\helper.py meshtastic --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools\jarnsen_mesh_flasher\helper.py esptool --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Validate the generated visible version inside Python so PowerShell does
          # not participate in the Unicode comparison.
          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from _build_version import APP_VERSION; expected=sys.argv[1]+' '+chr(183)+' Build '+sys.argv[2]; assert APP_VERSION == expected, (APP_VERSION, expected); print(repr(APP_VERSION))" "$env:JARNSEN_FLASHER_VERSION" "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build helper EXE
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name _JarnsenMeshHelper `
            --collect-all meshtastic `
            --collect-all esptool `
            --collect-all google.protobuf `
            tools\jarnsen_mesh_flasher\helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build JARNSEN-MESH-FLASHER EXE
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name JarnsenMeshFlasher `
            --paths tools\jarnsen_mesh_flasher `
            --collect-all customtkinter `
            tools\jarnsen_mesh_flasher\app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate built EXEs and visible version
        shell: powershell
        run: |
          if (!(Test-Path ".\dist\JarnsenMeshFlasher.exe")) {
            throw "JarnsenMeshFlasher.exe missing"
          }
          if (!(Test-Path ".\dist\_JarnsenMeshHelper.exe")) {
            throw "_JarnsenMeshHelper.exe missing"
          }

          & ".\dist\_JarnsenMeshHelper.exe" meshtastic --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\dist\_JarnsenMeshHelper.exe" esptool --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from _build_version import APP_VERSION; expected=sys.argv[1]+' '+chr(183)+' Build '+sys.argv[2]; assert APP_VERSION == expected, (APP_VERSION, expected); print('Embedded version OK:', repr(APP_VERSION))" "$env:JARNSEN_FLASHER_VERSION" "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare versioned package
        shell: powershell
        env:
          FLASHER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $prefix = "JARNSEN-MESH-FLASHER-v$env:FLASHER_VERSION-Build-${{ github.run_number }}"
          $packageDir = ".\dist\$prefix"
          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $packageDir | Out-Null

          Copy-Item ".\dist\JarnsenMeshFlasher.exe" "$packageDir\$prefix.exe"
          Copy-Item ".\dist\_JarnsenMeshHelper.exe" "$packageDir\_JarnsenMeshHelper.exe"
          Copy-Item ".\tools\jarnsen_mesh_flasher\README.md" "$packageDir\README.md"

          @"
          JARNSEN-MESH-FLASHER
          Version: v$env:FLASHER_VERSION
          Stage: $env:JARNSEN_FLASHER_STAGE
          Build Label: $env:JARNSEN_FLASHER_BUILD_LABEL
          GitHub Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}
          Logs: %USERPROFILE%\Downloads\Meshtastic-Logs\JARNSEN-MESHFLASHER
          "@ | Set-Content -Encoding UTF8 "$packageDir\BUILD-INFO.txt"

          Copy-Item ".\dist\JarnsenMeshFlasher.exe" ".\dist\$prefix.exe"
          $zip = ".\dist\$prefix.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Package: $zip"

      - name: Upload JARNSEN-MESH-FLASHER artifact
        uses: actions/upload-artifact@v7
        with:
          name: JARNSEN-MESH-FLASHER-v${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: |
            dist/JARNSEN-MESH-FLASHER-v${{ steps.version.outputs.version }}-Build-${{ github.run_number }}.zip
            dist/JARNSEN-MESH-FLASHER-v${{ steps.version.outputs.version }}-Build-${{ github.run_number }}.exe
            dist/_JarnsenMeshHelper.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload failure artifacts and diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: JARNSEN-MESH-FLASHER-ERROR-Build-${{ github.run_number }}
          path: |
            dist/**
            build/**/warn-*.txt
            build/**/xref-*.html
            *.spec
            tools/jarnsen_mesh_flasher/_build_version.py
            tools/jarnsen_mesh_flasher/runtime_config.py
          if-no-files-found: warn
          retention-days: 30
