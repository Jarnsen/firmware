name: Build JARNSEN-MESH Flasher
run-name: "JARNSEN-MESH-FLASHER · v1.0.0-alpha.1 · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - feat/mini-serial-flasher
    paths:
      - "tools/jarnsen_mesh_flasher/**"
      - "tools/jarnsen_mesh_flasher_version.py"
      - "FLASHER_VERSION.json"
      - ".github/workflows/jarnsen-mesh-flasher-windows.yml"

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows EXE · v1.0.0-alpha.1
    runs-on: [self-hosted, Windows, X64, jarn-pc]
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Resolve build Python
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\ci-logs" | Out-Null
          $diag = ".\ci-logs\python-discovery.txt"
          "Python discovery · Build ${{ github.run_number }}" | Set-Content -Encoding UTF8 $diag
          "Runner=$env:RUNNER_NAME" | Add-Content $diag
          "PATH=$env:PATH" | Add-Content $diag

          $candidates = New-Object System.Collections.Generic.List[string]
          $candidates.Add("$env:LOCALAPPDATA\Programs\Python\Python312\python.exe")
          $candidates.Add("$env:LOCALAPPDATA\Programs\Python\Python311\python.exe")
          $candidates.Add("$env:LOCALAPPDATA\Programs\Python\Python310\python.exe")
          $candidates.Add("$env:LOCALAPPDATA\Programs\Miniconda3\python.exe")

          try {
            foreach ($item in @(where.exe python 2>$null)) {
              if ($item) { $candidates.Add($item.Trim()) }
            }
          } catch {}

          try {
            $launcher = Join-Path $env:WINDIR "py.exe"
            if (Test-Path $launcher) {
              $launcherList = & $launcher -0p 2>&1
              ($launcherList | Out-String) | Add-Content $diag
              foreach ($line in @($launcherList)) {
                $text = $line.ToString().Trim()
                if ($text -match '(-V:3\.(?:10|11|12|13|14)[^ ]*\s+)(.+python\.exe)$') {
                  $candidates.Add($Matches[2].Trim())
                }
              }
            }
          } catch {}

          $resolved = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            "candidate=$candidate" | Add-Content $diag
            if (!(Test-Path $candidate)) {
              "  missing" | Add-Content $diag
              continue
            }

            try {
              $probe = & $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}'); print(sys.executable)" 2>&1
              ($probe | Out-String) | Add-Content $diag
              $first = @($probe)[0].ToString().Trim()
              $parts = $first.Split('.')
              if ($LASTEXITCODE -eq 0 -and $parts.Count -ge 2 -and [int]$parts[0] -eq 3 -and [int]$parts[1] -ge 10) {
                $resolved = $candidate
                break
              }
            } catch {
              "  failed: $($_.Exception.Message)" | Add-Content $diag
            }
          }

          if (!$resolved) {
            Get-Content $diag | Write-Host
            throw "No working Python 3.10+ interpreter found."
          }

          "JARNSEN_PYTHON=$resolved" >> $env:GITHUB_ENV
          "RESOLVED=$resolved" | Add-Content $diag
          Write-Host "Using build Python: $resolved"
          & $resolved --version

      - name: Resolve JARNSEN-MESH-FLASHER version
        id: version
        shell: powershell
        run: |
          $hostPy = $env:JARNSEN_PYTHON
          $version = (& $hostPy tools\jarnsen_mesh_flasher_version.py).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
            throw "Flasher version resolution failed"
          }

          $stage = "Release"
          $buildLabel = "Release"
          if ($version -match '-alpha\.(\d+)$') {
            $stage = "Alpha"
            $buildLabel = "Alpha Build $($Matches[1])"
          } elseif ($version -match '-beta\.(\d+)$') {
            $stage = "Beta"
            $buildLabel = "Beta Build $($Matches[1])"
          } elseif ($version -match '-rc\.(\d+)$') {
            $stage = "Release Candidate"
            $buildLabel = "RC Build $($Matches[1])"
          }

          $versionFile = "tools\jarnsen_mesh_flasher\_build_version.py"
          $source = @(
            "from runtime_config import configure_runtime"
            ""
            ('APP_VERSION = "' + $version + ' \u00b7 Build ${{ github.run_number }}"')
            ""
            "configure_runtime()"
            ""
          ) -join [Environment]::NewLine
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($versionFile, $source, $utf8NoBom)

          "version=$version" >> $env:GITHUB_OUTPUT
          "stage=$stage" >> $env:GITHUB_OUTPUT
          "build_label=$buildLabel" >> $env:GITHUB_OUTPUT
          "JARNSEN_FLASHER_VERSION=$version" >> $env:GITHUB_ENV
          "JARNSEN_FLASHER_STAGE=$stage" >> $env:GITHUB_ENV
          "JARNSEN_FLASHER_BUILD_LABEL=$buildLabel" >> $env:GITHUB_ENV

          Write-Host "JARNSEN-MESH-FLASHER - v$version - Build ${{ github.run_number }}"
          Write-Host "$buildLabel - $stage"

      - name: Install dependencies
        shell: powershell
        run: |
          if (Test-Path ".venv-flasher") {
            Remove-Item ".venv-flasher" -Recurse -Force
          }

          & $env:JARNSEN_PYTHON -m venv .venv-flasher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r tools\jarnsen_mesh_flasher\requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install "pyinstaller>=6.11,<7"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python sources
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m compileall -q tools\jarnsen_mesh_flasher tools\jarnsen_mesh_flasher_version.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $py tools\jarnsen_mesh_flasher\helper.py meshtastic --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools\jarnsen_mesh_flasher\helper.py esptool --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from profile_utils import summary_from_info_text; q=chr(34); text='Owner: Test Node (TN)'+chr(10)+'Metadata: { '+q+'role'+q+': '+q+'TAK_TRACKER'+q+' }'; s=summary_from_info_text(text); assert (s.long_name,s.short_name,s.role)==('Test Node','TN','TAK_TRACKER'), s"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from board_detection import detect; profiles={'tracker':{'pio_env':'heltec-wireless-tracker','match':('HELTEC WIRELESS TRACKER','WIRELESS TRACKER')},'repeater':{'pio_env':'heltec-v3','match':('HELTEC V3',)},'wio':{'pio_env':'seeed_wio_tracker_L1','match':('WIO TRACKER L1',)}}; nl=chr(10); assert detect('Device: Wireless Tracker'+nl+'pioEnv: seeed_wio_tracker_L1',profiles).board_key=='wio'; assert detect('pioEnv: heltec-wireless-tracker',profiles).board_key=='tracker'; assert detect('pioEnv: heltec-v3',profiles).board_key=='repeater'; assert detect('role: TAK_TRACKER'+nl+'Wireless Tracker',profiles).board_key is None"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from _build_version import APP_VERSION; expected=sys.argv[1]+' '+chr(183)+' Build '+sys.argv[2]; assert APP_VERSION == expected, (APP_VERSION, expected)" "$env:JARNSEN_FLASHER_VERSION" "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build embedded helper
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name _JarnsenMeshHelper `
            --collect-all meshtastic `
            --collect-all esptool `
            --collect-all google.protobuf `
            tools\jarnsen_mesh_flasher\helper.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build single JARNSEN-MESH-FLASHER EXE
        shell: powershell
        run: |
          $py = ".\.venv-flasher\Scripts\python.exe"
          $helper = (Resolve-Path ".\dist\_JarnsenMeshHelper.exe").Path
          & $py -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name JarnsenMeshFlasher `
            --paths tools\jarnsen_mesh_flasher `
            --collect-all customtkinter `
            --add-binary "$helper;." `
            tools\jarnsen_mesh_flasher\app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate single EXE and embedded helper
        shell: powershell
        run: |
          $exe = ".\dist\JarnsenMeshFlasher.exe"
          if (!(Test-Path $exe)) {
            throw "JarnsenMeshFlasher.exe missing"
          }

          & $exe --self-test-helper
          if ($LASTEXITCODE -ne 0) {
            throw "Embedded helper self-test failed with exit $LASTEXITCODE"
          }

          $py = ".\.venv-flasher\Scripts\python.exe"
          & $py -c "import sys; sys.path.insert(0, r'tools\jarnsen_mesh_flasher'); from _build_version import APP_VERSION; expected=sys.argv[1]+' '+chr(183)+' Build '+sys.argv[2]; assert APP_VERSION == expected, (APP_VERSION, expected)" "$env:JARNSEN_FLASHER_VERSION" "${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare versioned EXE
        shell: powershell
        env:
          FLASHER_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "JARNSEN-MESH-FLASHER-v$env:FLASHER_VERSION-Build-${{ github.run_number }}.exe"
          Copy-Item ".\dist\JarnsenMeshFlasher.exe" ".\dist\$name" -Force
          Write-Host "Artifact file: $name"

      - name: Upload JARNSEN-MESH-FLASHER artifact
        uses: actions/upload-artifact@v7
        with:
          name: JARNSEN-MESH-FLASHER-v${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: dist/JARNSEN-MESH-FLASHER-v${{ steps.version.outputs.version }}-Build-${{ github.run_number }}.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Prepare failure diagnostics
        if: ${{ failure() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path ".\ci-logs" | Out-Null
          $diag = ".\ci-logs\failure-summary.txt"
          "JARNSEN-MESH-FLASHER ERROR" | Set-Content -Encoding UTF8 $diag
          "Build: ${{ github.run_number }}" | Add-Content $diag
          "Commit: ${{ github.sha }}" | Add-Content $diag
          "Runner: $env:RUNNER_NAME" | Add-Content $diag
          "OS: $env:RUNNER_OS" | Add-Content $diag
          "JARNSEN_PYTHON=$env:JARNSEN_PYTHON" | Add-Content $diag
          "" | Add-Content $diag

          "dist files:" | Add-Content $diag
          if (Test-Path ".\dist") {
            (Get-ChildItem ".\dist" -Recurse | Select-Object FullName,Length | Format-Table -AutoSize | Out-String) | Add-Content $diag
          }

          "git status:" | Add-Content $diag
          (git status --short 2>&1 | Out-String) | Add-Content $diag

      - name: Upload failure artifacts and diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: JARNSEN-MESH-FLASHER-ERROR-Build-${{ github.run_number }}
          path: |
            dist/**
            build/**/warn-*.txt
            build/**/xref-*.html
            ci-logs/**
            *.spec
            tools/jarnsen_mesh_flasher/_build_version.py
            tools/jarnsen_mesh_flasher/runtime_config.py
            tools/jarnsen_mesh_flasher/profile_utils.py
          if-no-files-found: warn
          retention-days: 30
