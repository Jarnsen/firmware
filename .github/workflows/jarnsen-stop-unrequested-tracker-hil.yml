name: Stop unintended Tracker HIL preparation
on:
  push:
    branches: [feat/mini-serial-flasher]
    paths: [.github/workflows/jarnsen-stop-unrequested-tracker-hil.yml]
permissions:
  actions: write
jobs:
  cancel-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only before any hardware stage starts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = "https://api.github.com/repos/" + os.environ["GH_REPOSITORY"] + "/actions/runs/39020780897"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
                  return json.load(response)
          run = get(base)
          if run["status"] == "completed":
              print("Target already completed:", run["conclusion"])
          else:
              jobs = get(base + "/jobs")["jobs"]
              hardware = [s for j in jobs for s in j["steps"] if s["name"] in {
                  "Recover exact Tracker USB device before destructive HIL",
                  "Run complete Tracker V1.1 Flasher HIL"}]
              if len(hardware) != 2 or any(s["status"] != "pending" for s in hardware):
                  raise SystemExit("Hardware stage started or unknown; refusing to interrupt flash")
              request = urllib.request.Request(base + "/cancel", headers=headers, method="POST")
              with urllib.request.urlopen(request) as response:
                  print("Preparation cancellation requested:", response.status)
          PY
