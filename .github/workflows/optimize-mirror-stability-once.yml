name: Optimize mirror stability and clarity once

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/optimize-mirror-stability-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-mirror:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Tactical branch
        uses: actions/checkout@v7
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply crash-safety, reconnect and sharp-HD patch
        run: python .github/scripts/optimize_mirror.py

      - name: Install validation tools
        run: |
          python -m pip install --upgrade platformio==6.1.19 pyserial pillow
          curl https://get.trunk.io -fsSL | bash -s -- -y
          echo "$HOME/.trunk/bin" >> "$GITHUB_PATH"

      - name: Format and validate mirror
        run: |
          trunk fmt \
            src/graphics/TacticalDisplayMirror.cpp \
            src/graphics/TacticalDisplayMirrorThread.cpp \
            tools/tactical-display-mirror/tactical_display_mirror.py \
            tools/tactical-display-mirror/README.md
          python -m py_compile tools/tactical-display-mirror/tactical_display_mirror.py
          git diff --check

      - name: Build exact Heltec Wireless Tracker target
        run: pio run -e heltec-wireless-tracker

      - name: Commit optimized mirror and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/graphics/TacticalDisplayMirror.cpp \
            src/graphics/TacticalDisplayMirrorThread.cpp \
            tools/tactical-display-mirror/tactical_display_mirror.py \
            tools/tactical-display-mirror/START-DISPLAY-MIRROR-WINDOWS.bat \
            tools/tactical-display-mirror/README.md
          git rm .github/scripts/optimize_mirror.py
          git rm .github/workflows/optimize-mirror-stability-once.yml
          git commit -m "fix: harden mirror navigation and sharpen HD rendering"
          git push origin HEAD:feature/tactical-usb-display-mirror
