# consolidated-source validation: 2026-08-24T06:16:00+02:00
name: Build Heltec Tracker V1.1 Vehicle Motion Wake

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
  pull_request:
    branches:
      - develop
    paths:
      - src/vehicle/**
      - src/PowerFSM.cpp
      - src/graphics/Screen.cpp
      - src/graphics/Screen.h
      - src/nimble/NimbleBluetooth.cpp
      - src/nimble/NimbleBluetooth.h
      - src/platform/extra_variants/heltec_wireless_tracker/variant.cpp
      - tools/TRACKER_V11_DIAG_LOG_DOWNLOADER.py
      - tools/tracker_log_download.bat
      - tools/README-TRACKER-LOG.txt
      - variants/esp32s3/heltec_wireless_tracker/**
      - .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml

concurrency:
  group: heltec-tracker-v11-vehicle-motion-wake-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-heltec-tracker-v11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x
          cache: pip
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Verify shared Tracker architecture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('src/vehicle/TrackerVariantPolicy.cpp').read_text()
          common = Path('src/vehicle/TrackerCommonPolicy.cpp').read_text()
          status = Path('src/vehicle/TrackerStatusModule.cpp').read_text()
          nimble_h = Path('src/nimble/NimbleBluetooth.h').read_text()
          nimble = Path('src/nimble/NimbleBluetooth.cpp').read_text()
          power = Path('src/PowerFSM.cpp').read_text()
          power_monitor = Path('src/vehicle/TrackerPowerMonitor.cpp').read_text()
          common_flat = ' '.join(common.split())

          assert 'setupTrackerCommonPolicy();' in router
          assert 'setupHeltecTrackerV11TakLeaderPolicy();' not in router
          assert 'setupHeltecTrackerV11VehicleMotionTracker();' not in router
          assert 'setupVehicleServicePolicyV3Style();' not in router
          assert 'meshtastic_Config_DeviceConfig_Role_TAK_TRACKER' in common
          assert 'bool trackerUsesDeepSleep()' in common
          assert 'TAK=light sleep' in common
          assert 'TAK_TRACKER=deep sleep' in common
          assert 'trackerRealDeepSleep' in common
          assert 'returning to always-listening light sleep' in common

          for needle in [
              'TRACKER_COMMON_MOTION_QUIET_MS (120UL * 1000UL)',
              'TRACKER_COMMON_FINAL_GPS_WAIT_MS (30UL * 1000UL)',
              'TRACKER_COMMON_SLEEP_AFTER_POSITION_MS 8000UL',
              'trackerMotionConfirmCount()',
              'trackerMotionConfirmWindowMs()',
              'trackerApplyPositionSettings()',
              'vehicleAdaptiveTimerGpsWaitMs()',
              'trackerEffectiveParkIntervalSecs()',
              'Bluetooth remains off unless GPIO0 service is open',
              'trackerMovingGnssSecs()',
              'trackerParkGpsSearchSecs()',
              'trackerBleIdleTimeoutSecs()',
              'trackerBleHardTimeoutSecs()',
          ]:
              assert needle in common, needle

          assert 'trackerStatusRequestFocus();' in common
          assert 'screen->showNextFrame();' in common
          assert 'TRACKER_COMMON_SERVICE_IDLE_MS (120UL * 1000UL)' in common
          assert 'TRACKER_COMMON_SERVICE_MAX_MS (15UL * 60UL * 1000UL)' in common
          assert 'TRACKER_COMMON_DISPLAY_MS (20UL * 1000UL)' in common
          assert 'TRACKER_COMMON_LOW_BATTERY_DISPLAY_MS (10UL * 1000UL)' in common
          assert 'config.position.gps_update_interval = trackerMovingGnssSecs();' in common
          assert '(uint32_t)trackerBleIdleTimeoutSecs() * 1000UL' in common
          assert '(uint32_t)trackerBleHardTimeoutSecs() * 1000UL' in common

          for needle in [
              'MeshModule("Tracker")',
              'latLonToMgrs(',
              'KEINE POSITION',
              'GPS sucht...',
              'estimatedAccuracyMeters()',
              'ageSecs > 300U',
              'ageSecs > 60U',
              'TFTPalette::Red',
              'TFTPalette::Yellow',
              'registerTFTColorRegionDirect',
              'requestTrackerFocus()',
              'Screen::FOCUS_MODULE',
              'case TrackerMenu::MOVING_GNSS:',
              'case TrackerMenu::PARK_GPS_SEARCH:',
              'case TrackerMenu::BLE_IDLE:',
              'case TrackerMenu::BLE_HARD:',
              'case TrackerMenu::LOG_EXPORT:',
              'case TrackerMenu::DIAGNOSTICS:',
          ]:
              assert needle in status, needle

          assert 'TRACKER_COMMON_BLE_ACTIVITY_THRESHOLD 3U' in common
          assert 'TRACKER_COMMON_BLE_ACTIVITY_WINDOW_MS (10UL * 1000UL)' in common
          assert 'active BLE burst detected; %us idle timer reset' in common
          assert 'uint32_t getMeaningfulTrafficCount();' in nimble_h
          assert 'meaningfulBleTrafficCount.fetch_add(1);' in nimble
          assert 'Drop duplicate ToRadio packet' in nimble
          assert 'Count only non-empty payload reads' in nimble
          assert 'writeCount.fetch_add(1);\n        if (meshtasticTrackerBleActivity)' not in nimble
          read_start = nimble.index('Count only non-empty payload reads')
          read_window = nimble[read_start:read_start + 700]
          assert 'if (numBytes != 0)' in read_window
          assert 'meaningfulBleTrafficCount.fetch_add(1);' in read_window
          assert 'meshtasticTrackerBleActivity();' in read_window

          # GPIO7 remains FALLING while awake. LOW_LEVEL wake is armed only
          # for light sleep and is removed again before restoring the ISR.
          for needle in [
              'TrackerCommonLightSleepBeginObserver',
              'TrackerCommonLightSleepEndObserver',
              'detachInterrupt(digitalPinToInterrupt(VEHICLE_MOTION_WAKE_PIN));',
              'gpio_wakeup_enable(pin, GPIO_INTR_LOW_LEVEL)',
              'gpio_wakeup_disable(pin);',
              'commonLightSleepBeginObserver.observe(&notifyLightSleep);',
              'commonLightSleepEndObserver.observe(&notifyLightSleepEnd);',
              'motion wake available',
          ]:
              assert needle in common, needle
          attach = 'attachInterrupt(digitalPinToInterrupt(VEHICLE_MOTION_WAKE_PIN), motionISR, FALLING);'
          setup_anchor = attach + ' if (!motionLightSleepObserversInstalled)'
          assert attach in common_flat
          assert setup_anchor in common_flat
          assert attach + ' gpio_wakeup_enable((gpio_num_t)VEHICLE_MOTION_WAKE_PIN, GPIO_INTR_LOW_LEVEL);' not in common_flat

          assert 'trackerUsbKeepsCpuAwake()' in power
          assert 'if (trackerUsbKeepsCpuAwake())' in power
          assert 'remainingCapacityMah' in power_monitor
          assert 'Charge left: %u mAh' in status
          assert 'C:%u.%uAh' in status
          PY
      - name: Verify Tracker downloader package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TRACKER_V11_DIAG_LOG_DOWNLOADER.py' tools/tracker_log_download.bat
          grep -q 'ser.open()' tools/TRACKER_V11_DIAG_LOG_DOWNLOADER.py
          grep -q '{"NORMAL", 2, 3000}' src/vehicle/TrackerServiceSettings.cpp
          grep -q 'NORMAL.*2 Pulse.*3 s' docs/heltec-tracker-v11-service-menu.md
      - name: Stamp firmware build
        shell: bash
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${BUILD_SHA:0:8}"
          printf '#pragma once\n#define JARNSEN_BUILD_SHA "%s"\n' "$SHORT_SHA" > src/vehicle/JarnsenBuildGenerated.h
      - name: Build Heltec Wireless Tracker V1.1
        shell: bash
        run: |
          set -o pipefail
          pio run -e heltec-wireless-tracker 2>&1 | tee tracker-build.log
      - name: Extract compiler errors
        if: always()
        shell: bash
        run: |
          if [ -f tracker-build.log ]; then
            {
              echo '=== Compiler error matches ==='
              grep -n -E '(^|[[:space:]])(error:|fatal error:)|undefined reference|collect2: error|FAILED:' tracker-build.log || true
              echo
              echo '=== Last 300 build lines ==='
              tail -n 300 tracker-build.log
            } > tracker-compiler-errors.txt
          else
            echo 'tracker-build.log was not created' > tracker-compiler-errors.txt
          fi
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracker-compiler-errors
          path: tracker-compiler-errors.txt
      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/images
          BUILD_DIR=.pio/build/heltec-wireless-tracker
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-wireless-tracker-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-wireless-tracker-*.factory.bin' -print -quit)
          ELF=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-wireless-tracker-*.elf' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"
          test -n "$ELF"
          test -f tools/TRACKER_V11_DIAG_LOG_DOWNLOADER.py
          test -f tools/tracker_log_download.bat
          test -f tools/README-TRACKER-LOG.txt
          test -f tools/README-INA226-R100-TRACKER-V11.txt
          test -f docs/heltec-tracker-v11-wiring.md
          test -f docs/images/tracker-v11-pinout.svg
          test -f docs/images/tracker-v11-motion-schematic.svg
          test -f docs/images/tracker-v11-wiring.svg
          cp "$FACTORY_BIN" artifact/heltec-tracker-v11-vehicle-motion-wake.factory.bin
          cp "$APP_BIN" artifact/heltec-tracker-v11-vehicle-motion-wake.update.bin
          cp "$ELF" artifact/heltec-tracker-v11-vehicle-motion-wake.elf
          cp tools/TRACKER_V11_DIAG_LOG_DOWNLOADER.py artifact/
          cp tools/tracker_log_download.bat artifact/
          cp tools/README-TRACKER-LOG.txt artifact/
          cp tools/README-INA226-R100-TRACKER-V11.txt artifact/
          cp docs/heltec-tracker-v11-wiring.md artifact/README-BEWEGUNGSSENSOR-SW-18010P.md
          cp docs/images/tracker-v11-pinout.svg artifact/images/
          cp docs/images/tracker-v11-motion-schematic.svg artifact/images/
          cp docs/images/tracker-v11-wiring.svg artifact/images/
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heltec-tracker-v11-vehicle-motion-wake
          path: artifact/
