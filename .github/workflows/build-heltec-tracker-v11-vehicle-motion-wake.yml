name: Finalize Tracker TAK and TAK_TRACKER source

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
          fetch-depth: 0

      - name: Finalize Tracker source
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"{label}: anchor missing in {path}")
              p.write_text(s.replace(old, new, 1))

          def write(path, text):
              Path(path).write_text(text)

          # -----------------------------------------------------------------
          # Screen: genuine boot handoff + hard ownership after boot.
          # -----------------------------------------------------------------
          replace_once(
              'src/graphics/Screen.h',
              '''};
          } // namespace graphics

          bool shouldWakeOnReceivedMessage();'''.replace('          ', ''),
              '''};

          // True only after Screen has actually processed STOP_BOOT_SCREEN.
          bool isBootScreenComplete();
          } // namespace graphics

          bool shouldWakeOnReceivedMessage();'''.replace('          ', ''),
              'Screen.h boot-state API')

          replace_once(
              'src/graphics/Screen.cpp',
              '''FrameCallback *normalFrames;
          static uint32_t targetFramerate = IDLE_FRAMERATE;'''.replace('          ', ''),
              '''FrameCallback *normalFrames;
          static uint32_t targetFramerate = IDLE_FRAMERATE;
          static bool bootScreenComplete = false;

          bool isBootScreenComplete()
          {
              return bootScreenComplete;
          }

          static bool trackerOwnsScreenAfterBoot()
          {
          #if defined(HELTEC_TRACKER_V1_1)
              return config.device.role == meshtastic_Config_DeviceConfig_Role_TAK ||
                     config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER;
          #else
              return false;
          #endif
          }'''.replace('          ', ''),
              'Screen.cpp boot-state storage')

          replace_once(
              'src/graphics/Screen.cpp',
              '''void Screen::handleSetOn(bool on, FrameCallback einkScreensaver)
          {
              if (!useDisplay)'''.replace('          ', ''),
              '''void Screen::handleSetOn(bool on, FrameCallback einkScreensaver)
          {
              // SET_ON/SET_OFF are queued. They reach handleSetOn() directly and
              // therefore must obey the Tracker ownership hook here as well as
              // in Screen::setOn().
              if (meshtasticTrackerScreenPowerAllowed && !meshtasticTrackerScreenPowerAllowed(on))
                  return;

              if (!useDisplay)'''.replace('          ', ''),
              'Screen.cpp queued power gate')

          replace_once(
              'src/graphics/Screen.cpp',
              '''        case Cmd::STOP_ALERT_FRAME:
              NotificationRenderer::pauseBanner = false;
              // Return from one-off alert mode back to regular frames.
              if (!showingNormalScreen && NotificationRenderer::current_notification_type != notificationTypeEnum::text_input) {
                  setFrames();
              }
              break;
          case Cmd::STOP_BOOT_SCREEN:
              EINK_ADD_FRAMEFLAG(dispdev, COSMETIC); // E-Ink: Explicitly use full-refresh for next frame
              if (NotificationRenderer::current_notification_type != notificationTypeEnum::text_input) {
                  setFrames();
              }
              break;'''.replace('          ', ''),
              '''        case Cmd::STOP_ALERT_FRAME:
              NotificationRenderer::pauseBanner = false;
              // TAK/TAK_TRACKER never fall back to the stock carousel after
              // boot. Their local service frame is the only post-boot UI.
              if (!trackerOwnsScreenAfterBoot() && !showingNormalScreen &&
                  NotificationRenderer::current_notification_type != notificationTypeEnum::text_input) {
                  setFrames();
              }
              break;
          case Cmd::STOP_BOOT_SCREEN:
              EINK_ADD_FRAMEFLAG(dispdev, COSMETIC); // E-Ink: Explicitly use full-refresh for next frame
              bootScreenComplete = true;
              if (!trackerOwnsScreenAfterBoot() &&
                  NotificationRenderer::current_notification_type != notificationTypeEnum::text_input) {
                  setFrames();
              }
              break;'''.replace('          ', ''),
              'Screen.cpp boot/alert ownership')

          replace_once(
              'src/graphics/Screen.cpp',
              '''void Screen::setFrames(FrameFocus focus)
          {
              // Block setFrames calls when virtual keyboard is active to prevent overlay interference'''.replace('          ', ''),
              '''void Screen::setFrames(FrameFocus focus)
          {
              // Once the real boot screen has ended, TAK/TAK_TRACKER never show
              // the normal Meshtastic carousel. This removes the last source of
              // stock-frame flashes underneath the custom service UI.
              if (bootScreenComplete && trackerOwnsScreenAfterBoot())
                  return;

              // Block setFrames calls when virtual keyboard is active to prevent overlay interference'''.replace('          ', ''),
              'Screen.cpp setFrames ownership')

          # -----------------------------------------------------------------
          # NimBLE: only real PHONE->RADIO writes count as service activity.
          # Keep pairing PIN on top of the custom frame when pairing ends.
          # -----------------------------------------------------------------
          replace_once(
              'src/nimble/NimbleBluetooth.cpp',
              '#include "sleep.h"\n',
              '#include "sleep.h"\n#if HAS_SCREEN\n#include "graphics/draw/NotificationRenderer.h"\n#endif\n\nextern "C" void meshtasticTrackerBleActivity() __attribute__((weak));\n',
              'NimBLE tracker activity hook')

          replace_once(
              'src/nimble/NimbleBluetooth.cpp',
              '''#if HAS_SCREEN
              if (screen) {
                  screen->endAlert();
              }
          #endif'''.replace('          ', ''),
              '''#if HAS_SCREEN
              if (screen) {
          #if defined(HELTEC_TRACKER_V1_1)
                  const bool trackerCustomRole = config.device.role == meshtastic_Config_DeviceConfig_Role_TAK ||
                                                 config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER;
                  if (trackerCustomRole) {
                      // Pairing is only an overlay on our service frame. Clearing
                      // the banner must not end the custom full-screen alert.
                      graphics::NotificationRenderer::resetBanner();
                      screen->runNow();
                      return;
                  }
          #endif
                  screen->endAlert();
              }
          #endif'''.replace('          ', ''),
              'NimBLE pairing frame preservation')

          replace_once(
              'src/nimble/NimbleBluetooth.cpp',
              '''        int currentWriteCount = bluetoothPhoneAPI->writeCount.fetch_add(1);
          
          #ifdef DEBUG_NIMBLE_ON_WRITE_TIMING'''.replace('          ', ''),
              '''        int currentWriteCount = bluetoothPhoneAPI->writeCount.fetch_add(1);
              if (meshtasticTrackerBleActivity)
                  meshtasticTrackerBleActivity();

          #ifdef DEBUG_NIMBLE_ON_WRITE_TIMING'''.replace('          ', ''),
              'NimBLE real phone-write activity')

          # -----------------------------------------------------------------
          # Shared user settings: SW-18010P defaults suited to the RC input.
          # -----------------------------------------------------------------
          replace_once(
              'src/vehicle/TrackerServiceSettings.cpp',
              '''// Presets are intentionally small and conservative. Index 2 preserves the
          // current project baseline: 3 falling edges within 3 seconds.'''.replace('          ', ''),
              '''// SW-18010P + 100 nF produces short, mechanically variable pulses.
          // NORMAL therefore needs two edges in three seconds; the more robust
          // modes remain available from the local service menu.'''.replace('          ', ''),
              'motion preset comment')

          replace_once(
              'src/vehicle/TrackerServiceSettings.cpp',
              '''constexpr MotionPreset MOTION_PRESETS[] = {
              {"VERY SENS", 2, 3000},
              {"SENSITIVE", 3, 4000},
              {"NORMAL", 3, 3000},
              {"ROBUST", 4, 3000},
          };'''.replace('          ', ''),
              '''constexpr MotionPreset MOTION_PRESETS[] = {
              {"VERY SENS", 1, 3000},
              {"SENSITIVE", 2, 4000},
              {"NORMAL", 2, 3000},
              {"ROBUST", 3, 3000},
          };'''.replace('          ', ''),
              'SW-18010P motion presets')

          # -----------------------------------------------------------------
          # TAK_TRACKER motion state machine: use the menu settings for real.
          # USB/serial suppresses sleeping, but no longer suppresses motion
          # processing, so bench tests see the same movement qualification.
          # -----------------------------------------------------------------
          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '#include "NodeDB.h"\n',
              '#include "NodeDB.h"\n#include "TrackerServiceSettings.h"\n',
              'vehicle settings include')

          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '''#ifndef VEHICLE_MOTION_CONFIRM_COUNT
          #define VEHICLE_MOTION_CONFIRM_COUNT 3U
          #endif

          #ifndef VEHICLE_MOTION_CONFIRM_WINDOW_MS
          #define VEHICLE_MOTION_CONFIRM_WINDOW_MS 3000UL
          #endif

          '''.replace('          ', ''),
              '',
              'remove fixed motion qualification')

          p = Path('src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp')
          s = p.read_text()
          s = s.replace('VEHICLE_MOTION_CONFIRM_COUNT', 'vehicleMotionConfirmCount()')
          s = s.replace('VEHICLE_MOTION_CONFIRM_WINDOW_MS', 'vehicleMotionConfirmWindowMs()')
          p.write_text(s)

          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '''static void IRAM_ATTR vehicleMotionISR()
          {
              motionEdgeSequence++;
          }

          extern "C" void meshtasticVehiclePhoneContact()'''.replace('          ', ''),
              '''static void IRAM_ATTR vehicleMotionISR()
          {
              motionEdgeSequence++;
          }

          static uint8_t vehicleMotionConfirmCount()
          {
              return trackerMotionConfirmCount();
          }

          static uint32_t vehicleMotionConfirmWindowMs()
          {
              return trackerMotionConfirmWindowMs();
          }

          extern "C" void meshtasticVehiclePhoneContact()'''.replace('          ', ''),
              'dynamic motion helpers')

          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '''        LOG_INFO("Tracker V1.1: motion wake candidate on GPIO%d (1/%u)", VEHICLE_MOTION_WAKE_PIN,
                           (unsigned)vehicleMotionConfirmCount());
              }

              if (config.device.button_gpio == VEHICLE_MOTION_WAKE_PIN) {'''.replace('          ', ''),
              '''        LOG_INFO("Tracker V1.1: motion wake candidate on GPIO%d (1/%u)", VEHICLE_MOTION_WAKE_PIN,
                           (unsigned)vehicleMotionConfirmCount());
                  if (motionCandidateCount >= vehicleMotionConfirmCount())
                      confirmVehicleMotion(millis());
              }

              if (config.device.button_gpio == VEHICLE_MOTION_WAKE_PIN) {'''.replace('          ', ''),
              'single-pulse EXT0 qualification')

          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '''    if (newEdges != 0) {
                  processedMotionEdgeSequence = currentSequence;
                  registerVehicleMotionEdges(newEdges);
              }'''.replace('          ', ''),
              '''    if (newEdges != 0) {
                  processedMotionEdgeSequence = currentSequence;
                  LOG_DEBUG("Tracker V1.1 motion: GPIO%d +%u edge(s), candidate=%u/%u active=%u",
                            VEHICLE_MOTION_WAKE_PIN, (unsigned)newEdges, (unsigned)motionCandidateCount,
                            (unsigned)vehicleMotionConfirmCount(), confirmedMotionStillActive(millis()) ? 1U : 0U);
                  registerVehicleMotionEdges(newEdges);
              }'''.replace('          ', ''),
              'TAK_TRACKER raw motion diagnostics')

          replace_once(
              'src/vehicle/HeltecTrackerV11VehicleMotionTracker.cpp',
              '''        if (vehicleUsbPowered())
                  return 1000;

              const esp_sleep_wakeup_cause_t wakeCause = esp_sleep_get_wakeup_cause();'''.replace('          ', ''),
              '''        // USB/serial deliberately blocks managed deep sleep in
              // requestVehicleSleep(), but motion/GNSS must keep running so a
              // bench test behaves like an unplugged tracker.

              const esp_sleep_wakeup_cause_t wakeCause = esp_sleep_get_wakeup_cause();'''.replace('          ', ''),
              'USB must not disable motion processing')

          # -----------------------------------------------------------------
          # TAK: real boot handoff, stable screen ownership, service-only BLE,
          # fresh display-time arithmetic and real GPIO0 activity semantics.
          # -----------------------------------------------------------------
          p = Path('src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp')
          s = p.read_text()
          s = s.replace('''#ifndef TAK_LEADER_BOOT_HANDOFF_MS
          // Meshtastic's normal Screen logo_timeout is 5 s on this target. Give its
          // STOP_BOOT_SCREEN command another 500 ms to complete before TAK owns the TFT.
          #define TAK_LEADER_BOOT_HANDOFF_MS 5500UL
          #endif
          
          '''.replace('          ', ''), '')
          s = s.replace('static bool leaderScreenPowerAuthorized = false;\n', '')
          s = s.replace('static uint32_t leaderBootTakeoverStartedMs = 0;\n', '')
          s = s.replace('static uint32_t leaderServiceLastActivityMs = 0;\n', 'static volatile uint32_t leaderServiceLastActivityMs = 0;\n')
          p.write_text(s)

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''extern "C" bool meshtasticTrackerScreenPowerAllowed(bool on)
          {
              (void)on;
              if (!takLeaderEnabled())
                  return true;

              // During the stock boot logo Meshtastic may manage the TFT normally.
              // Afterwards TAK owns all power transitions; only calls wrapped by
              // setTakLeaderScreenPower() are accepted.
              if (!leaderBootHandoffComplete)
                  return true;
              return leaderScreenPowerAuthorized;
          }

          static void setTakLeaderScreenPower(bool on)
          {
              if (!screen)
                  return;
              leaderScreenPowerAuthorized = true;
              screen->setOn(on);
              leaderScreenPowerAuthorized = false;
          }'''.replace('          ', ''),
              '''static bool takLeaderWantsScreenOn()
          {
              if (!leaderServiceActive || leaderDisplayStartedMs == 0)
                  return false;
              return (uint32_t)(millis() - leaderDisplayStartedMs) < leaderDisplayWindowMs;
          }

          bool takLeaderScreenPowerAllowed(bool on)
          {
              if (!takLeaderEnabled())
                  return true;
              if (!leaderBootHandoffComplete)
                  return true;
              return on == takLeaderWantsScreenOn();
          }

          void takLeaderBleActivity()
          {
              if (takLeaderEnabled() && leaderServiceActive)
                  leaderServiceLastActivityMs = millis();
          }

          static void setTakLeaderScreenPower(bool on)
          {
              if (screen)
                  screen->setOn(on);
          }'''.replace('          ', ''),
              'TAK shared screen/BLE hooks')

          p = Path('src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp')
          s = p.read_text()
          start = s.find('static bool takLeaderBleConnected()')
          if start < 0:
              raise SystemExit('TAK BLE connected helper missing')
          end = s.find('static void setTakLeaderBluetooth', start)
          if end < 0:
              raise SystemExit('TAK Bluetooth setter missing')
          s = s[:start] + s[end:]
          p.write_text(s)

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''static void setTakLeaderBluetooth(bool enabled)
          {
              if (leaderBluetoothOn == enabled)
                  return;
              setBluetoothEnable(enabled);
              leaderBluetoothOn = enabled;
          }'''.replace('          ', ''),
              '''static void setTakLeaderBluetooth(bool enabled)
          {
              if (leaderBluetoothOn == enabled)
                  return;

          #if defined(ARCH_ESP32) && !defined(CONFIG_IDF_TARGET_ESP32S2) && !MESHTASTIC_EXCLUDE_BLUETOOTH
              if (enabled) {
                  config.bluetooth.enabled = true;
                  if (!nimbleBluetooth || !nimbleBluetooth->isActive())
                      setBluetoothEnable(true);
              } else {
                  if (nimbleBluetooth && nimbleBluetooth->isActive())
                      nimbleBluetooth->deinit();
                  config.bluetooth.enabled = false;
              }
          #else
              config.bluetooth.enabled = enabled;
          #endif
              leaderBluetoothOn = enabled;
          }'''.replace('          ', ''),
              'TAK service-only Bluetooth')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    if (graphics::NotificationRenderer::current_notification_type == graphics::notificationTypeEnum::pairing_pin)
                  graphics::NotificationRenderer::drawBannercallback(display, state);'''.replace('          ', ''),
              '''    if (graphics::NotificationRenderer::current_notification_type == graphics::notificationTypeEnum::pairing_pin) {
                  const bool wasPaused = graphics::NotificationRenderer::pauseBanner;
                  graphics::NotificationRenderer::pauseBanner = false;
                  graphics::NotificationRenderer::drawBannercallback(display, state);
                  graphics::NotificationRenderer::pauseBanner = wasPaused;
              }'''.replace('          ', ''),
              'TAK pairing PIN overlay')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    if (!screen->isScreenOn()) {
                  // Install the custom frame BEFORE powering the panel. On Tracker V1.1
                  // every power-on reinitializes the TFT/UI; queueing our frame first
                  // prevents the stock carousel from becoming visible during that wake.
                  screen->startAlert(drawTakLeaderServiceFrame);
                  leaderServiceFrameActive = true;
                  setTakLeaderScreenPower(true);
                  screen->runNow();
              } else if (!leaderServiceFrameActive) {'''.replace('          ', ''),
              '''    if (!screen->isScreenOn()) {
                  // TFT power-up rebuilds the UI. Queue ON first and our custom
                  // alert second, so the service frame is the final visible state.
                  setTakLeaderScreenPower(true);
                  screen->startAlert(drawTakLeaderServiceFrame);
                  leaderServiceFrameActive = true;
                  screen->runNow();
              } else if (!leaderServiceFrameActive) {'''.replace('          ', ''),
              'TAK TFT wake ordering')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    leaderDisplayStartedMs = millis();
              leaderDisplayWindowMs = takLeaderLowBattery() ? TAK_LEADER_LOW_BATTERY_DISPLAY_MS : TAK_LEADER_DISPLAY_MS;
              powerFSM.trigger(EVENT_PRESS);
              startTakLeaderServiceFrame();'''.replace('          ', ''),
              '''    leaderDisplayStartedMs = millis();
              leaderDisplayWindowMs = takLeaderLowBattery() ? TAK_LEADER_LOW_BATTERY_DISPLAY_MS : TAK_LEADER_DISPLAY_MS;
              startTakLeaderServiceFrame();'''.replace('          ', ''),
              'TAK page render without PowerFSM churn')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    if (config.bluetooth.enabled)
                  setTakLeaderBluetooth(true);
              else
                  LOG_WARN("TAK leader: Bluetooth disabled in saved config; enable it once so GPIO0 service can start BLE");

              renderTakLeaderServicePage();
              powerFSM.trigger(EVENT_PRESS);'''.replace('          ', ''),
              '''    setTakLeaderBluetooth(true);
              renderTakLeaderServicePage();'''.replace('          ', ''),
              'TAK service start Bluetooth')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''static bool takLeaderDisplayWindowActive(uint32_t now)
          {
              return leaderDisplayStartedMs != 0 && (uint32_t)(now - leaderDisplayStartedMs) < leaderDisplayWindowMs;
          }'''.replace('          ', ''),
              '''static bool takLeaderDisplayWindowActive(uint32_t now)
          {
              (void)now;
              const uint32_t current = millis();
              return leaderDisplayStartedMs != 0 &&
                     (uint32_t)(current - leaderDisplayStartedMs) < leaderDisplayWindowMs;
          }'''.replace('          ', ''),
              'TAK fresh display timer')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    if (newEdges != 0) {
                  if (leaderMotionActive) {'''.replace('          ', ''),
              '''    if (newEdges != 0) {
                  LOG_DEBUG("TAK motion: GPIO%d +%u edge(s), candidate=%u/%u active=%u", VEHICLE_MOTION_WAKE_PIN,
                            (unsigned)newEdges, (unsigned)leaderMotionCandidateCount,
                            (unsigned)trackerMotionConfirmCount(), leaderMotionActive ? 1U : 0U);
                  if (leaderMotionActive) {'''.replace('          ', ''),
              'TAK raw motion diagnostics')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''        if (!leaderBootHandoffComplete && now >= TAK_LEADER_BOOT_HANDOFF_MS) {
                  leaderBootHandoffComplete = true;
                  leaderBootTakeoverStartedMs = now ? now : 1;
                  LOG_INFO("TAK leader: boot logo complete; exclusive custom display ownership active");

                  if (leaderServiceActive) {
                      renderTakLeaderServicePage();
                  } else if (screen) {
                      // Replace the boot frame with a blank custom alert first.
                      // START_ALERT_FRAME also cancels Screen's internal boot state,
                      // so STOP_BOOT_SCREEN can no longer expose standard frames.
                      leaderBanner[0] = '\\0';
                      screen->startAlert(drawTakLeaderServiceFrame);
                      leaderServiceFrameActive = true;
                      screen->runNow();
                  }
              }

              // Give Screen one short scheduling window to consume START_ALERT_FRAME,
              // then blank/power off. This yields: boot logo -> off, never stock menu.
              if (leaderBootHandoffComplete && !leaderServiceActive && leaderBootTakeoverStartedMs != 0 &&
                  (uint32_t)(now - leaderBootTakeoverStartedMs) >= 250U) {
                  if (screen && screen->isScreenOn())
                      setTakLeaderScreenPower(false);
                  leaderBootTakeoverStartedMs = 0;
              }'''.replace('          ', ''),
              '''        if (!leaderBootHandoffComplete && graphics::isBootScreenComplete()) {
                  leaderBootHandoffComplete = true;
                  LOG_INFO("TAK leader: Meshtastic boot screen complete; custom display ownership active");

                  if (leaderServiceActive)
                      renderTakLeaderServicePage();
                  else if (screen && screen->isScreenOn())
                      setTakLeaderScreenPower(false);
              }'''.replace('          ', ''),
              'TAK actual boot handoff')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''                    leaderOpenedServiceThisPress = false;
                      leaderLongPressHandled = false;
                      powerFSM.trigger(EVENT_PRESS);

                      if (!leaderServiceActive) {'''.replace('          ', ''),
              '''                    leaderOpenedServiceThisPress = false;
                      leaderLongPressHandled = false;

                      if (leaderServiceActive)
                          leaderServiceLastActivityMs = now;

                      if (!leaderServiceActive) {'''.replace('          ', ''),
              'TAK GPIO0 service activity')

          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''        if (leaderServiceActive && takLeaderBleConnected())
                  leaderServiceLastActivityMs = now;

          '''.replace('          ', ''),
              '',
              'TAK connection is not activity')

          # GPIO0 must wake TAK from light sleep even though the generic button
          # thread is disabled.
          replace_once(
              'src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp',
              '''    const gpio_num_t button = takLeaderButtonPin();
              if (button != GPIO_NUM_NC)
                  pinMode(button, INPUT_PULLUP);'''.replace('          ', ''),
              '''    const gpio_num_t button = takLeaderButtonPin();
              if (button != GPIO_NUM_NC) {
                  pinMode(button, INPUT_PULLUP);
                  gpio_wakeup_enable(button, GPIO_INTR_LOW_LEVEL);
              }'''.replace('          ', ''),
              'TAK GPIO0 light-sleep wake')

          # -----------------------------------------------------------------
          # Shared hook dispatcher and role setup.
          # -----------------------------------------------------------------
          write('src/vehicle/TrackerVariantPolicy.cpp', r'''#include "TrackerVariantPolicy.h"

#include "configuration.h"

#if defined(HELTEC_TRACKER_V1_1)

#include "NodeDB.h"
#include "TrackerEnhancements.h"
#include "TrackerServiceSettings.h"
#include "main.h"

#if !MESHTASTIC_EXCLUDE_GPS
void setupHeltecTrackerV11TakLeaderPolicy();
bool takLeaderScreenPowerAllowed(bool on);
void takLeaderBleActivity();
#endif

#if defined(VEHICLE_MOTION_WAKE_PIN) && !MESHTASTIC_EXCLUDE_GPS
void setupHeltecTrackerV11VehicleMotionTracker();
void setupVehicleServicePolicyV3Style();
void setupVehicleAdaptiveGnss();
bool vehicleV3StyleScreenPowerAllowed(bool on);
void vehicleV3StyleBleActivity();
#endif

static bool repairLegacyTrackerButtonConfig()
{
    if (config.device.button_gpio == 0)
        return false;

    const uint8_t oldPin = config.device.button_gpio;
    config.device.button_gpio = 0;
    if (nodeDB)
        nodeDB->saveToDisk(SEGMENT_CONFIG);

    LOG_WARN("Tracker V1.1: repaired persisted button_gpio=%u -> GPIO0; rebooting once to rebind InputBroker safely",
             (unsigned)oldPin);
    return true;
}

static void configureTakTrackerVehicleProfile()
{
    config.power.is_power_saving = true;
    config.power.wait_bluetooth_secs = 1;
    config.position.gps_mode = meshtastic_Config_PositionConfig_GpsMode_ENABLED;
    config.position.fixed_position = false;
    trackerApplyPositionSettings();
    config.device.button_gpio = 0;
    config.device.disable_triple_click = true;
    config.device.led_heartbeat_disabled = true;
    config.network.wifi_enabled = false;
}

#endif

extern "C" bool meshtasticTrackerScreenPowerAllowed(bool on)
{
#if defined(HELTEC_TRACKER_V1_1)
#if !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK)
        return takLeaderScreenPowerAllowed(on);
#endif
#if defined(VEHICLE_MOTION_WAKE_PIN) && !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER)
        return vehicleV3StyleScreenPowerAllowed(on);
#endif
#endif
    return true;
}

extern "C" void meshtasticTrackerBleActivity()
{
#if defined(HELTEC_TRACKER_V1_1)
#if !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK) {
        takLeaderBleActivity();
        return;
    }
#endif
#if defined(VEHICLE_MOTION_WAKE_PIN) && !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER)
        vehicleV3StyleBleActivity();
#endif
#endif
}

void setupJarnsenTrackerVariantPolicy()
{
#if defined(HELTEC_TRACKER_V1_1)
    const bool customRole = config.device.role == meshtastic_Config_DeviceConfig_Role_TAK ||
                            config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER;
    if (!customRole)
        return;

    config.display.screen_on_secs = 20;

#if defined(VEHICLE_MOTION_WAKE_PIN)
    pinMode(VEHICLE_MOTION_WAKE_PIN, INPUT_PULLUP);
#endif

    if (repairLegacyTrackerButtonConfig()) {
        rebootAtMsec = millis() + 1500UL;
        return;
    }

    trackerServiceSettingsInit();
    setupTrackerEnhancements();

#if !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK) {
        setupHeltecTrackerV11TakLeaderPolicy();
        return;
    }
#endif

#if defined(VEHICLE_MOTION_WAKE_PIN) && !MESHTASTIC_EXCLUDE_GPS
    if (config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER) {
        configureTakTrackerVehicleProfile();
        setupVehicleAdaptiveGnss();
        setupHeltecTrackerV11VehicleMotionTracker();
        setupVehicleServicePolicyV3Style();
    }
#endif
#endif
}
