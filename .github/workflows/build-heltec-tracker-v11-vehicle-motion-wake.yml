name: Finalize Tracker TAK and TAK_TRACKER source

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/scripts/finalize_tracker_policies.py
      - .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml
  pull_request:
    branches:
      - develop
    paths:
      - .github/scripts/finalize_tracker_policies.py
      - .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml

permissions:
  contents: write

concurrency:
  group: finalize-tracker-policies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
          fetch-depth: 0

      - name: Prevent finalizer from rewriting its workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/scripts/finalize_tracker_policies.py')
          s = p.read_text()
          marker = '# -----------------------------------------------------------------------------\n# Replace the temporary self-modifying workflow with the final build-only one,'
          if marker not in s:
              raise SystemExit('final workflow marker missing')
          s = s.split(marker, 1)[0]
          s += "\nPath(__file__).unlink()\n"
          p.write_text(s)

      - name: Apply final Tracker source policies
        run: python .github/scripts/finalize_tracker_policies.py

      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Jarnsen"
          git config user.email "jarno.karsch@vodafone.de"
          git add -A
          git diff --cached --check
          git commit -m "Finalize reliable TAK and TAK_TRACKER behavior"
          git push origin HEAD:heltec-tracker-v11-vehicle-motion-wake
