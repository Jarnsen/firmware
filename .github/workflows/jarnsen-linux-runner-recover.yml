name: JARNSEN Linux runner recover

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - '.github/workflows/jarnsen-linux-runner-recover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Recover VirtualBox Linux runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Recover Jarnsen-Build VM and Actions/Buildkite services
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          function Test-TcpPort {
            param(
              [Parameter(Mandatory = $true)][string]$HostName,
              [Parameter(Mandatory = $true)][int]$Port,
              [int]$TimeoutMs = 1000
            )

            $client = New-Object System.Net.Sockets.TcpClient
            try {
              $task = $client.ConnectAsync($HostName, $Port)
              if (-not $task.Wait($TimeoutMs)) { return $false }
              return $client.Connected
            }
            catch {
              return $false
            }
            finally {
              $client.Dispose()
            }
          }

          function Wait-TcpPort {
            param(
              [Parameter(Mandatory = $true)][string]$HostName,
              [Parameter(Mandatory = $true)][int]$Port,
              [Parameter(Mandatory = $true)][int]$TimeoutSeconds
            )

            $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
            do {
              if (Test-TcpPort -HostName $HostName -Port $Port) { return $true }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)
            return $false
          }

          $vbox = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          if (-not $vbox) {
            $candidate = 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe'
            if (Test-Path $candidate) { $vbox = $candidate }
          }
          if (-not $vbox) { throw 'VBoxManage not found' }

          $vm = 'Jarnsen-Build'
          $sshHost = '127.0.0.1'
          $sshPort = 2222
          $sshUser = 'jarnsen'
          $vmResetPerformed = $false

          $info = & $vbox showvminfo $vm --machinereadable
          if ($LASTEXITCODE -ne 0) { throw 'Jarnsen-Build VM not found' }
          $stateLine = $info | Where-Object { $_ -match '^VMState=' } | Select-Object -First 1
          $state = if ($stateLine -match '^VMState="([^"]+)"') { $Matches[1] } else { 'unknown' }
          Write-Host "VM state before recovery: $state"

          switch ($state) {
            'running' { }
            'paused' {
              & $vbox controlvm $vm resume
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            'saved' {
              & $vbox startvm $vm --type headless
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            'poweroff' {
              & $vbox startvm $vm --type headless
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            'aborted' {
              & $vbox startvm $vm --type headless
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            default { throw "Unsupported VM state: $state" }
          }

          # A listening NAT-forwarded port only proves that something accepted TCP.
          # It does not prove the guest sshd can complete its banner/auth handshake.
          $sshPortReady = Wait-TcpPort -HostName $sshHost -Port $sshPort -TimeoutSeconds 20
          if (-not $sshPortReady) {
            Write-Warning "SSH ${sshHost}:${sshPort} is not reachable; resetting $vm once."
            & $vbox controlvm $vm reset
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $vmResetPerformed = $true
            $sshPortReady = Wait-TcpPort -HostName $sshHost -Port $sshPort -TimeoutSeconds 120
          }

          Write-Host '=== VM after TCP recovery ==='
          $postInfo = & $vbox showvminfo $vm --machinereadable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $postInfo | Select-String -Pattern '^(VMState|nic1|cableconnected1|natnet1|Forwarding\()='
          $postInfo | Where-Object { $_ -match 'Forwarding.*2222.*22' } | ForEach-Object { Write-Host $_ }

          if (-not $sshPortReady) {
            throw "Linux guest did not expose SSH on ${sshHost}:${sshPort} after recovery"
          }
          Write-Host "SSH TCP port ${sshHost}:${sshPort} is reachable."

          $ssh = Get-Command ssh.exe -ErrorAction SilentlyContinue
          if (-not $ssh) { throw 'Windows OpenSSH client ssh.exe not found' }

          $sshCommonArgs = @(
            '-p', "$sshPort",
            '-o', 'BatchMode=yes',
            '-o', 'ConnectTimeout=5',
            '-o', 'ConnectionAttempts=1',
            '-o', 'StrictHostKeyChecking=no',
            '-o', 'UserKnownHostsFile=NUL'
          )

          function Test-SshHandshake {
            $probeArgs = $sshCommonArgs + @("${sshUser}@${sshHost}", 'true')
            $previousErrorActionPreference = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            try {
              & $ssh @probeArgs 2>&1 | Out-Null
              $probeExit = $LASTEXITCODE
            }
            finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            return $probeExit -eq 0
          }

          $sshReady = Test-SshHandshake
          if (-not $sshReady) {
            if (-not $vmResetPerformed) {
              Write-Warning "TCP ${sshHost}:${sshPort} is open but SSH handshake failed; resetting $vm once."
              & $vbox controlvm $vm reset
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $vmResetPerformed = $true
              if (-not (Wait-TcpPort -HostName $sshHost -Port $sshPort -TimeoutSeconds 120)) {
                throw "Linux guest did not reopen SSH TCP port after handshake recovery reset"
              }
            } else {
              Write-Warning 'SSH handshake is not ready after the earlier VM reset; continuing readiness probes.'
            }

            for ($attempt = 1; $attempt -le 12; $attempt++) {
              Start-Sleep -Seconds 5
              if (Test-SshHandshake) {
                $sshReady = $true
                Write-Host "SSH handshake/authentication ready on attempt $attempt."
                break
              }
              Write-Host "SSH handshake probe $attempt/12 not ready yet."
            }
          }

          if (-not $sshReady) {
            throw "Linux guest exposes TCP ${sshHost}:${sshPort}, but SSH banner/authentication never became ready after recovery"
          }
          Write-Host 'SSH banner and non-interactive authentication are healthy.'

          $remoteScript = @'
          set -u

          echo '=== Linux runner diagnostics ==='
          echo "host=$(hostname) user=$(id -un)"
          echo "boot=$(uptime -s 2>/dev/null || true)"

          echo '--- Runner processes before recovery ---'
          pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true

          mapfile -t configured_dirs < <(
            find "$HOME" -maxdepth 3 -type f -name .runner -printf '%h\n' 2>/dev/null | sort -u
          )

          if [ "${#configured_dirs[@]}" -eq 0 ]; then
            echo 'JARNSEN_RUNNER_FAILED: no configured runner directory (.runner) found.'
            exit 41
          fi

          echo '--- Configured runner directories ---'
          printf '%s\n' "${configured_dirs[@]}"

          mapfile -t runner_units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
              awk '/^actions\.runner\..*\.service/ {print $1}'
          )

          echo '--- Installed runner services ---'
          if [ "${#runner_units[@]}" -eq 0 ]; then
            echo 'none'
          else
            for unit in "${runner_units[@]}"; do
              exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
              active="$(systemctl is-active "$unit" 2>/dev/null || true)"
              echo "$unit active=$active exec=$exec_start"
            done
          fi

          listener_for_dir() {
            local dir="$1"
            pgrep -f "${dir}/bin/Runner.Listener" >/dev/null 2>&1
          }

          stable_listener_for_dir() {
            local dir="$1"
            listener_for_dir "$dir" || return 1
            sleep 3
            listener_for_dir "$dir"
          }

          for dir in "${configured_dirs[@]}"; do
            if stable_listener_for_dir "$dir"; then
              echo "JARNSEN_RUNNER_OK: configured listener already active: $dir"
              exit 0
            fi
          done

          echo '--- Attempting service recovery for configured runners ---'
          for dir in "${configured_dirs[@]}"; do
            matched_unit=''
            for unit in "${runner_units[@]}"; do
              exec_start="$(systemctl show "$unit" -p ExecStart --value 2>/dev/null || true)"
              case "$exec_start" in
                *"$dir/runsvc.sh"*) matched_unit="$unit"; break ;;
              esac
            done

            if [ -n "$matched_unit" ]; then
              echo "Restarting matching service $matched_unit for $dir"
              sudo -n systemctl restart "$matched_unit" || true
              sleep 8
              if stable_listener_for_dir "$dir"; then
                echo "JARNSEN_RUNNER_OK: service recovered configured listener: $dir"
                exit 0
              fi
            fi

            # svc.sh remembers its own installed unit in .service. Prefer that
            # over unrelated stale actions.runner.* services from old directories.
            if [ -x "$dir/svc.sh" ] && [ -f "$dir/.service" ]; then
              echo "Starting runner via $dir/svc.sh"
              (cd "$dir" && sudo -n ./svc.sh start) || true
              sleep 8
              if stable_listener_for_dir "$dir"; then
                echo "JARNSEN_RUNNER_OK: svc.sh recovered configured listener: $dir"
                exit 0
              fi
            fi
          done

          echo '--- Installing persistent service for first configured runner when needed ---'
          primary_dir="${configured_dirs[0]}"
          if [ -x "$primary_dir/svc.sh" ] && [ ! -f "$primary_dir/.service" ]; then
            echo "Installing service for $primary_dir"
            (cd "$primary_dir" && sudo -n ./svc.sh install "$(id -un)" && sudo -n ./svc.sh start) || true
            sleep 8
            if stable_listener_for_dir "$primary_dir"; then
              echo "JARNSEN_RUNNER_OK: installed and started persistent service: $primary_dir"
              exit 0
            fi
          fi

          echo '--- Falling back to configured user-level runner ---'
          recovery_log="$HOME/jarnsen-actions-runner-recovery.log"
          for dir in "${configured_dirs[@]}"; do
            if [ ! -x "$dir/run.sh" ]; then
              continue
            fi
            echo "Starting configured runner fallback from $dir"
            (cd "$dir" && nohup ./run.sh >"$recovery_log" 2>&1 </dev/null &)
            sleep 10
            if stable_listener_for_dir "$dir"; then
              echo "JARNSEN_RUNNER_OK: fallback recovered configured listener: $dir"
              exit 0
            fi
          done

          echo '--- Runner processes after recovery ---'
          pgrep -af 'Runner.Listener|Runner.Worker|runsvc.sh' || true

          if [ -f "$recovery_log" ]; then
            echo '--- Recovery log tail ---'
            tail -n 80 "$recovery_log" || true
          fi

          echo 'JARNSEN_RUNNER_FAILED: no stable listener from a configured runner directory.'
          exit 42
          '@

          # Windows PowerShell 5.1 writes native-pipeline stdin with Windows text
          # semantics. Encode normalized UTF-8/LF bytes as ASCII base64 so Bash
          # receives the script byte-for-byte without BOM/CRLF corruption.
          $remoteScriptLf = $remoteScript.TrimStart([char]0xFEFF) -replace "`r`n", "`n"
          $remoteScriptB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($remoteScriptLf))
          $remoteCommand = "printf '%s' '$remoteScriptB64' | base64 -d | bash"

          $sshArgs = $sshCommonArgs + @(
            "${sshUser}@${sshHost}",
            $remoteCommand
          )

          Write-Host '=== Attempting non-interactive Actions runner recovery over SSH ==='
          & $ssh @sshArgs
          $sshExit = $LASTEXITCODE
          if ($sshExit -ne 0) {
            throw "SSH Actions runner recovery failed with exit code $sshExit. See the Linux diagnostics above."
          }

          Write-Host 'JARNSEN Linux Actions runner recovered successfully.'

          $buildkiteScript = @'
          set -u

          echo '=== Buildkite agent diagnostics ==='

          buildkite_bin="$(command -v buildkite-agent 2>/dev/null || true)"
          mapfile -t buildkite_units < <(
            systemctl list-unit-files --type=service --no-legend 2>/dev/null |
              awk '/^buildkite-agent.*\.service/ {print $1}'
          )

          if [ -n "$buildkite_bin" ]; then
            echo "buildkite-agent binary=$buildkite_bin"
            "$buildkite_bin" --version 2>/dev/null || true
          else
            echo 'buildkite-agent binary=not-found'
          fi

          echo '--- Buildkite service units ---'
          if [ "${#buildkite_units[@]}" -eq 0 ]; then
            echo 'none'
          else
            for unit in "${buildkite_units[@]}"; do
              active="$(systemctl is-active "$unit" 2>/dev/null || true)"
              enabled="$(systemctl is-enabled "$unit" 2>/dev/null || true)"
              echo "$unit active=$active enabled=$enabled"
            done
          fi

          echo '--- Buildkite safe configuration fields ---'
          for cfg in /etc/buildkite-agent/buildkite-agent.cfg "$HOME/.buildkite-agent/buildkite-agent.cfg"; do
            if [ -r "$cfg" ]; then
              echo "config=$cfg"
              awk -F= '
                $1 == "name" || $1 == "tags" || $1 == "priority" || $1 == "spawn" || $1 == "disconnect-after-idle-timeout" {
                  print $0
                }
              ' "$cfg" || true
            fi
          done

          buildkite_running() {
            pgrep -x buildkite-agent >/dev/null 2>&1
          }

          stable_buildkite() {
            buildkite_running || return 1
            sleep 3
            buildkite_running
          }

          if stable_buildkite; then
            echo 'JARNSEN_BUILDKITE_OK: Buildkite agent process already active.'
            exit 0
          fi

          if [ -z "$buildkite_bin" ] && [ "${#buildkite_units[@]}" -eq 0 ]; then
            echo 'JARNSEN_BUILDKITE_MISSING: no Buildkite agent installation detected.'
            exit 51
          fi

          echo '--- Attempting Buildkite service recovery ---'
          for unit in "${buildkite_units[@]}"; do
            echo "Restarting $unit"
            sudo -n systemctl restart "$unit" || true
            sleep 8
            active="$(systemctl is-active "$unit" 2>/dev/null || true)"
            echo "$unit active=$active"
            if stable_buildkite; then
              echo "JARNSEN_BUILDKITE_OK: recovered through $unit"
              exit 0
            fi
          done

          echo '--- Buildkite diagnostics after recovery ---'
          if command -v journalctl >/dev/null 2>&1; then
            for unit in "${buildkite_units[@]}"; do
              echo "journal=$unit"
              sudo -n journalctl -u "$unit" -n 40 --no-pager 2>/dev/null |
                sed -E 's/(token[=:][[:space:]]*)[^[:space:]]+/\1[REDACTED]/Ig' || true
            done
          fi

          echo 'JARNSEN_BUILDKITE_FAILED: Buildkite agent did not become stable.'
          exit 52
          '@

          $buildkiteScriptLf = $buildkiteScript.TrimStart([char]0xFEFF) -replace "`r`n", "`n"
          $buildkiteScriptB64 = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($buildkiteScriptLf))
          $buildkiteCommand = "printf '%s' '$buildkiteScriptB64' | base64 -d | bash"
          $buildkiteArgs = $sshCommonArgs + @(
            "${sshUser}@${sshHost}",
            $buildkiteCommand
          )

          Write-Host '=== Attempting non-interactive Buildkite agent recovery over SSH ==='
          & $ssh @buildkiteArgs
          $buildkiteExit = $LASTEXITCODE
          if ($buildkiteExit -ne 0) {
            throw "SSH Buildkite agent recovery failed with exit code $buildkiteExit. See the Linux diagnostics above."
          }

          Write-Host 'JARNSEN Linux Actions and Buildkite runners recovered successfully.'
