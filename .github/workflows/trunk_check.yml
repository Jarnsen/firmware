name: Pull Request
on: [pull_request]
concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Check Runner
    runs-on: ubuntu-24.04
    permissions:
      checks: write # For trunk to post annotations
      contents: read # For repo checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show exact Black 26.5.1 diff for Tracker HIL files
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check black==26.5.1
          black --diff --check \
            tools/jarnsen_mesh_flasher/tests/tracker_backup_hil.py \
            tools/jarnsen_mesh_flasher/tests/tracker_full_hil.py || true

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          save-annotations: true
