name: One-shot tracker button and display fix

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/workflows/jarnsen-fix-tracker-button-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
          fetch-depth: 0

      - name: Patch exclusive GPIO0 and deterministic boot handoff
        shell: python
        run: |
          from pathlib import Path

          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected one match, got {n}")
              return text.replace(old, new, 1)

          # Expose the normal-screen handoff state so custom Tracker UI can wait
          # until Meshtastic has really finished its boot logo.
          p = Path("src/graphics/Screen.h")
          s = p.read_text()
          if "isShowingNormalScreen()" not in s:
              s = one(s,
                  "    bool isScreenOn() { return screenOn; }\n",
                  "    bool isScreenOn() { return screenOn; }\n    bool isShowingNormalScreen() const { return showingNormalScreen; }\n",
                  "Screen normal-state accessor")
              p.write_text(s)

          # The stock UserButton and our TAK service were both consuming GPIO0.
          # Keep the pin exclusively owned by the custom TAK/TAK_TRACKER policy.
          p = Path("src/input/InputBroker.cpp")
          s = p.read_text()
          if "jarnsenTrackerOwnsUserButton" not in s:
              s = one(s,
                  "InputBroker *inputBroker = nullptr;\n",
                  '''InputBroker *inputBroker = nullptr;\n\nstatic bool jarnsenTrackerOwnsUserButton()\n{\n#if defined(HELTEC_TRACKER_V1_1)\n    return config.device.role == meshtastic_Config_DeviceConfig_Role_TAK ||\n           config.device.role == meshtastic_Config_DeviceConfig_Role_TAK_TRACKER;\n#else\n    return false;\n#endif\n}\n''',
                  "InputBroker tracker owner helper")
              s = one(s,
                  "        UserButtonThread->initButton(userConfig);\n",
                  '''        if (!jarnsenTrackerOwnsUserButton()) {\n            UserButtonThread->initButton(userConfig);\n        } else {\n            LOG_INFO("Tracker V1.1 TAK service owns GPIO%d; generic UserButton disabled", _pinNum);\n        }\n''',
                  "InputBroker screen button init")
              s = one(s,
                  "        UserButtonThread->initButton(userConfigNoScreen);\n",
                  '''        if (!jarnsenTrackerOwnsUserButton()) {\n            UserButtonThread->initButton(userConfigNoScreen);\n        } else {\n            LOG_INFO("Tracker V1.1 TAK service owns GPIO%d; generic UserButton disabled", _pinNum);\n        }\n''',
                  "InputBroker no-screen button init")
              p.write_text(s)

          # ---------------- TAK ----------------
          p = Path("src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp")
          s = p.read_text()
          if "leaderBootHandoffSeen" not in s:
              s = one(s,
                  "static uint32_t leaderFrameReassertUntilMs = 0;\n",
                  "static uint32_t leaderFrameReassertUntilMs = 0;\nstatic bool leaderBootHandoffSeen = false;\n",
                  "TAK boot state")

              s = one(s,
                  '''    const uint32_t now = millis();\n    leaderDisplayStartedMs = now;\n    leaderDisplayWindowMs = takLeaderLowBattery() ? TAK_LEADER_LOW_BATTERY_DISPLAY_MS : TAK_LEADER_DISPLAY_MS;\n    startTakLeaderServiceFrame(now, true);\n''',
                  '''    // Do not touch the TFT while Meshtastic owns the boot logo. The\n    // policy thread will render this requested page immediately after the\n    // Screen task reports its normal-frame handoff.\n    if (!leaderBootHandoffSeen) {\n        leaderDisplayStartedMs = 0;\n        return;\n    }\n\n    const uint32_t now = millis();\n    leaderDisplayStartedMs = now;\n    leaderDisplayWindowMs = takLeaderLowBattery() ? TAK_LEADER_LOW_BATTERY_DISPLAY_MS : TAK_LEADER_DISPLAY_MS;\n    startTakLeaderServiceFrame(now, false);\n''',
                  "TAK defer render")

              s = one(s,
                  '''        const uint32_t now = millis();\n        processTakLeaderMotion(now);\n''',
                  '''        const uint32_t now = millis();\n\n        // Let the stock boot logo finish untouched. Once Screen has switched\n        // to its normal frame set, ownership transfers to this policy.\n        if (!leaderBootHandoffSeen && screen && screen->isShowingNormalScreen()) {\n            leaderBootHandoffSeen = true;\n            if (leaderServiceActive && leaderDisplayStartedMs == 0)\n                renderTakLeaderServicePage();\n        }\n\n        processTakLeaderMotion(now);\n''',
                  "TAK observe boot handoff")

              s = one(s,
                  '''                    if (!leaderServiceActive) {\n                        startTakLeaderService();\n                        leaderOpenedServiceThisPress = true;\n                    }\n''',
                  '''                    if (!leaderServiceActive) {\n                        startTakLeaderService();\n                        leaderOpenedServiceThisPress = true;\n                    } else if (leaderBootHandoffSeen && screen &&\n                               (leaderDisplayStartedMs == 0 || !screen->isScreenOn() ||\n                                (uint32_t)(now - leaderDisplayStartedMs) >= leaderDisplayWindowMs)) {\n                        // If the 20 s display window has expired, the first press\n                        // only wakes the current service page. It must not also\n                        // advance to the next page on release.\n                        renderTakLeaderServicePage();\n                        leaderOpenedServiceThisPress = true;\n                    }\n''',
                  "TAK wake without page advance")

              old = '''                if (screen) {\n                    if ((uint32_t)(now - leaderDisplayStartedMs) < leaderDisplayWindowMs) {\n                        if (!screen->isScreenOn()) {\n                            screen->setOn(true);\n                            screen->startAlert(drawTakLeaderServiceFrame);\n                            leaderServiceFrameActive = true;\n                            leaderFrameReassertPending = true;\n                            leaderFrameReassertAtMs = now + TAK_LEADER_FRAME_REASSERT_INTERVAL_MS;\n                            leaderFrameReassertUntilMs = now + TAK_LEADER_FRAME_REASSERT_WINDOW_MS;\n                        }\n\n                        // During the short handoff after GPIO0/boot the normal\n                        // Screen task may finish STOP_BOOT_SCREEN or re-init TFT.\n                        // Reassert for only 2.5 s; afterwards the alert stays put.\n                        if (leaderFrameReassertPending &&\n                            (int32_t)(now - leaderFrameReassertAtMs) >= 0) {\n                            screen->startAlert(drawTakLeaderServiceFrame);\n                            leaderServiceFrameActive = true;\n                            if ((int32_t)(now - leaderFrameReassertUntilMs) >= 0) {\n                                leaderFrameReassertPending = false;\n                            } else {\n                                leaderFrameReassertAtMs = now + TAK_LEADER_FRAME_REASSERT_INTERVAL_MS;\n                            }\n                        }\n                    } else {\n                        // Do NOT end the alert here. Only power the panel down.\n                        // Keeping the full-screen frame installed for the whole\n                        // 120 s service session prevents serial/USB wakeups from\n                        // exposing the stock Meshtastic carousel.\n                        if (screen->isScreenOn())\n                            screen->setOn(false);\n                    }\n                }\n'''
              new = '''                if (screen && leaderBootHandoffSeen) {\n                    if (leaderDisplayStartedMs == 0)\n                        renderTakLeaderServicePage();\n\n                    if (leaderDisplayStartedMs != 0 &&\n                        (uint32_t)(now - leaderDisplayStartedMs) < leaderDisplayWindowMs) {\n                        if (!screen->isScreenOn()) {\n                            // setOn() can re-init the Tracker TFT, so queue our\n                            // exclusive frame immediately after that one wake.\n                            screen->setOn(true);\n                            screen->startAlert(drawTakLeaderServiceFrame);\n                            leaderServiceFrameActive = true;\n                        }\n                    } else if (leaderDisplayStartedMs != 0 && screen->isScreenOn()) {\n                        // Keep the alert installed; only power down the panel.\n                        screen->setOn(false);\n                    }\n                }\n'''
              s = one(s, old, new, "TAK deterministic display loop")

              s = one(s,
                  '''        } else if (leaderMotionActive || leaderMotionCandidatePending) {\n            stopTakLeaderServiceFrame();\n            setBluetoothEnable(false);\n            if (screen && screen->isScreenOn())\n                screen->setOn(false);\n        } else {\n            stopTakLeaderServiceFrame();\n            setBluetoothEnable(false);\n            if (screen && screen->isScreenOn())\n                screen->setOn(false);\n        }\n\n        return 100;\n''',
                  '''        } else if (leaderMotionActive || leaderMotionCandidatePending) {\n            stopTakLeaderServiceFrame();\n            setBluetoothEnable(false);\n            if (leaderBootHandoffSeen && screen && screen->isScreenOn())\n                screen->setOn(false);\n        } else {\n            stopTakLeaderServiceFrame();\n            setBluetoothEnable(false);\n            if (leaderBootHandoffSeen && screen && screen->isScreenOn())\n                screen->setOn(false);\n        }\n\n        // Poll quickly only until the boot-logo handoff so the custom page\n        // replaces the stock carousel essentially immediately afterwards.\n        return leaderBootHandoffSeen ? 100 : 20;\n''',
                  "TAK preserve boot logo")

              s = one(s,
                  '''    setBluetoothEnable(false);\n    if (screen && screen->isScreenOn())\n        screen->setOn(false);\n\n    LOG_INFO("TAK leader profile:''',
                  '''    // Leave the display alone here: Screen still owns its boot logo.\n    // runOnce() takes ownership only after isShowingNormalScreen() becomes true.\n    setBluetoothEnable(false);\n\n    LOG_INFO("TAK leader profile:''',
                  "TAK setup boot logo")
              p.write_text(s)

          # ---------------- TAK_TRACKER ----------------
          p = Path("src/vehicle/VehicleServicePolicy.cpp")
          s = p.read_text()
          if "serviceBootHandoffSeen" not in s:
              s = one(s,
                  "static uint32_t serviceFrameReassertUntilMs = 0;\n",
                  "static uint32_t serviceFrameReassertUntilMs = 0;\nstatic bool serviceBootHandoffSeen = false;\n",
                  "TAK_TRACKER boot state")

              s = one(s,
                  '''    const uint32_t now = millis();\n    displayStartedMs = now;\n    displayWindowMs = vehicleLowBattery() ? VEHICLE_LOW_BATTERY_DISPLAY_MS : VEHICLE_SERVICE_DISPLAY_MS;\n\n    // Keep the service frame installed even while Meshtastic shows the pairing\n    // PIN. Pairing is an overlay and therefore renders on top of this frame;\n    // ending our alert here would expose the stock Meshtastic carousel behind\n    // the PIN and was the main source of the visible "original UI" flashes.\n    startVehicleServiceFrame(now, true);\n''',
                  '''    if (!serviceBootHandoffSeen) {\n        displayStartedMs = 0;\n        return;\n    }\n\n    const uint32_t now = millis();\n    displayStartedMs = now;\n    displayWindowMs = vehicleLowBattery() ? VEHICLE_LOW_BATTERY_DISPLAY_MS : VEHICLE_SERVICE_DISPLAY_MS;\n    startVehicleServiceFrame(now, false);\n''',
                  "TAK_TRACKER defer render")

              s = one(s,
                  '''        const uint32_t now = millis();\n        const gpio_num_t button = vehicleUserButtonPin();\n''',
                  '''        const uint32_t now = millis();\n\n        if (!serviceBootHandoffSeen && screen && screen->isShowingNormalScreen()) {\n            serviceBootHandoffSeen = true;\n            if (serviceModeActive && displayStartedMs == 0)\n                renderVehicleServicePage();\n        }\n\n        const gpio_num_t button = vehicleUserButtonPin();\n''',
                  "TAK_TRACKER observe boot handoff")

              s = one(s,
                  '''                    if (!serviceModeActive) {\n                        startVehicleServiceMode();\n                        openedServiceThisPress = true;\n                    }\n''',
                  '''                    if (!serviceModeActive) {\n                        startVehicleServiceMode();\n                        openedServiceThisPress = true;\n                    } else if (serviceBootHandoffSeen && screen &&\n                               (displayStartedMs == 0 || !screen->isScreenOn() ||\n                                (uint32_t)(now - displayStartedMs) >= displayWindowMs)) {\n                        renderVehicleServicePage();\n                        openedServiceThisPress = true;\n                    }\n''',
                  "TAK_TRACKER wake without page advance")

              old = '''        if (screen && serviceModeActive) {\n            if (vehicleDisplayStillActive(now)) {\n                // Only wake an actually-off panel. Calling setOn(true) every\n                // 100 ms was unnecessary and made TFT state races much harder\n                // to reason about.\n                if (!screen->isScreenOn()) {\n                    screen->setOn(true);\n                    // Tracker TFT wake calls ui->init(), so put our exclusive\n                    // frame back immediately after that queued wake command.\n                    screen->startAlert(drawVehicleServiceFrame);\n                    serviceFrameActive = true;\n                    serviceFrameReassertPending = true;\n                    serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_MS;\n                }\n\n                // One deliberate second assertion closes the STOP_BOOT_SCREEN\n                // race seen in the field log. It is not a periodic redraw.\n                if (serviceFrameReassertPending &&\n                    (int32_t)(now - serviceFrameReassertAtMs) >= 0) {\n                    screen->startAlert(drawVehicleServiceFrame);\n                    serviceFrameActive = true;\n                    serviceFrameReassertPending = false;\n                }\n            } else {\n                stopVehicleServiceFrame();\n                if (screen->isScreenOn())\n                    screen->setOn(false);\n            }\n        }\n\n        return 100;\n'''
              # Newer TAK_TRACKER may already have the 2.5 s bounded variant. Handle both.
              if old not in s:
                  old = '''        if (screen && serviceModeActive) {\n            if (vehicleDisplayStillActive(now)) {\n                // Only wake an actually-off panel. Calling setOn(true) every\n                // 100 ms was unnecessary and made TFT state races much harder\n                // to reason about.\n                if (!screen->isScreenOn()) {\n                    screen->setOn(true);\n                    // Tracker TFT wake calls ui->init(), so put our exclusive\n                    // frame back immediately after that queued wake command.\n                    screen->startAlert(drawVehicleServiceFrame);\n                    serviceFrameActive = true;\n                    serviceFrameReassertPending = true;\n                    serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS;\n                    serviceFrameReassertUntilMs = now + VEHICLE_SERVICE_FRAME_REASSERT_WINDOW_MS;\n                }\n\n                // Reassert only during the bounded startup/TFT handoff window.\n                // This catches STOP_BOOT_SCREEN and late ui->init() without running a\n                // permanent redraw loop during the whole service session.\n                if (serviceFrameReassertPending &&\n                    (int32_t)(now - serviceFrameReassertAtMs) >= 0) {\n                    screen->startAlert(drawVehicleServiceFrame);\n                    serviceFrameActive = true;\n                    if ((int32_t)(now - serviceFrameReassertUntilMs) >= 0) {\n                        serviceFrameReassertPending = false;\n                    } else {\n                        serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS;\n                    }\n                }\n            } else {\n                // Keep the exclusive frame installed while the panel is dark.\n                // Any unintended serial/USB wake therefore cannot reveal stock UI.\n                if (screen->isScreenOn())\n                    screen->setOn(false);\n            }\n        }\n\n        return 100;\n'''
              new = '''        if (screen && serviceModeActive && serviceBootHandoffSeen) {\n            if (displayStartedMs == 0)\n                renderVehicleServicePage();\n\n            if (vehicleDisplayStillActive(now)) {\n                if (!screen->isScreenOn()) {\n                    screen->setOn(true);\n                    screen->startAlert(drawVehicleServiceFrame);\n                    serviceFrameActive = true;\n                }\n            } else if (displayStartedMs != 0 && screen->isScreenOn()) {\n                // Keep the service alert installed; only power the panel down.\n                screen->setOn(false);\n            }\n        }\n\n        return serviceBootHandoffSeen ? 100 : 20;\n'''
              s = one(s, old, new, "TAK_TRACKER deterministic display loop")

              s = one(s,
                  '''    } else {\n        stopVehicleServiceFrame();\n        setBluetoothEnable(false);\n        if (screen && screen->isScreenOn())\n            screen->setOn(false);\n    }\n}\n''',
                  '''    } else {\n        // Preserve the Meshtastic boot logo. The main policy loop will turn\n        // the panel off immediately after the normal-screen handoff.\n        stopVehicleServiceFrame();\n        setBluetoothEnable(false);\n    }\n}\n''',
                  "TAK_TRACKER init boot logo")

              s = one(s,
                  '''        } else {\n            // Normal TAK_TRACKER operation is autonomous; BLE is available only\n            // after an intentional GPIO0 press.\n            stopVehicleServiceFrame();\n            setBluetoothEnable(false);\n            if (screen && screen->isScreenOn())\n                screen->setOn(false);\n        }\n''',
                  '''        } else {\n            // Normal TAK_TRACKER operation is autonomous; BLE is available only\n            // after an intentional GPIO0 press. Preserve boot logo until Screen\n            // performs its normal-frame handoff.\n            stopVehicleServiceFrame();\n            setBluetoothEnable(false);\n            if (serviceBootHandoffSeen && screen && screen->isScreenOn())\n                screen->setOn(false);\n        }\n''',
                  "TAK_TRACKER stationary boot preservation")
              p.write_text(s)

      - name: Commit fixes
        run: |
          git config user.name "Jarnsen Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/graphics/Screen.h src/input/InputBroker.cpp src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp src/vehicle/VehicleServicePolicy.cpp
          git diff --cached --check
          git commit -m "Make tracker button and display ownership deterministic"
          git push origin HEAD:heltec-tracker-v11-vehicle-motion-wake
