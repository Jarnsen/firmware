name: Build Jarnsen Baseline - Heltec Wireless Tracker ESP32-S3

on:
  push:
    branches:
      - feature/heltec-tracker-mgrs-map
  workflow_dispatch:

jobs:
  build:
    name: Boot-safe Heltec Wireless Tracker baseline
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Verify Tactical module is disabled
        run: |
          test ! -e src/modules/TacticalMapModule.cpp
          test ! -e src/modules/TacticalMapModule.h

      - name: Build exact Heltec Wireless Tracker target
        run: pio run -e heltec-wireless-tracker

      - name: Package full-erase baseline recovery
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR='.pio/build/heltec-wireless-tracker'
          OUT='artifact/JARNSEN-BASELINE__HELTEC-WIRELESS-TRACKER__ESP32-S3__FULL-ERASE-RECOVERY'
          rm -rf artifact
          mkdir -p "$OUT"

          test -d "$BUILD_DIR"
          APP="$(find "$BUILD_DIR" -maxdepth 2 -type f -name '*.bin' -size +500k \
            ! -iname '*bootloader*' ! -iname '*partition*' ! -iname '*littlefs*' \
            ! -iname '*spiffs*' ! -iname '*boot_app0*' ! -iname '*ota*' \
            -printf '%s %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          BOOT="$(find "$BUILD_DIR" -maxdepth 2 -type f -iname '*bootloader*.bin' -print -quit)"
          PART="$(find "$BUILD_DIR" -maxdepth 2 -type f -iname '*partition*.bin' -print -quit)"

          test -f "$APP"
          test -f "$BOOT"
          test -f "$PART"
          test "$(stat -c '%s' "$APP")" -gt 512000

          cp "$APP" "$OUT/Jarnsen-Baseline-Heltec-Wireless-Tracker-ESP32S3.bin"
          cp "$BOOT" "$OUT/bootloader.bin"
          cp "$PART" "$OUT/partitions.bin"
          cp tools/tactical-installer/INSTALL-BASELINE-WINDOWS.bat "$OUT/INSTALL-BASELINE-WINDOWS.bat"

          cat > "$OUT/READ-ME-FIRST.txt" <<EOF
          JARNSEN BOOT-SAFE BASELINE TEST

          Hardware:
          - Heltec Wireless Tracker V1.x
          - ESP32-S3 / UC6580 GNSS / SX1262 LoRa
          - PlatformIO environment: heltec-wireless-tracker

          This build contains the unmodified Meshtastic baseline from this branch.
          TacticalMapModule is intentionally removed.

          INSTALLATION:
          1. Extract the complete ZIP.
          2. Connect the tracker by USB.
          3. Run INSTALL-BASELINE-WINDOWS.bat.
          4. Enter the COM port.

          WARNING: The installer performs a FULL ERASE and deletes settings.
          Its only purpose is to prove that the exact baseline boots, displays,
          receives GPS and initializes LoRa before Tactical features return.
          EOF

          find "$OUT" -type f -printf '%s %p\n' | sort -n

      - name: Upload baseline recovery package
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-BASELINE__HELTEC-WIRELESS-TRACKER__ESP32-S3__FULL-ERASE-RECOVERY
          path: artifact/
          if-no-files-found: error
          compression-level: 6
