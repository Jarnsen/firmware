name: Build Tactical Heltec Tracker Firmware

on:
  push:
    branches:
      - feature/heltec-tracker-mgrs-map
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Heltec Wireless Tracker
        run: pio run -e heltec-wireless-tracker
      - name: Locate build outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "Relevant files created by the build:"
          find . -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.uf2' -o -name '*.zip' \) \
            -not -path './.git/*' \
            -not -path './.platformio/*' \
            -print | sort
      - name: Collect flash files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact

          while IFS= read -r file; do
            rel="${file#./}"
            dest="artifact/$rel"
            mkdir -p "$(dirname "$dest")"
            cp "$file" "$dest"
          done < <(find . -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.uf2' -o -name '*.zip' \) \
            -not -path './.git/*' \
            -not -path './.platformio/*' \
            -not -path './artifact/*' \
            -print | sort)

          echo "Collected artifact files:"
          find artifact -type f -print | sort
          test -n "$(find artifact -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: heltec-wireless-tracker-tactical-firmware
          path: artifact/
          if-no-files-found: error
