name: Build Tactical Heltec Tracker Firmware

on:
  push:
    branches:
      - feature/heltec-tracker-mgrs-map
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Heltec Wireless Tracker
        run: pio run -e heltec-wireless-tracker
      - name: Collect flash files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          echo "PlatformIO output files:"
          find .pio/build -maxdepth 4 -type f | sort

          while IFS= read -r file; do
            cp "$file" "artifact/$(basename "$file")"
          done < <(find .pio/build -type f \( -name '*.bin' -o -name '*.elf' -o -name '*.uf2' \) | sort)

          test -n "$(find artifact -type f -name '*.bin' -print -quit)"
          ls -lah artifact
      - uses: actions/upload-artifact@v4
        with:
          name: heltec-wireless-tracker-tactical-firmware
          path: artifact/
          if-no-files-found: error