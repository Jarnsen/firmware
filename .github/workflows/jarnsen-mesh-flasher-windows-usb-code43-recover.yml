name: JARNSEN-MESH Flasher Windows USB Code43 Recovery
run-name: "JARNSEN-MESH-FLASHER Windows USB Recovery · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-windows-usb-code43-recover.yml

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-windows-usb-code43-recovery
  cancel-in-progress: true

env:
  JARNSEN_TRACKER_SERIAL: "F0:9E:9E:76:07:10"

jobs:
  recover:
    name: JARNO-PC · recover exact present USB descriptor failure
    runs-on: [self-hosted, Windows, X64, jarn-pc]
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Resolve Python
        shell: powershell
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Python\Python312\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python311\python.exe",
            "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe",
            "$env:LOCALAPPDATA\Programs\Miniconda3\python.exe"
          )
          $resolved = $null
          foreach ($candidate in $candidates) {
            if (!(Test-Path $candidate)) { continue }
            try {
              & $candidate -c "import sys; assert sys.version_info >= (3,10)" 2>$null
              if ($LASTEXITCODE -eq 0) { $resolved = $candidate; break }
            } catch {}
          }
          if (!$resolved) { throw 'No working Python 3.10+ interpreter found.' }
          "JARNSEN_PYTHON=$resolved" >> $env:GITHUB_ENV
          Write-Host "Using Python: $resolved"

      - name: Select exact present descriptor-failure device
        id: failedusb
        shell: powershell
        run: |
          Write-Host 'MODE=TARGETED_USB_PNP_RECOVERY_NO_FLASH_NO_ERASE_NO_FIRMWARE_WRITE'
          $now = Get-Date
          $candidates = @()
          foreach ($d in @(Get-PnpDevice -PresentOnly -Class USB -ErrorAction SilentlyContinue)) {
            try {
              $hw = Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_HardwareIds' -ErrorAction Stop
              $ids = @($hw.Data)
              if ($ids -notcontains 'USB\DEVICE_DESCRIPTOR_FAILURE') { continue }
              $arrival = $null
              try {
                $arrival = (Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_LastArrivalDate' -ErrorAction Stop).Data
              } catch {}
              $loc = $null
              try {
                $loc = (Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_LocationInfo' -ErrorAction Stop).Data
              } catch {}
              Write-Host "CANDIDATE id=$($d.InstanceId) status=$($d.Status) arrival=$arrival location=$loc"
              if ($arrival -and (($now - [datetime]$arrival).TotalMinutes -le 30)) {
                $candidates += [pscustomobject]@{ Device=$d; Arrival=[datetime]$arrival; Location=[string]$loc }
              }
            } catch {}
          }
          if ($candidates.Count -ne 1) {
            throw "Refusing recovery: expected exactly one recent present USB descriptor failure, found $($candidates.Count)."
          }
          $target = $candidates[0]
          Write-Host "TARGET_INSTANCE_ID=$($target.Device.InstanceId)"
          Write-Host "TARGET_LAST_ARRIVAL=$($target.Arrival.ToString('o'))"
          Write-Host "TARGET_LOCATION=$($target.Location)"
          "instance=$($target.Device.InstanceId)" >> $env:GITHUB_OUTPUT
          Write-Host 'RESULT=EXACT_RECENT_DESCRIPTOR_FAILURE_SELECTED'

      - name: Restart only selected USB device
        shell: powershell
        env:
          TARGET_INSTANCE: ${{ steps.failedusb.outputs.instance }}
        run: |
          Write-Host 'MODE=TARGETED_PNP_RESTART_ONLY_NO_FLASH_NO_ERASE_NO_FIRMWARE_WRITE'
          Write-Host "Restarting exact instance: $env:TARGET_INSTANCE"
          pnputil /restart-device "$env:TARGET_INSTANCE"
          $rc = $LASTEXITCODE
          Write-Host "PNPUTIL_RESTART_EXIT=$rc"
          if ($rc -ne 0) { exit $rc }
          Start-Sleep -Seconds 3
          pnputil /scan-devices
          Write-Host "PNPUTIL_SCAN_EXIT=$LASTEXITCODE"
          Start-Sleep -Seconds 5

      - name: Inspect USB and COM after restart
        id: tracker
        shell: powershell
        run: |
          Write-Host 'MODE=READ_ONLY_POST_RESTART_ENUMERATION'
          $expected = ($env:JARNSEN_TRACKER_SERIAL -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          $ports = @(Get-CimInstance Win32_SerialPort -ErrorAction SilentlyContinue)
          foreach ($p in $ports) {
            Write-Host "SERIALPORT device=$($p.DeviceID) name=$($p.Name) pnp=$($p.PNPDeviceID) status=$($p.Status)"
          }
          $devices = @(Get-CimInstance Win32_PnPEntity -ErrorAction SilentlyContinue)
          $exact = @($devices | Where-Object {
            $norm = (([string]$_.PNPDeviceID) -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
            $expected -and $norm.Contains($expected)
          })
          Write-Host "EXACT_TRACKER_PNP_MATCH_COUNT=$($exact.Count)"
          foreach ($d in $exact) {
            Write-Host "EXACT_TRACKER_PNP name=$($d.Name) id=$($d.PNPDeviceID) status=$($d.Status) error=$($d.ConfigManagerErrorCode) service=$($d.Service)"
          }

          $py = $env:JARNSEN_PYTHON
          & $py -m pip install --disable-pip-version-check pyserial 1>$null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $script = @'
          import os
          from serial.tools import list_ports
          expected = ''.join(ch for ch in os.environ['JARNSEN_TRACKER_SERIAL'] if ch.isalnum()).upper()
          matches = []
          for p in list_ports.comports():
              serial = str(getattr(p, 'serial_number', '') or '')
              hwid = str(getattr(p, 'hwid', '') or '')
              norm_serial = ''.join(ch for ch in serial if ch.isalnum()).upper()
              norm_hwid = ''.join(ch for ch in hwid if ch.isalnum()).upper()
              print(f"PYPORT device={p.device!r} vid={getattr(p,'vid',None)!r} pid={getattr(p,'pid',None)!r} serial={serial!r} hwid={hwid!r} desc={getattr(p,'description','')!r}")
              if norm_serial == expected or (expected and expected in norm_hwid):
                  matches.append(p)
          if len(matches) != 1:
              raise SystemExit(f'EXACT_TRACKER_PORT_MATCH_COUNT={len(matches)}')
          p = matches[0]
          print(f'EXACT_TRACKER_PORT={p.device}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'port={p.device}\n')
          '@
          $script | & $py -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'RESULT=TRACKER_USB_RECOVERED_AND_BOUND'

      - name: Read Tracker Meshtastic info
        shell: powershell
        env:
          TRACKER_PORT: ${{ steps.tracker.outputs.port }}
        run: |
          $py = $env:JARNSEN_PYTHON
          & $py -m pip install --disable-pip-version-check "meshtastic>=2.7.0" 1>$null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "MODE=READ_ONLY_SERIAL_INFO port=$env:TRACKER_PORT"
          & $py tools\jarnsen_mesh_flasher\helper.py meshtastic --port "$env:TRACKER_PORT" --info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'RESULT=EXACT_TRACKER_MESHTASTIC_INFO_OK'
