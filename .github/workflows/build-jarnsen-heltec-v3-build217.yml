name: Build JARNSEN Heltec V3 · Build 217
run-name: "JARNSEN Heltec V3 · Build 217"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - '.github/workflows/build-jarnsen-heltec-v3-build217.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v3:
    name: Compile Heltec V3 · Build 217
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout exact Build 217 source
        uses: actions/checkout@v4
        with:
          ref: e35e6d1fec501458e28a56d2fd4a0bbe4f5035f4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve JARNSEN-MESH version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Apply Unified Core source transforms
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_tracker_full_lock_ui.py
          git diff --check

      - name: Compile Heltec V3 Unified Core
        shell: bash
        env:
          JARNSEN_BOARD_NAME: Heltec V3
          JARNSEN_PIO_ENV: heltec-v3
          JARNSEN_BOOT_HARDWARE: HELTEC V3
          JARNSEN_BUILD_NUMBER: 217
        run: bash .buildkite/run-unified-build-daily.sh

      - name: Collect and validate Heltec V3 firmware
        shell: bash
        run: |
          set -euo pipefail
          python .buildkite/package-jarnsen-firmware.py \
            --environment 'heltec-v3' \
            --board 'Heltec V3' \
            --artifact-label 'Heltec-V3' \
            --artifact-kind 'esp32' \
            --webflasher 'true' \
            --version "${JARNSEN_VERSION}" \
            --build 217 \
            --source-sha 'e35e6d1fec501458e28a56d2fd4a0bbe4f5035f4'

      - name: Upload Heltec V3 firmware artifact
        id: upload_v3
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-V3-${{ steps.version.outputs.version }}-Build-217
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Back off before Heltec V3 artifact upload retry
        if: ${{ steps.upload_v3.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Retry Heltec V3 firmware artifact upload
        if: ${{ steps.upload_v3.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-V3-${{ steps.version.outputs.version }}-Build-217
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Heltec V3 compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-errors-heltec-v3-Build-217
          path: |
            unified-heltec-v3.log
            unified-heltec-v3-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 14
