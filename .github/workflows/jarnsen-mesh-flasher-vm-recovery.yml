name: JARNSEN-MESH Flasher Linux VM Recovery
run-name: "JARNSEN-MESH-FLASHER Linux VM Recovery · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-vm-recovery.yml

permissions:
  contents: read

concurrency:
  group: jarnsen-mesh-flasher-linux-vm-recovery
  cancel-in-progress: false

env:
  JARNSEN_HIL_REFERENCE_BUILD: "184"
  JARNSEN_HIL_VM: "Jarnsen-Build"
  JARNSEN_SUPREME_SERIAL: "48:CA:43:5C:2F:EC"

jobs:
  stale-capture-preflight:
    name: JARNO-PC · prove stale Supreme capture
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    outputs:
      recovery_needed: ${{ steps.preflight.outputs.recovery_needed }}

    steps:
      - name: Prove exact stale capture without changing hardware
        id: preflight
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing VM recovery preflight on unexpected runner '$env:RUNNER_NAME'."
          }
          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          function Normalize-UsbSerial([string]$Serial) {
            return (($Serial -replace '[^0-9A-Za-z]', '').ToUpperInvariant())
          }
          function Get-ExactHostState {
            $raw = (& $vbox list usbhost 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'VBoxManage list usbhost failed.' }
            $expected = Normalize-UsbSerial $env:JARNSEN_SUPREME_SERIAL
            $found = @()
            foreach ($block in ($raw -split '(?:\r?\n){2,}')) {
              $vendorMatch = [regex]::Match($block, '(?im)^\s*VendorId:\s*0x([0-9a-f]{4})')
              $productMatch = [regex]::Match($block, '(?im)^\s*ProductId:\s*0x([0-9a-f]{4})')
              $serialMatch = [regex]::Match($block, '(?im)^\s*SerialNumber:\s*(.*?)\s*$')
              $stateMatch = [regex]::Match($block, '(?im)^\s*Current State:\s*(.*?)\s*$')
              if (-not ($vendorMatch.Success -and $productMatch.Success -and $serialMatch.Success -and $stateMatch.Success)) { continue }
              if ($vendorMatch.Groups[1].Value.ToUpperInvariant() -ne '303A') { continue }
              if ($productMatch.Groups[1].Value.ToUpperInvariant() -ne '1001') { continue }
              if ((Normalize-UsbSerial $serialMatch.Groups[1].Value) -ne $expected) { continue }
              $found += [pscustomobject]@{ State = $stateMatch.Groups[1].Value.Trim(); Block = $block }
            }
            if ($found.Count -ne 1) { throw "Expected exactly one exact Supreme host record, found $($found.Count)." }
            return $found[0]
          }
          function Get-ExactVmAttachmentCount {
            $details = (& $vbox showvminfo $env:JARNSEN_HIL_VM --details 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect VM '$env:JARNSEN_HIL_VM'." }
            $expected = Normalize-UsbSerial $env:JARNSEN_SUPREME_SERIAL
            $count = 0
            foreach ($block in ($details -split '(?:\r?\n){2,}')) {
              $serialMatch = [regex]::Match($block, '(?im)^\s*SerialNumber:\s*(.*?)\s*$')
              if ($serialMatch.Success -and (Normalize-UsbSerial $serialMatch.Groups[1].Value) -eq $expected) { $count++ }
            }
            return $count
          }

          $running = (& $vbox list runningvms 2>&1 | Out-String)
          if ($running -notmatch ('"' + [regex]::Escape($env:JARNSEN_HIL_VM) + '"')) {
            throw "VM '$env:JARNSEN_HIL_VM' is not running; refusing to infer recovery state."
          }

          $hostDevice = Get-ExactHostState
          $vmCount = Get-ExactVmAttachmentCount
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          Write-Host 'MODE=READ_ONLY_STALE_CAPTURE_PROOF_NO_USB_DETACH_NO_RESET_NO_FLASH_NO_ERASE'
          Write-Host $hostDevice.Block
          Write-Host "HostState=$($hostDevice.State) ExactVmAttachmentCount=$vmCount"

          if ($hostDevice.State -eq 'Captured' -and $vmCount -eq 0) {
            "recovery_needed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'RESULT=EXACT_STALE_SUPREME_CAPTURE_PROVEN'
          } else {
            "recovery_needed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'RESULT=STALE_CAPTURE_NOT_PRESENT_NO_VM_RECYCLE_REQUIRED'
          }

  linux-graceful-shutdown:
    name: Jarnsen-Build · probe graceful shutdown capability
    needs: stale-capture-preflight
    if: ${{ needs.stale-capture-preflight.outputs.recovery_needed == 'true' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    outputs:
      shutdown_scheduled: ${{ steps.shutdown.outputs.shutdown_scheduled }}

    steps:
      - name: Schedule graceful shutdown only when exact NOPASSWD poweroff is authorized
        id: shutdown
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != 'Jarnsen-Build' ]; then
            echo "Refusing VM shutdown on unexpected runner '${RUNNER_NAME:-unknown}'." >&2
            exit 10
          fi
          SYSTEMCTL="$(command -v systemctl || true)"
          if [ -z "$SYSTEMCTL" ]; then
            echo 'shutdown_scheduled=false' >> "$GITHUB_OUTPUT"
            echo 'RESULT=SYSTEMCTL_NOT_FOUND_NO_SHUTDOWN_ATTEMPTED'
            exit 0
          fi
          echo "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          echo "RunnerUser=$(id -un) Systemctl=$SYSTEMCTL"
          echo 'MODE=GRACEFUL_GUEST_POWEROFF_EXACT_SUDO_ONLY_NO_FORCE_POWEROFF_NO_BOARD_ACCESS'
          if ! sudo -n -l "$SYSTEMCTL" poweroff >/dev/null 2>&1; then
            echo 'shutdown_scheduled=false' >> "$GITHUB_OUTPUT"
            echo 'RESULT=EXACT_POWEROFF_SUDO_NOT_AUTHORIZED_NO_SHUTDOWN_ATTEMPTED'
            exit 0
          fi
          sync
          (
            unset RUNNER_TRACKING_ID
            nohup sh -c "sleep 5; sync; sudo -n '$SYSTEMCTL' poweroff" >/tmp/jarnsen-hil-poweroff.log 2>&1 &
          )
          echo 'shutdown_scheduled=true' >> "$GITHUB_OUTPUT"
          echo 'RESULT=GRACEFUL_POWEROFF_SCHEDULED_AFTER_JOB_EXIT'

  windows-exact-pnp-inventory:
    name: JARNO-PC · exact Supreme PnP inventory
    needs:
      - stale-capture-preflight
      - linux-graceful-shutdown
    if: ${{ always() && needs.stale-capture-preflight.outputs.recovery_needed == 'true' && needs.linux-graceful-shutdown.outputs.shutdown_scheduled != 'true' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5

    steps:
      - name: Identify exact Windows PnP instance without resetting it
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing PnP inventory on unexpected runner '$env:RUNNER_NAME'."
          }
          function Normalize([string]$Value) {
            return (($Value -replace '[^0-9A-Za-z]', '').ToUpperInvariant())
          }
          $expected = Normalize $env:JARNSEN_SUPREME_SERIAL
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          Write-Host 'MODE=READ_ONLY_EXACT_PNP_INVENTORY_NO_DEVICE_RESTART_NO_PORT_OPEN_NO_FLASH_NO_ERASE'

          $usbFamily = @(Get-CimInstance Win32_PnPEntity | Where-Object {
            $_.DeviceID -match '(?i)VID_303A&PID_1001'
          })
          Write-Host "ESPRESSIF_PNP_FAMILY_COUNT=$($usbFamily.Count)"
          $exact = @()
          foreach ($dev in $usbFamily) {
            $normalizedId = Normalize ([string]$dev.DeviceID)
            Write-Host "PNP name='$($dev.Name)' status='$($dev.Status)' class='$($dev.PNPClass)' deviceId='$($dev.DeviceID)'"
            if ($normalizedId.Contains($expected)) { $exact += $dev }
          }

          Write-Host '=== Serial ports matching Espressif family ==='
          @(Get-CimInstance Win32_SerialPort | Where-Object { $_.PNPDeviceID -match '(?i)VID_303A&PID_1001' }) |
            ForEach-Object {
              Write-Host "SERIALPORT device='$($_.DeviceID)' name='$($_.Name)' pnp='$($_.PNPDeviceID)' status='$($_.Status)'"
            }

          Write-Host '=== pnputil connected Ports inventory ==='
          & pnputil.exe /enum-devices /connected /class Ports 2>&1 | Write-Host

          Write-Host "EXACT_SUPREME_PNP_MATCH_COUNT=$($exact.Count)"
          if ($exact.Count -eq 1) {
            Write-Host "EXACT_SUPREME_PNP_INSTANCE_ID=$($exact[0].DeviceID)"
            Write-Host "EXACT_SUPREME_PNP_NAME=$($exact[0].Name)"
            Write-Host "EXACT_SUPREME_PNP_STATUS=$($exact[0].Status)"
            Write-Host 'RESULT=EXACT_SUPREME_PNP_INSTANCE_PROVEN_READ_ONLY'
          } else {
            Write-Host 'RESULT=EXACT_SUPREME_PNP_INSTANCE_NOT_UNIQUE_READ_ONLY'
          }

  windows-restart-vm:
    name: JARNO-PC · verify release and restart VM
    needs:
      - stale-capture-preflight
      - linux-graceful-shutdown
    if: ${{ always() && needs.stale-capture-preflight.outputs.recovery_needed == 'true' && needs.linux-graceful-shutdown.outputs.shutdown_scheduled == 'true' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      SHUTDOWN_RESULT: ${{ needs.linux-graceful-shutdown.result }}

    steps:
      - name: Wait for graceful stop, prove USB release, then restart
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing VM restart on unexpected runner '$env:RUNNER_NAME'."
          }
          if ($env:SHUTDOWN_RESULT -ne 'success') {
            throw "Linux graceful shutdown job result was '$env:SHUTDOWN_RESULT'; refusing host-side restart action."
          }

          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          function Normalize-UsbSerial([string]$Serial) {
            return (($Serial -replace '[^0-9A-Za-z]', '').ToUpperInvariant())
          }
          function Test-VmRunning {
            $running = (& $vbox list runningvms 2>&1 | Out-String)
            return $running -match ('"' + [regex]::Escape($env:JARNSEN_HIL_VM) + '"')
          }
          function Get-ExactHostState {
            $raw = (& $vbox list usbhost 2>&1 | Out-String)
            $expected = Normalize-UsbSerial $env:JARNSEN_SUPREME_SERIAL
            $states = @()
            foreach ($block in ($raw -split '(?:\r?\n){2,}')) {
              $vendorMatch = [regex]::Match($block, '(?im)^\s*VendorId:\s*0x([0-9a-f]{4})')
              $productMatch = [regex]::Match($block, '(?im)^\s*ProductId:\s*0x([0-9a-f]{4})')
              $serialMatch = [regex]::Match($block, '(?im)^\s*SerialNumber:\s*(.*?)\s*$')
              $stateMatch = [regex]::Match($block, '(?im)^\s*Current State:\s*(.*?)\s*$')
              if (-not ($vendorMatch.Success -and $productMatch.Success -and $serialMatch.Success -and $stateMatch.Success)) { continue }
              if ($vendorMatch.Groups[1].Value.ToUpperInvariant() -eq '303A' -and $productMatch.Groups[1].Value.ToUpperInvariant() -eq '1001' -and (Normalize-UsbSerial $serialMatch.Groups[1].Value) -eq $expected) {
                $states += $stateMatch.Groups[1].Value.Trim()
              }
            }
            if ($states.Count -ne 1) { throw "Expected one exact Supreme after VM stop, found $($states.Count)." }
            return $states[0]
          }

          Write-Host 'Waiting for guest-scheduled graceful poweroff. Force poweroff is disabled.'
          $stopped = $false
          for ($i = 1; $i -le 75; $i++) {
            Start-Sleep -Seconds 1
            if (-not (Test-VmRunning)) {
              $stopped = $true
              Write-Host "VM stopped gracefully after ${i}s."
              break
            }
          }
          if (-not $stopped) {
            throw 'VM did not stop after the guest scheduled poweroff. Force poweroff is intentionally disabled.'
          }

          Start-Sleep -Seconds 3
          $stoppedState = Get-ExactHostState
          Write-Host "Exact Supreme state with VM stopped: $stoppedState"
          if ($stoppedState -eq 'Captured') {
            throw 'Exact Supreme is still Captured with Jarnsen-Build fully stopped; stale ownership is outside the VM session.'
          }
          Write-Host "RESULT=STALE_CAPTURE_RELEASED_BY_GUEST_GRACEFUL_STOP state=$stoppedState"

          Write-Host "Starting '$env:JARNSEN_HIL_VM' again."
          $startOut = (& $vbox startvm $env:JARNSEN_HIL_VM --type gui 2>&1 | Out-String)
          $startCode = $LASTEXITCODE
          if ($startOut) { Write-Host $startOut }
          if ($startCode -ne 0) { throw "VM restart failed with exit code $startCode." }

          $runningAgain = $false
          for ($i = 1; $i -le 45; $i++) {
            Start-Sleep -Seconds 1
            if (Test-VmRunning) {
              $runningAgain = $true
              Write-Host "VM is running again after ${i}s."
              break
            }
          }
          if (-not $runningAgain) { throw 'VM did not return to running state.' }

          Start-Sleep -Seconds 4
          $finalState = Get-ExactHostState
          Write-Host "Exact Supreme state after VM restart: $finalState"
          if ($finalState -eq 'Captured') {
            throw 'Exact Supreme was automatically recaptured after VM restart even though persistent HIL filters were disabled.'
          }
          Write-Host "RESULT=VM_RESTARTED_SUPREME_RELEASED final_state=$finalState"

  linux-runner-return:
    name: Jarnsen-Build · runner returned after recovery
    needs: windows-restart-vm
    if: ${{ needs.windows-restart-vm.result == 'success' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Confirm runner identity after VM restart
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_NAME:-}" != 'Jarnsen-Build' ]; then
            echo "Unexpected runner '${RUNNER_NAME:-unknown}'." >&2
            exit 10
          fi
          echo "ReferenceBuild=$JARNSEN_HIL_REFERENCE_BUILD"
          echo 'RESULT=LINUX_HIL_RUNNER_RETURNED_AFTER_VM_RECOVERY'
