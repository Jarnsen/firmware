name: JARNSEN-MESH Flasher Linux VM Recovery
run-name: "JARNSEN-MESH-FLASHER Linux VM Recovery · Build ${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/jarnsen-mesh-flasher-vm-recovery.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: jarnsen-mesh-flasher-linux-vm-recovery
  cancel-in-progress: false

env:
  JARNSEN_HIL_REFERENCE_BUILD: "184"
  JARNSEN_HIL_VM: "Jarnsen-Build"
  JARNSEN_HIL_RUNNER: "Jarnsen-Build"
  JARNSEN_SUPREME_SERIAL: "48:CA:43:5C:2F:EC"
  JARNSEN_SUPREME_VID: "303A"
  JARNSEN_SUPREME_PID: "1001"

jobs:
  recover-vm:
    name: JARNO-PC · graceful stale USB proxy recovery
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8

    steps:
      - name: Gracefully recycle VM only when exact stale capture is proven
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'JARNO-PC') {
            throw "Refusing VM recovery on unexpected runner '$env:RUNNER_NAME'."
          }
          Write-Host "ReferenceBuild=$env:JARNSEN_HIL_REFERENCE_BUILD"
          Write-Host 'MODE=VM_ACPI_RECOVERY_NO_BOARD_RESET_NO_FLASH_NO_ERASE_NO_FORCE_POWEROFF'

          $command = Get-Command VBoxManage.exe -ErrorAction SilentlyContinue
          $vbox = if ($command) { $command.Source } else { 'C:\Program Files\Oracle\VirtualBox\VBoxManage.exe' }
          if (-not (Test-Path -LiteralPath $vbox)) { throw 'VBoxManage.exe was not found.' }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'JARNSEN-MESH-FLASHER-HIL'
          }

          function Assert-LinuxRunnerIdle {
            param([string]$Phase)
            $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?status=in_progress&per_page=100"
            $runs = Invoke-RestMethod -Headers $headers -Uri $runsUri -Method Get
            $busy = @()
            foreach ($run in @($runs.workflow_runs)) {
              if ([string]$run.id -eq [string]$env:GITHUB_RUN_ID) { continue }
              $jobs = Invoke-RestMethod -Headers $headers -Uri ($run.jobs_url + '?filter=latest&per_page=100') -Method Get
              foreach ($job in @($jobs.jobs)) {
                if ($job.status -eq 'in_progress' -and $job.runner_name -eq $env:JARNSEN_HIL_RUNNER) {
                  $busy += [pscustomobject]@{ run_id = $run.id; run_name = $run.name; job_id = $job.id; job_name = $job.name }
                }
              }
            }
            if ($busy.Count -gt 0) {
              $busy | Format-Table -AutoSize | Out-String | Write-Host
              throw "Refusing VM recovery during '$Phase': runner '$env:JARNSEN_HIL_RUNNER' has $($busy.Count) active job(s)."
            }
            Write-Host "Runner-idle proof [$Phase]: no other in-progress job is assigned to $env:JARNSEN_HIL_RUNNER."
          }

          function Get-ExactSupremeHostBlock {
            $raw = (& $vbox list usbhost 2>&1 | Out-String)
            $blocks = @($raw -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object {
              $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL)) -and
              $_ -match ('VendorId:\s*0x' + $env:JARNSEN_SUPREME_VID) -and
              $_ -match ('ProductId:\s*0x' + $env:JARNSEN_SUPREME_PID)
            })
          }

          function Get-ExactVmAttachmentCount {
            $details = (& $vbox showvminfo $env:JARNSEN_HIL_VM --details 2>&1 | Out-String)
            $blocks = @($details -split '(?:\r?\n){2,}')
            return @($blocks | Where-Object {
              $_ -match ('SerialNumber:\s*' + [regex]::Escape($env:JARNSEN_SUPREME_SERIAL))
            }).Count
          }

          function Test-VmRunning {
            $running = (& $vbox list runningvms 2>&1 | Out-String)
            return $running -match ('"' + [regex]::Escape($env:JARNSEN_HIL_VM) + '"')
          }

          if (-not (Test-VmRunning)) {
            throw "VM '$env:JARNSEN_HIL_VM' is not currently running; refusing to infer its state."
          }

          $exact = @(Get-ExactSupremeHostBlock)
          if ($exact.Count -ne 1) {
            throw "Expected exactly one exact Supreme host record, found $($exact.Count)."
          }
          Write-Host '=== Exact Supreme before VM recovery ==='
          Write-Host $exact[0]
          $hostState = if ($exact[0] -match 'Current State:\s*([^\r\n]+)') { $Matches[1].Trim() } else { 'unknown' }
          $vmCount = Get-ExactVmAttachmentCount
          Write-Host "HostState=$hostState ExactVmAttachmentCount=$vmCount"

          if ($hostState -ne 'Captured' -or $vmCount -ne 0) {
            Write-Host 'RESULT=NO_PROVEN_STALE_CAPTURE_VM_RESTART_NOT_REQUIRED'
            exit 0
          }

          Assert-LinuxRunnerIdle -Phase 'preflight-1'
          Start-Sleep -Seconds 2
          Assert-LinuxRunnerIdle -Phase 'preflight-2'

          # Re-prove the exact stale condition immediately before requesting shutdown.
          $exact = @(Get-ExactSupremeHostBlock)
          if ($exact.Count -ne 1) { throw 'Exact Supreme identity changed before ACPI recovery.' }
          $hostState = if ($exact[0] -match 'Current State:\s*([^\r\n]+)') { $Matches[1].Trim() } else { 'unknown' }
          $vmCount = Get-ExactVmAttachmentCount
          if ($hostState -ne 'Captured' -or $vmCount -ne 0) {
            throw "Stale-capture proof changed before ACPI recovery: state=$hostState vmCount=$vmCount."
          }

          $vmWasStopped = $false
          $vmRestarted = $false
          $recoveryError = $null
          try {
            Write-Host "Requesting graceful ACPI shutdown for '$env:JARNSEN_HIL_VM'."
            & $vbox controlvm $env:JARNSEN_HIL_VM acpipowerbutton
            if ($LASTEXITCODE -ne 0) { throw "ACPI shutdown request failed with exit code $LASTEXITCODE." }

            for ($i = 1; $i -le 90; $i++) {
              Start-Sleep -Seconds 1
              if (-not (Test-VmRunning)) {
                $vmWasStopped = $true
                Write-Host "VM stopped gracefully after ${i}s."
                break
              }
            }
            if (-not $vmWasStopped) {
              throw 'VM did not stop after 90s. Force poweroff is intentionally disabled.'
            }

            Start-Sleep -Seconds 4
            $exactAfterStop = @(Get-ExactSupremeHostBlock)
            if ($exactAfterStop.Count -ne 1) {
              throw "After VM shutdown, exact Supreme host record count is $($exactAfterStop.Count), expected 1."
            }
            Write-Host '=== Exact Supreme with VM stopped ==='
            Write-Host $exactAfterStop[0]
            $afterStopState = if ($exactAfterStop[0] -match 'Current State:\s*([^\r\n]+)') { $Matches[1].Trim() } else { 'unknown' }
            if ($afterStopState -eq 'Captured') {
              throw 'Exact Supreme is still Captured even with the VM fully stopped.'
            }
            Write-Host "RESULT=STALE_CAPTURE_RELEASED_BY_GRACEFUL_VM_STOP state=$afterStopState"
          } catch {
            $recoveryError = $_
            Write-Host "Recovery phase failed: $($_.Exception.Message)"
          } finally {
            if ($vmWasStopped -and -not (Test-VmRunning)) {
              Write-Host "Starting '$env:JARNSEN_HIL_VM' again using GUI frontend."
              & $vbox startvm $env:JARNSEN_HIL_VM --type gui
              if ($LASTEXITCODE -ne 0) {
                throw "VM restart failed with exit code $LASTEXITCODE. Original recovery error: $($recoveryError.Exception.Message)"
              }
              for ($i = 1; $i -le 90; $i++) {
                Start-Sleep -Seconds 1
                if (Test-VmRunning) {
                  $vmRestarted = $true
                  Write-Host "VM is running again after ${i}s."
                  break
                }
              }
              if (-not $vmRestarted) {
                throw "VM did not return to running state after restart. Original recovery error: $($recoveryError.Exception.Message)"
              }
            }
          }

          if ($recoveryError) { throw $recoveryError }
          if (-not $vmWasStopped -or -not $vmRestarted) {
            throw 'Recovery completed without a full proven graceful stop/start cycle.'
          }

          Start-Sleep -Seconds 5
          $exactFinal = @(Get-ExactSupremeHostBlock)
          if ($exactFinal.Count -ne 1) {
            throw "After VM restart, exact Supreme host record count is $($exactFinal.Count), expected 1."
          }
          Write-Host '=== Exact Supreme after VM restart ==='
          Write-Host $exactFinal[0]
          $finalState = if ($exactFinal[0] -match 'Current State:\s*([^\r\n]+)') { $Matches[1].Trim() } else { 'unknown' }
          if ($finalState -eq 'Captured') {
            throw 'Exact Supreme returned to Captured state without an explicit HIL attach after VM restart.'
          }
          Write-Host "RESULT=VM_RECOVERED_SUPREME_RELEASED final_state=$finalState"
