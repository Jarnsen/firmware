name: Patch tracker service display handoff

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/workflows/jarnsen-patch-tracker-service-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
          fetch-depth: 0

      - name: Patch TAK and TAK_TRACKER display ownership
        shell: python
        run: |
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # ---------------- TAK ----------------
          p = Path("src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp")
          s = p.read_text()

          s = replace_one(s,
          '''#ifndef TAK_LEADER_FRAME_REASSERT_MS
          #define TAK_LEADER_FRAME_REASSERT_MS 300UL
          #endif''',
          '''#ifndef TAK_LEADER_FRAME_REASSERT_INTERVAL_MS
          #define TAK_LEADER_FRAME_REASSERT_INTERVAL_MS 100UL
          #endif

          #ifndef TAK_LEADER_FRAME_REASSERT_WINDOW_MS
          #define TAK_LEADER_FRAME_REASSERT_WINDOW_MS 2500UL
          #endif''',
          "TAK reassert defines")

          s = replace_one(s,
          '''static bool leaderServiceFrameActive = false;
          static bool leaderFrameReassertPending = false;
          static uint32_t leaderFrameReassertAtMs = 0;''',
          '''static bool leaderServiceFrameActive = false;
          static bool leaderFrameReassertPending = false;
          static uint32_t leaderFrameReassertAtMs = 0;
          static uint32_t leaderFrameReassertUntilMs = 0;''',
          "TAK reassert state")

          s = replace_one(s,
          '''static void drawTakLeaderServiceFrame(OLEDDisplay *display, OLEDDisplayUiState *, int16_t x, int16_t y)''',
          '''static void drawTakLeaderServiceFrame(OLEDDisplay *display, OLEDDisplayUiState *state, int16_t x, int16_t y)''',
          "TAK draw signature")

          s = replace_one(s,
          '''        top += (i == 0 ? titleHeight : bodyHeight) + spacing;
              }
          }

          static void stopTakLeaderServiceFrame()''',
          '''        top += (i == 0 ? titleHeight : bodyHeight) + spacing;
              }

              // Keep the Meshtastic pairing PIN readable without surrendering the
              // exclusive TAK service frame to the stock carousel.
              if (graphics::NotificationRenderer::current_notification_type ==
                  graphics::notificationTypeEnum::pairing_pin) {
                  graphics::NotificationRenderer::drawBannercallback(display, state);
              }
          }

          static void stopTakLeaderServiceFrame()''',
          "TAK pairing overlay")

          s = replace_one(s,
          '''    leaderServiceFrameActive = true;
              leaderFrameReassertPending = armReassert;
              leaderFrameReassertAtMs = now + TAK_LEADER_FRAME_REASSERT_MS;''',
          '''    leaderServiceFrameActive = true;
              leaderFrameReassertPending = armReassert;
              leaderFrameReassertAtMs = now + TAK_LEADER_FRAME_REASSERT_INTERVAL_MS;
              leaderFrameReassertUntilMs = now + TAK_LEADER_FRAME_REASSERT_WINDOW_MS;''',
          "TAK reassert arm")

          s = replace_one(s,
          '''                        // Close the same boot-screen race as TAK_TRACKER with
                          // one delayed reassertion, not a periodic redraw.
                          if (leaderFrameReassertPending &&
                              (int32_t)(now - leaderFrameReassertAtMs) >= 0) {
                              screen->startAlert(drawTakLeaderServiceFrame);
                              leaderServiceFrameActive = true;
                              leaderFrameReassertPending = false;
                          }
                      } else {
                          stopTakLeaderServiceFrame();
                          if (screen->isScreenOn())
                              screen->setOn(false);
                      }''',
          '''                        // During the short handoff after GPIO0/boot, Meshtastic can
                          // finish its boot frame or re-init the Tracker TFT slightly later.
                          // Reassert only during this bounded 2.5 s handoff window; afterwards
                          // the alert remains installed without periodic redraws.
                          if (leaderFrameReassertPending &&
                              (int32_t)(now - leaderFrameReassertAtMs) >= 0) {
                              screen->startAlert(drawTakLeaderServiceFrame);
                              leaderServiceFrameActive = true;
                              if ((int32_t)(now - leaderFrameReassertUntilMs) >= 0) {
                                  leaderFrameReassertPending = false;
                              } else {
                                  leaderFrameReassertAtMs = now + TAK_LEADER_FRAME_REASSERT_INTERVAL_MS;
                              }
                          }
                      } else {
                          // Turn only the physical panel off. Keep the exclusive service
                          // alert installed for the complete BLE/service session so USB,
                          // serial, telemetry or a TFT re-init cannot expose stock frames.
                          if (screen->isScreenOn())
                              screen->setOn(false);
                      }''',
          "TAK active display loop")

          p.write_text(s)

          # ------------- TAK_TRACKER -------------
          p = Path("src/vehicle/VehicleServicePolicy.cpp")
          s = p.read_text()

          s = replace_one(s,
          '''#ifndef VEHICLE_SERVICE_FRAME_REASSERT_MS
          #define VEHICLE_SERVICE_FRAME_REASSERT_MS 300UL
          #endif''',
          '''#ifndef VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS
          #define VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS 100UL
          #endif

          #ifndef VEHICLE_SERVICE_FRAME_REASSERT_WINDOW_MS
          #define VEHICLE_SERVICE_FRAME_REASSERT_WINDOW_MS 2500UL
          #endif''',
          "TAK_TRACKER reassert defines")

          s = replace_one(s,
          '''static bool serviceFrameActive = false;
          static bool serviceFrameReassertPending = false;
          static uint32_t serviceFrameReassertAtMs = 0;''',
          '''static bool serviceFrameActive = false;
          static bool serviceFrameReassertPending = false;
          static uint32_t serviceFrameReassertAtMs = 0;
          static uint32_t serviceFrameReassertUntilMs = 0;''',
          "TAK_TRACKER reassert state")

          s = replace_one(s,
          '''static void drawVehicleServiceFrame(OLEDDisplay *display, OLEDDisplayUiState *, int16_t x, int16_t y)''',
          '''static void drawVehicleServiceFrame(OLEDDisplay *display, OLEDDisplayUiState *state, int16_t x, int16_t y)''',
          "TAK_TRACKER draw signature")

          s = replace_one(s,
          '''        top += (i == 0 ? titleHeight : bodyHeight) + spacing;
              }
          }

          static void stopVehicleServiceFrame()''',
          '''        top += (i == 0 ? titleHeight : bodyHeight) + spacing;
              }

              // Draw the pairing PIN directly on the exclusive vehicle-service
              // frame instead of exposing the stock Meshtastic carousel.
              if (graphics::NotificationRenderer::current_notification_type ==
                  graphics::notificationTypeEnum::pairing_pin) {
                  graphics::NotificationRenderer::drawBannercallback(display, state);
              }
          }

          static void stopVehicleServiceFrame()''',
          "TAK_TRACKER pairing overlay")

          s = replace_one(s,
          '''    serviceFrameActive = true;
              serviceFrameReassertPending = armReassert;
              serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_MS;''',
          '''    serviceFrameActive = true;
              serviceFrameReassertPending = armReassert;
              serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS;
              serviceFrameReassertUntilMs = now + VEHICLE_SERVICE_FRAME_REASSERT_WINDOW_MS;''',
          "TAK_TRACKER reassert arm")

          s = replace_one(s,
          '''                // One deliberate second assertion closes the STOP_BOOT_SCREEN
                          // race seen in the field log. It is not a periodic redraw.
                          if (serviceFrameReassertPending &&
                              (int32_t)(now - serviceFrameReassertAtMs) >= 0) {
                              screen->startAlert(drawVehicleServiceFrame);
                              serviceFrameActive = true;
                              serviceFrameReassertPending = false;
                          }
                      } else {
                          stopVehicleServiceFrame();
                          if (screen->isScreenOn())
                              screen->setOn(false);
                      }''',
          '''                // Reassert only during the bounded startup/TFT handoff window.
                          // This catches STOP_BOOT_SCREEN and late ui->init() without running a
                          // permanent redraw loop during the whole service session.
                          if (serviceFrameReassertPending &&
                              (int32_t)(now - serviceFrameReassertAtMs) >= 0) {
                              screen->startAlert(drawVehicleServiceFrame);
                              serviceFrameActive = true;
                              if ((int32_t)(now - serviceFrameReassertUntilMs) >= 0) {
                                  serviceFrameReassertPending = false;
                              } else {
                                  serviceFrameReassertAtMs = now + VEHICLE_SERVICE_FRAME_REASSERT_INTERVAL_MS;
                              }
                          }
                      } else {
                          // Keep the exclusive frame installed while the panel is dark.
                          // Any unintended serial/USB wake therefore cannot reveal stock UI.
                          if (screen->isScreenOn())
                              screen->setOn(false);
                      }''',
          "TAK_TRACKER active display loop")

          p.write_text(s)

      - name: Commit patched tracker display policy
        run: |
          git config user.name "Jarnsen Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp src/vehicle/VehicleServicePolicy.cpp
          git diff --cached --check
          git commit -m "Keep tracker service UI after boot handoff"
          git push origin HEAD:heltec-tracker-v11-vehicle-motion-wake
