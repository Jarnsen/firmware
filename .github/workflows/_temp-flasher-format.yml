name: Temporary Flasher format

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-flasher-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install repository-pinned Trunk
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3

      - name: Format only remaining Flasher files with Trunk
        shell: bash
        run: |
          set -euo pipefail
          "$TRUNK_PATH" fmt \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            .github/workflows/jarnsen-mesh-flasher-windows.yml
          "$TRUNK_PATH" check \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            .github/workflows/jarnsen-mesh-flasher-windows.yml

      - name: Commit Trunk-formatted files
        shell: bash
        run: |
          set -euo pipefail
          git add tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py .github/workflows/jarnsen-mesh-flasher-windows.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(flasher): apply Trunk formatting'
          git push origin HEAD:feat/mini-serial-flasher
