name: Temporary Flasher format

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-flasher-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact Trunk formatter versions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black==26.5.1 isort==8.0.1
          npm install --no-save prettier@3.8.3
          python -m isort tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          python -m black tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          npx prettier@3.8.3 --write .github/workflows/jarnsen-mesh-flasher-windows.yml
          python -m isort --check-only tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          python -m black --check tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py
          npx prettier@3.8.3 --check .github/workflows/jarnsen-mesh-flasher-windows.yml

      - name: Commit formatted files
        shell: bash
        run: |
          set -euo pipefail
          git add tools/jarnsen_mesh_flasher/app.py tools/jarnsen_mesh_flasher/reference_dashboard.py .github/workflows/jarnsen-mesh-flasher-windows.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'style(flasher): apply Trunk formatters'
          git push origin HEAD:feat/mini-serial-flasher
