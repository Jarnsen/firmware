name: One-off Tracker Service Tool artifact version naming

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/workflows/oneoff-tracker-tool-artifact-version.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
      - name: Patch Tracker workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml')
          text = path.read_text(encoding='utf-8')

          old = '''      - name: Download verified shared Node Service Tool
        shell: pwsh
'''
          new = '''      - name: Download verified shared Node Service Tool
        id: shared_tool
        shell: pwsh
'''
          if old not in text:
              raise SystemExit('Service Tool download step anchor not found')
          text = text.replace(old, new, 1)

          old = '''          Write-Host "Shared Node Service Tool v$($manifest.version) SHA256=$hash"
          New-Item -ItemType Directory -Force app-artifact | Out-Null
'''
          new = '''          Write-Host "Shared Node Service Tool v$($manifest.version) SHA256=$hash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($manifest.version)" -Encoding utf8
          New-Item -ItemType Directory -Force app-artifact | Out-Null
'''
          if old not in text:
              raise SystemExit('Service Tool manifest output anchor not found')
          text = text.replace(old, new, 1)

          old = '          name: tracker-service-tool-part\n'
          expression = '$' + '{{ steps.shared_tool.outputs.version }}'
          new = f'          name: tracker-service-tool-v{expression}-part\n'
          if old not in text:
              raise SystemExit('Service Tool artifact name anchor not found')
          text = text.replace(old, new, 1)

          expected = 'name: tracker-service-tool-v$' + '{{ steps.shared_tool.outputs.version }}-part'
          if expected not in text:
              raise SystemExit('Versioned artifact name validation failed')
          if 'id: shared_tool' not in text or 'version=$($manifest.version)' not in text:
              raise SystemExit('Shared Tool version output validation failed')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit Tracker workflow fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml
          git commit -m 'Show shared Service Tool version in Tracker artifact'
          git push origin HEAD:heltec-tracker-v11-vehicle-motion-wake
