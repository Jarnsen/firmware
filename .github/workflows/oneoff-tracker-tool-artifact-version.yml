name: One-off Tracker Service Tool artifact version naming

on:
  push:
    branches:
      - heltec-tracker-v11-vehicle-motion-wake
    paths:
      - .github/workflows/oneoff-tracker-tool-artifact-version.yml

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: heltec-tracker-v11-vehicle-motion-wake
      - name: Patch and export Tracker workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml')
          text = path.read_text(encoding='utf-8')
          old = "      - name: Download verified shared Node Service Tool\n        shell: pwsh\n"
          new = "      - name: Download verified shared Node Service Tool\n        id: shared_tool\n        shell: pwsh\n"
          if old not in text:
              raise SystemExit('Service Tool download step anchor not found')
          text = text.replace(old, new, 1)
          old = "          Write-Host \"Shared Node Service Tool v$($manifest.version) SHA256=$hash\"\n          New-Item -ItemType Directory -Force app-artifact | Out-Null\n"
          new = "          Write-Host \"Shared Node Service Tool v$($manifest.version) SHA256=$hash\"\n          Add-Content -Path $env:GITHUB_OUTPUT -Value \"version=$($manifest.version)\" -Encoding utf8\n          New-Item -ItemType Directory -Force app-artifact | Out-Null\n"
          if old not in text:
              raise SystemExit('Service Tool manifest output anchor not found')
          text = text.replace(old, new, 1)
          old = "          name: tracker-service-tool-part\n"
          expression = '$' + '{{ steps.shared_tool.outputs.version }}'
          new = "          name: tracker-service-tool-v" + expression + "-part\n"
          if old not in text:
              raise SystemExit('Service Tool artifact name anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          echo '===PATCHED_WORKFLOW_BASE64_BEGIN==='
          base64 -w0 .github/workflows/build-heltec-tracker-v11-vehicle-motion-wake.yml
          echo
          echo '===PATCHED_WORKFLOW_BASE64_END==='
