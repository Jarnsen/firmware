# consolidated-source validation: 2026-08-28
name: Build Heltec V3 Repeater
run-name: "Heltec V3 Repeater - JARN-MESH V3 Repeater v1.7.1"

env:
  V3_VERSION: "1.7.1"
  V3_VERSION_TAG: "v1.7.1"
  V3_PRODUCT: "JARN-MESH V3 Repeater"

on:
  push:
    branches:
      - heltec-v3-repeater-light-sleep
  pull_request:
    branches:
      - develop
    paths:
      - src/infrastructure/**
      - src/graphics/Screen.cpp
      - src/graphics/Screen.h
      - src/JarnsenLiveDisplay.*
      - src/input/InputBroker.*
      - src/sleep.*
      - src/PowerFSM.cpp
      - src/input/ButtonThread.cpp
      - src/mesh/PhoneAPI.cpp
      - src/mesh/RadioLibInterface.cpp
      - src/nimble/NimbleBluetooth.*
      - tools/V3_DIAG_LOG_DOWNLOADER.py
      - tools/JARNSEN_NODE_SERVICE_TOOL.py
      - tools/patch_jarnsen_diag_clear.py
      - tools/patch_jarnsen_v3_version_page.py
      - tools/V3_Diagnostic_Log_Download.bat
      - tools/README-DIAGNOSTIC-LOG.txt
      - variants/esp32s3/heltec_v3/**
      - docs/heltec-v3-repeater-light-sleep.md
      - .github/workflows/build-heltec-v3-repeater-light-sleep.yml

concurrency:
  group: heltec-v3-repeater-light-sleep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-service-tool:
    runs-on: windows-2025
    steps:
      - name: Download verified shared Node Service Tool
        id: shared_tool
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Remove-Item -Recurse -Force shared-app, app-artifact -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force shared-app | Out-Null
          gh release download jarnsen-service-tool-latest --repo $env:GITHUB_REPOSITORY --clobber `
            --pattern "Jarnsen-Node-Service-Tool.exe" `
            --pattern "jarnsen-node-service-tool.json" `
            --dir shared-app
          if ($LASTEXITCODE -ne 0) { throw "Gemeinsames Node Service Tool konnte nicht geladen werden" }
          $manifest = Get-Content shared-app/jarnsen-node-service-tool.json -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 1 -or $manifest.channel -ne "shared") { throw "Ungültiges Shared-App-Manifest" }
          if ($manifest.supported_devices -notcontains "HELTEC_V3_REPEATER") { throw "Shared-App unterstützt Heltec V3 nicht" }
          $exe = Get-Item shared-app/Jarnsen-Node-Service-Tool.exe
          if ($exe.Length -ne [int64]$manifest.executable_size) { throw "Shared-App-Größe stimmt nicht" }
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          if ($hash -ne [string]$manifest.executable_sha256) { throw "SHA-256 der Shared-App stimmt nicht" }
          Write-Host "Shared Node Service Tool v$($manifest.version) SHA256=$hash"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($manifest.version)" -Encoding utf8
          New-Item -ItemType Directory -Force app-artifact | Out-Null
          Copy-Item $exe.FullName app-artifact/
          Copy-Item shared-app/jarnsen-node-service-tool.json app-artifact/
      - name: Upload app package part
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-service-tool-v${{ steps.shared_tool.outputs.version }}-part
          path: app-artifact/
          if-no-files-found: error
          retention-days: 1

  build-heltec-v3-repeater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x
          cache: pip
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Validate V3 version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["V3_VERSION"]
          workflow = Path(".github/workflows/build-heltec-v3-repeater-light-sleep.yml").read_text()
          build_info = Path("src/infrastructure/HeltecV3BuildInfo.h").read_text()
          assert "name: Build Heltec V3 Repeater" in workflow
          assert f'run-name: "Heltec V3 Repeater - JARN-MESH V3 Repeater v{version}"' in workflow
          assert f'#define JARNSEN_V3_FIRMWARE_SEMVER "v{version}"' in build_info
          assert f'#define JARNSEN_V3_FIRMWARE_VERSION "JARN-MESH V3 Repeater v{version}"' in build_info
          PY
      - name: Enable common BLE diagnostic log clear
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_diag_clear.py
          grep -q 'clearJarnsenDiagLog' src/nimble/NimbleBluetooth.cpp
          grep -q 'memcmp(data, "CLEARLOG", 8)' src/nimble/NimbleBluetooth.cpp
          grep -q '"CLEARED", 7' src/nimble/NimbleBluetooth.cpp
      - name: Expose V3 version on normal display pages
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_v3_version_page.py
          grep -q '"Service %s", JARNSEN_V3_FIRMWARE_SEMVER' src/infrastructure/HeltecV3ServicePage.cpp
          grep -q '"Repeater %s", JARNSEN_V3_FIRMWARE_SEMVER' src/infrastructure/HeltecV3ServicePage.cpp
      - name: Verify V3 runtime policy
        shell: bash
        run: |
          set -euo pipefail
          POLICY=src/infrastructure/HeltecV3RepeaterPolicy.cpp
          MANAGER=src/infrastructure/HeltecV3PhonePositionManager.cpp
          PAGE=src/infrastructure/HeltecV3PositionPage.cpp
          PHONE=src/mesh/PhoneAPI.cpp
          SCREEN=src/graphics/Screen.cpp
          BUTTON=src/input/ButtonThread.cpp
          RADIO=src/mesh/RadioLibInterface.cpp
          NIMBLE_H=src/nimble/NimbleBluetooth.h
          NIMBLE_CPP=src/nimble/NimbleBluetooth.cpp
          DIAG=src/infrastructure/HeltecV3DiagnosticLog.cpp
          SERVICE=src/infrastructure/HeltecV3ServicePage.cpp
          SERVICE_H=src/infrastructure/HeltecV3ServicePage.h
          MESH=src/infrastructure/HeltecV3MeshMonitor.cpp
          MESH_PAGE=src/infrastructure/HeltecV3MeshPages.cpp
          POWER=src/infrastructure/HeltecV3PowerMonitor.cpp
          POWER_H=src/infrastructure/HeltecV3PowerMonitor.h

          grep -q 'V3_POSITION_FRESH_SECS 180UL' "$POLICY"
          grep -q 'V3_POSITION_IGNORE_METERS 25U' "$POLICY"
          grep -q 'V3_POSITION_AUTO_METERS 50U' "$POLICY"
          grep -q 'V3_POSITION_CONFIRM_COUNT 3U' "$POLICY"
          grep -q 'V3_POSITION_CONFIRM_WINDOW_MS (15UL \* 1000UL)' "$POLICY"
          grep -Fq '#define V3_SERVICE_TAIL_MS (20UL * 1000UL)' "$POLICY"
          grep -q 'service latched while connected' "$POLICY"
          grep -q '20s tail started' "$POLICY"
          grep -q '!queueHeld && tailExpired' "$POLICY"
          grep -q 'v3BleConnected() ||' "$POLICY" || grep -q 'bleConnected || buttonHeld' "$POLICY"
          grep -q 'getMeaningfulTrafficCount' "$NIMBLE_H"
          grep -q 'meaningfulBleTrafficCount' "$NIMBLE_CPP"
          grep -q 'clearJarnsenDiagLog' "$NIMBLE_CPP"
          grep -q 'memcmp(data, "CLEARLOG", 8)' "$NIMBLE_CPP"
          if grep -q 'hardCapReached' "$POLICY"; then
            echo 'V3 BLE service still has a hard lifetime cap' >&2
            exit 1
          fi

          grep -q 'HeltecV3PositionPage.h' "$PHONE"
          grep -q 'heltecV3CapturePhonePosition' "$PHONE"
          grep -q 'phone GPS captured pre-router' "$POLICY"
          grep -q 'position.gps_accuracy == 0 ||' "$POLICY"
          grep -q 'position.gps_accuracy == 0 ||' "$MANAGER"
          grep -q 'new V3PhonePositionWorker(this)' "$MANAGER"
          grep -q 'PHONE_POS_MODE' "$MANAGER"
          grep -q 'PHONE_POS_LIVE' "$MANAGER"
          grep -q 'PHONE_POS_FIXED' "$MANAGER"
          grep -q 'sessionBaselineValid' "$MANAGER"
          if grep -q '^static V3PhonePositionWorker ' "$MANAGER"; then
            echo 'V3 phone worker must not be statically constructed' >&2
            exit 1
          fi
          grep -q '%02d%c %c%c %04d %04d' "$PAGE"

          grep -q 'drawCommonHeader(display, x, y, "Position")' "$PAGE"
          grep -q 'drawCommonFooter(display, x, y)' "$PAGE"
          grep -q 'UIRenderer::drawNavigationBar(display, uiState)' "$PAGE"
          grep -q '"Service %s", JARNSEN_V3_FIRMWARE_SEMVER' "$SERVICE"
          grep -q '"Repeater %s", JARNSEN_V3_FIRMWARE_SEMVER' "$SERVICE"
          grep -q 'drawCommonFooter(display, x, y)' "$SERVICE"
          grep -q 'UIRenderer::drawNavigationBar(display, state)' "$SERVICE"
          grep -q 'drawCommonHeader(display, x, y, "Mesh Health")' "$MESH_PAGE"
          grep -q 'drawCommonHeader(display, x, y, "Antenna Test")' "$MESH_PAGE"
          grep -q 'UIRenderer::drawNavigationBar(display, state)' "$MESH_PAGE"

          grep -q 'POSITION SAVED' "$PAGE"
          grep -q 'POSITION CHECK' "$PAGE"
          grep -q 'POSITION OK' "$PAGE"
          grep -q 'HOLD:SAVE' "$PAGE"
          grep -Fq '#define V3_SERVICE_DISPLAY_MS (20UL * 1000UL)' "$POLICY"
          grep -q 'v3DisplayStartedMs = now;' "$POLICY"
          if grep -q 'SHORT:NEXT LONG:SAVE' "$PAGE"; then
            echo 'V3 position page still has permanent legacy navigation help' >&2
            exit 1
          fi

          grep -q 'V3 local observability pages come first' "$SCREEN"
          grep -q 'heltecV3PositionPageDrawFrame' "$SCREEN"
          grep -q 'heltecV3ServicePageDrawFrame' "$SCREEN"
          grep -q 'heltecV3MeshHealthPageDrawFrame' "$SCREEN"
          grep -q 'heltecV3AntennaPageDrawFrame' "$SCREEN"

          grep -q 'notificationTypeEnum::selection_picker' "$SERVICE"
          for option in '"Back"' '"Mesh Health"' '"Antenna Test"' '"Power Statistics"' '"Diagnostic Log"'; do
            grep -q "$option" "$SERVICE"
          done
          grep -q 'V3ServiceMenu::POWER_STATS' "$SERVICE"
          grep -q 'showOptions("Power Statistics"' "$SERVICE"
          grep -q '"Export via USB"' "$SERVICE"
          grep -q '"Clear Log"' "$SERVICE"
          grep -q '"CLEAR LOG"' "$SERVICE"
          grep -q 'HOLD: EXPORT NOW' "$SERVICE"
          grep -q 'Export Diagnostic Log?' "$SERVICE"
          grep -q 'const bool serviceUiActive = heltecV3ServiceMenuActive();' "$POLICY"
          grep -q 'INPUT_BROKER_USER_PRESS' "$SERVICE"
          grep -q 'INPUT_BROKER_SELECT' "$SERVICE"
          grep -q 'heltecV3ServiceMenuOpen' "$SERVICE_H"
          grep -q 'heltecV3ServiceMenuNext' "$SERVICE_H"
          grep -q 'heltecV3ServiceMenuSelect' "$SERVICE_H"
          grep -q 'heltecV3ServiceMenuPump' "$SERVICE_H"
          grep -q 'heltecV3ServiceMenuPump();' "$POLICY"
          grep -q 'heltecV3ServiceMenuOpen();' "$POLICY"
          grep -q 'heltecV3ServiceMenuSelect();' "$POLICY"
          grep -q 'heltecV3ServiceMenuNext();' "$POLICY"
          grep -q 'HOLD:MENU' "$SERVICE"

          grep -q '#include "configuration.h"' "$POWER_H"
          grep -q 'heltecV3PowerMonitorInit();' "$POLICY"
          grep -q 'heltecV3PowerMonitorTick(' "$POLICY"
          grep -q '!v3ServiceActive, v3ServiceActive' "$POLICY"
          grep -q 'heltecV3PowerMonitorNotePositionTx();' "$POLICY"
          grep -q 'Source: %s' "$SERVICE"
          grep -q 'INA226: prepared / disabled' "$SERVICE"
          grep -q 'source=internal ina226=prepared-not-enabled' "$POWER"
          grep -q 'LEARNING_MIN_SECS = 60UL \* 60UL' "$POWER"
          grep -q 'PERSIST_INTERVAL_SECS = 6UL \* 60UL \* 60UL' "$POWER"
          grep -q 'BATTERY_LOG_INTERVAL_MS = 15UL \* 60UL \* 1000UL' "$POWER"
          grep -q 'out.currentValid = false' "$POWER"
          grep -q 'out.energyValid = false' "$POWER"
          grep -q 'heltecV3PowerMonitorPersist();' "$SERVICE"

          grep -q 'stopAdvertisingForService' "$NIMBLE_H"
          grep -q 'serviceAdvertisingSuppressed' "$NIMBLE_CPP"
          grep -q 'resume BLE advertising' "$POLICY"
          grep -q 'v3RequireButtonRelease' "$POLICY"
          grep -q 'GPIO0 released; next press armed' "$POLICY"
          grep -q 'isAdvertisingActive' "$NIMBLE_H"
          grep -q 'ble_gap_adv_active' "$NIMBLE_CPP"
          grep -q 'pre-initialize NimBLE once before first light sleep' "$POLICY"
          grep -q 'GAP advertising inactive; restarting' "$POLICY"
          grep -q 'without BLE reinit' "$POLICY"
          grep -q 'heldMs >= 40UL' "$POLICY"
          grep -q '120UL' "$POLICY"
          grep -q 'heltecV3OwnsButtonPin' "$BUTTON"
          grep -q 'if (heltecV3OwnsButtonPin(_pinNum))' "$BUTTON"
          grep -q 'heltecV3PowerMonitorIdleWakeMs()' "$POLICY"
          grep -q 'return INA226_SAMPLE_INTERVAL_MS' "$POWER"
          grep -q 'INA226_RETRY_INTERVAL_MS - elapsed' "$POWER"
          grep -q 'CAPACITY_MIN_DROP_PERCENT = 30' "$POWER"
          grep -q 'updateCapacityLearning();' "$POWER"
          grep -q 'remainingCapacityMah' "$POWER"
          grep -q 'Charge left: %u mAh' "$SERVICE"
          grep -q 'C:%u.%uAh' "$SERVICE"
          if grep -q 'V3_SERVICE_IDLE_POLL_MS' "$POLICY"; then
            echo 'V3 service task still polls while idle' >&2
            exit 1
          fi

          grep -q 'MAX_LOG_BYTES = 64U \* 1024U' "$DIAG"
          grep -q 'heltecV3DiagInit();' "$POLICY"
          grep -q 'heltecV3DiagNoteBleRecovery();' "$POLICY"
          grep -q 'heltecV3DiagRequestUsbExport();' "$SERVICE"
          grep -q 'v3NativeSerialConnected()' "$POLICY"
          grep -q 'v3ServiceActive || v3NativeSerialConnected()' "$POLICY"
          grep -q 'heltecV3MeshMonitorTick();' "$POLICY"
          grep -q 'heltecV3MeshMonitorOnRadioPacket(\*mp);' "$RADIO"
          grep -q 'packet.hop_start > 0 &&' "$MESH"
          grep -q 'packet.hop_limit == packet.hop_start' "$MESH"
          grep -q 'ANT_MIN_SAMPLES = 40' "$MESH"
          grep -q 'A_RUNNING' "$MESH"
          grep -q 'B_RUNNING' "$MESH"
          grep -q 'power off before antenna swap' "$MESH"
          grep -q 'POWER OFF' "$MESH_PAGE"
          grep -q 'CHANGE ANT' "$MESH_PAGE"
          grep -q 'Delta:%+ddB' "$MESH_PAGE"
          grep -q 'heltecV3MeshMonitorPrintSnapshot(Serial);' "$DIAG"

          grep -q 'meshtastic_Config_DeviceConfig_Role_ROUTER_LATE' "$POLICY"
          grep -q 'meshtastic_Config_DeviceConfig_Role_REPEATER' "$POLICY"
          if grep -q 'meshtastic_Config_DeviceConfig_Role_TAK_TRACKER' "$POLICY"; then
            echo 'Tracker TAK_TRACKER behavior leaked into V3 policy' >&2
            exit 1
          fi
          if grep -q 'Heltec V3 service: deinit BLE outside service window' "$POLICY"; then
            echo 'V3 still deinitializes NimBLE between service windows' >&2
            exit 1
          fi
          if grep -q 'V3_SERVICE_PACKET_LIMIT' "$POLICY"; then
            echo 'Old V3 packet-limit policy is still present' >&2
            exit 1
          fi
          if grep -q 'BLE packet budget reached' "$POLICY"; then
            echo 'Old BLE packet-budget shutdown is still present' >&2
            exit 1
          fi
      - name: Verify V3 downloader package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V3_DIAG_LOG_DOWNLOADER.py' tools/V3_Diagnostic_Log_Download.bat
          grep -q 'ser.open()' tools/V3_DIAG_LOG_DOWNLOADER.py
          if grep -q 'ERST DANACH hier Enter' tools/V3_DIAG_LOG_DOWNLOADER.py; then
            echo 'V3 downloader still requires a second PC Enter step' >&2
            exit 1
          fi
      - name: Stamp V3 firmware version and build
        shell: bash
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${BUILD_SHA:0:8}"
          printf '#pragma once\n#define JARNSEN_V3_FIRMWARE_SEMVER "v%s"\n#define JARNSEN_V3_FIRMWARE_VERSION "%s v%s"\n#define JARNSEN_V3_BUILD_SHA "%s"\n#define JARNSEN_V3_BUILD_NUMBER %s\n' \
            "$V3_VERSION" "$V3_PRODUCT" "$V3_VERSION" "$SHORT_SHA" "$GITHUB_RUN_NUMBER" > src/infrastructure/HeltecV3BuildGenerated.h
      - name: Build Heltec V3 repeater
        shell: bash
        run: |
          set -o pipefail
          pio run -e heltec-v3 2>&1 | tee v3-build.log
      - name: Extract compiler errors
        if: always()
        shell: bash
        run: |
          if [ -f v3-build.log ]; then
            {
              echo '=== Compiler error matches ==='
              grep -n -E '(^|[[:space:]])(error:|fatal error:)|undefined reference|collect2: error|FAILED:' v3-build.log || true
              echo
              echo '=== Last 300 build lines ==='
              tail -n 300 v3-build.log
            } > v3-compiler-errors.txt
          else
            echo 'v3-build.log was not created' > v3-compiler-errors.txt
          fi
      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-v${{ env.V3_VERSION }}-compiler-errors-build-${{ github.run_number }}
          path: v3-compiler-errors.txt
      - name: Collect versioned firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          PREFIX="heltec-v3-repeater-jarn-mesh-v${V3_VERSION}"
          curl --fail --location --retry 3 \
            --output artifact/otaBTupdate.bin \
            https://github.com/meshtastic/esp32-unified-ota/releases/download/v1.0.1/mt-esp32s3-ota.bin
          echo '3e62c5451afda604bac372444f058fc689dd588a87772ad4be90c228e04c1995  artifact/otaBTupdate.bin' | sha256sum --check
          BUILD_DIR=.pio/build/heltec-v3
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.factory.bin' -print -quit)
          ELF=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.elf' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"
          test -n "$ELF"
          test -f tools/V3_DIAG_LOG_DOWNLOADER.py
          test -f tools/V3_Diagnostic_Log_Download.bat
          test -f tools/otaBTupdate-installieren.bat
          test -f tools/README-DIAGNOSTIC-LOG.txt
          test -f artifact/INA226-ANSCHLUSSPLAN-V3.md
          cp "$FACTORY_BIN" "artifact/${PREFIX}.factory.bin"
          cp "$APP_BIN" "artifact/${PREFIX}.update.bin"
          cp "$ELF" "artifact/${PREFIX}.elf"
          cp tools/V3_DIAG_LOG_DOWNLOADER.py artifact/
          cp tools/V3_Diagnostic_Log_Download.bat artifact/
          cp tools/otaBTupdate-installieren.bat artifact/
          cp tools/README-DIAGNOSTIC-LOG.txt artifact/
          FIRMWARE_SHA=$(sha256sum "artifact/${PREFIX}.update.bin" | cut -d' ' -f1)
          FIRMWARE_SIZE=$(stat -c '%s' "artifact/${PREFIX}.update.bin")
          cat > "artifact/${PREFIX}.ota.json" <<EOF
          {
            "schema": 1,
            "device": "HELTEC_V3_REPEATER",
            "product": "${V3_PRODUCT}",
            "version": "${V3_VERSION}",
            "display_version": "${V3_PRODUCT} v${V3_VERSION}",
            "workflow_run_number": ${GITHUB_RUN_NUMBER},
            "source_sha": "${GITHUB_SHA}",
            "firmware_asset": "${PREFIX}.update.bin",
            "firmware_size": ${FIRMWARE_SIZE},
            "firmware_sha256": "${FIRMWARE_SHA}",
            "ota_loader_asset": "otaBTupdate.bin",
            "ota_loader_sha256": "3e62c5451afda604bac372444f058fc689dd588a87772ad4be90c228e04c1995",
            "ota_partition_offset": "0x340000"
          }
          EOF
      - name: Upload versioned firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-firmware-v${{ env.V3_VERSION }}-part
          path: artifact/
          if-no-files-found: error
          retention-days: 1

  package-complete-artifact:
    needs: [build-windows-service-tool, build-heltec-v3-repeater]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware and app
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: v3-*-part
          path: complete
          merge-multiple: true
      - name: Verify complete versioned package
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="heltec-v3-repeater-jarn-mesh-v${V3_VERSION}"
          test -f complete/Jarnsen-Node-Service-Tool.exe
          test -f complete/jarnsen-node-service-tool.json
          test -f "complete/${PREFIX}.factory.bin"
          test -f "complete/${PREFIX}.update.bin"
          test -f "complete/${PREFIX}.ota.json"
          test -f complete/otaBTupdate.bin
          test -f complete/otaBTupdate-installieren.bat
          test -f complete/V3_Diagnostic_Log_Download.bat
          test -f complete/INA226-ANSCHLUSSPLAN-V3.md
      - name: Upload complete V3 package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heltec-v3-repeater-jarn-mesh-v${{ env.V3_VERSION }}-build-${{ github.run_number }}
          path: complete/
          if-no-files-found: error
      - name: Publish current V3 Bluetooth update
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="heltec-v3-repeater-jarn-mesh-v${V3_VERSION}"
          TAG=jarnsen-v3-latest
          cp "complete/${PREFIX}.ota.json" complete/heltec-v3-repeater-light-sleep.ota.json
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Heltec V3 Repeater - ${V3_PRODUCT} v${V3_VERSION}" \
              --notes "Automatisch geprüftes V3-Repeater-Update ${V3_PRODUCT} v${V3_VERSION}, Build ${GITHUB_RUN_NUMBER}."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Heltec V3 Repeater - ${V3_PRODUCT} v${V3_VERSION}" \
              --notes "Automatisch geprüftes V3-Repeater-Update ${V3_PRODUCT} v${V3_VERSION}, Build ${GITHUB_RUN_NUMBER}."
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "complete/${PREFIX}.update.bin" \
            "complete/${PREFIX}.ota.json" \
            complete/heltec-v3-repeater-light-sleep.ota.json \
            complete/otaBTupdate.bin \
            complete/otaBTupdate-installieren.bat
