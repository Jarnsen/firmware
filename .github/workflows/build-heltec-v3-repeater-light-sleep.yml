name: Build Heltec V3 Repeater Light Sleep

on:
  push:
    branches:
      - heltec-v3-repeater-light-sleep
  pull_request:
    branches:
      - develop
    paths:
      - src/infrastructure/**
      - src/graphics/Screen.cpp
      - src/input/ButtonThread.cpp
      - src/mesh/PhoneAPI.cpp
      - src/nimble/NimbleBluetooth.*
      - scripts/apply_v3_phone_gps_ble_idle_fix.py
      - scripts/apply_v3_native_position_page.py
      - scripts/apply_v3_ble_resume_page_order_fix.py
      - scripts/apply_v3_ble_visibility_button_guard_fix.py
      - scripts/apply_v3_exclusive_userbutton_fix.py
      - scripts/apply_v3_pretty_menu_timeout_fix.py
      - variants/esp32s3/heltec_v3/**
      - docs/heltec-v3-repeater-light-sleep.md
      - .github/workflows/build-heltec-v3-repeater-light-sleep.yml

concurrency:
  group: heltec-v3-repeater-light-sleep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-heltec-v3-repeater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          cache: pip
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Apply V3 phone GPS and BLE service policy
        run: python scripts/apply_v3_phone_gps_ble_idle_fix.py
      - name: Apply V3 native MGRS position page
        run: python scripts/apply_v3_native_position_page.py
      - name: Apply V3 BLE resume and first-page fixes
        run: python scripts/apply_v3_ble_resume_page_order_fix.py
      - name: Apply V3 BLE visibility and button guard
        run: python scripts/apply_v3_ble_visibility_button_guard_fix.py
      - name: Apply V3 exclusive GPIO0 ownership
        run: python scripts/apply_v3_exclusive_userbutton_fix.py
      - name: Apply V3 polished menu and display inactivity timeout
        run: python scripts/apply_v3_pretty_menu_timeout_fix.py
      - name: Verify V3 runtime policy
        shell: bash
        run: |
          set -euo pipefail
          POLICY=src/infrastructure/HeltecV3RepeaterPolicy.cpp
          PAGE=src/infrastructure/HeltecV3PositionPage.cpp
          PHONE=src/mesh/PhoneAPI.cpp
          SCREEN=src/graphics/Screen.cpp
          BUTTON=src/input/ButtonThread.cpp
          NIMBLE_H=src/nimble/NimbleBluetooth.h
          NIMBLE_CPP=src/nimble/NimbleBluetooth.cpp

          grep -q 'V3_POSITION_FRESH_SECS 180UL' "$POLICY"
          grep -q 'V3_POSITION_IGNORE_METERS 25U' "$POLICY"
          grep -q 'V3_POSITION_AUTO_METERS 50U' "$POLICY"
          grep -q 'V3_POSITION_CONFIRM_COUNT 3U' "$POLICY"
          grep -q 'V3_POSITION_CONFIRM_WINDOW_MS (15UL \* 1000UL)' "$POLICY"
          grep -q 'V3_SERVICE_ACTIVITY_THRESHOLD 3U' "$POLICY"
          grep -q 'V3_SERVICE_ACTIVITY_WINDOW_MS (10UL \* 1000UL)' "$POLICY"
          grep -q 'V3_SERVICE_CONNECT_GRACE_MS (60UL \* 1000UL)' "$POLICY"
          grep -q 'active BLE burst detected' "$POLICY"
          grep -q 'getMeaningfulTrafficCount' "$POLICY"
          grep -q 'getMeaningfulTrafficCount' "$NIMBLE_H"
          grep -q 'meaningfulBleTrafficCount' "$NIMBLE_CPP"
          grep -q 'Count only non-empty payload reads' "$NIMBLE_CPP"

          # Native position page: raw phone capture before Router, normal frame
          # navigation, MGRS-only presentation and 25/50 m save logic.
          grep -q 'HeltecV3PositionPage.h' "$PHONE"
          grep -q 'heltecV3CapturePhonePosition' "$PHONE"
          grep -q 'phone GPS captured pre-router' "$POLICY"
          grep -q 'heltecV3PositionPageRequestFocus' "$POLICY"
          grep -q 'screen->showNextFrame()' "$POLICY"
          grep -q 'Native MeshModule frames are owned/redrawn by Screen itself' "$POLICY"
          grep -q '%02d%c %c%c %04d %04d' "$PAGE"

          # Native-style first page: large primary MGRS view in normal operation,
          # conditional OLD/NEW comparison only when >25 m, brief save feedback,
          # and no permanently printed navigation instructions.
          grep -Fq '#define V3_SERVICE_DISPLAY_MS (20UL * 1000UL)' "$POLICY"
          grep -q 'POSITION SAVED' "$PAGE"
          grep -q 'POSITION CHECK' "$PAGE"
          grep -q 'AUTO POSITION' "$PAGE"
          grep -q 'POSITION OK' "$PAGE"
          grep -q 'FONT_LARGE' "$PAGE"
          grep -q '20 s of display inactivity are counted from the last accepted' "$POLICY"
          grep -q 'v3DisplayStartedMs = now;' "$POLICY"
          if grep -q 'SHORT:NEXT LONG:SAVE' "$PAGE"; then
            echo 'V3 position page still has permanent navigation help' >&2
            exit 1
          fi

          # Never destroy/recreate NimBLE between GPIO0 windows; MGRS first.
          grep -q 'stopAdvertisingForService' "$NIMBLE_H"
          grep -q 'serviceAdvertisingSuppressed' "$NIMBLE_CPP"
          grep -q 'resume BLE advertising' "$POLICY"
          grep -q 'v3RequireButtonRelease' "$POLICY"
          grep -q 'GPIO0 released; next press armed' "$POLICY"
          grep -q 'bool wantUIFrame() override { return false; }' "$PAGE"
          grep -q 'heltecV3PositionPageDrawFrame' "$SCREEN"
          grep -q 'MGRS/service position page is deliberately the first' "$SCREEN"

          # First-wake BLE reliability and our custom button debounce.
          grep -q 'isAdvertisingActive' "$NIMBLE_H"
          grep -q 'ble_gap_adv_active' "$NIMBLE_CPP"
          grep -q 'idle PhoneAPI kept initialized' "$NIMBLE_CPP"
          grep -q 'pre-initialize NimBLE once before first light sleep' "$POLICY"
          grep -q 'GAP advertising inactive; restarting without BLE reinit' "$POLICY"
          grep -q 'heldMs >= 40UL' "$POLICY"
          grep -q '120UL' "$POLICY"
          grep -q 'one tap -> one next frame' "$POLICY"

          # GPIO0 must have exactly one runtime owner. The stock Meshtastic
          # ButtonThread may still exist, but it must neither tick the button nor
          # attach its CHANGE ISR for V3 repeater roles.
          grep -q 'heltecV3OwnsButtonPin' "$BUTTON"
          grep -q 'Do not let OneButton::tick() generate a' "$BUTTON"
          grep -q 'if (heltecV3OwnsButtonPin(_pinNum))' "$BUTTON"
          grep -q 'reattach the generic CHANGE ISR' "$BUTTON"

          if grep -q 'Heltec V3 service: deinit BLE outside service window' "$POLICY"; then
            echo 'V3 still deinitializes NimBLE between service windows' >&2
            exit 1
          fi
          if grep -q 'V3_SERVICE_PACKET_LIMIT' "$POLICY"; then
            echo 'Old V3 packet-limit policy is still present' >&2
            exit 1
          fi
          if grep -q 'BLE packet budget reached' "$POLICY"; then
            echo 'Old BLE packet-budget shutdown is still present' >&2
            exit 1
          fi
      - name: Build Heltec V3 repeater
        run: pio run -e heltec-v3
      - name: Collect firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          BUILD_DIR=.pio/build/heltec-v3
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.factory.bin' -print -quit)
          ELF=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-heltec-v3-*.elf' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"
          test -n "$ELF"
          cp "$FACTORY_BIN" artifact/heltec-v3-repeater-light-sleep.factory.bin
          cp "$APP_BIN" artifact/heltec-v3-repeater-light-sleep.update.bin
          cp "$ELF" artifact/heltec-v3-repeater-light-sleep.elf
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: heltec-v3-repeater-light-sleep
          path: artifact/
