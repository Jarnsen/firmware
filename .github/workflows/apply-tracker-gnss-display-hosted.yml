name: Apply Tracker GNSS and Display Timing Hosted

on:
  push:
    branches:
      - automation/tracker-gnss-display-finalize
    paths:
      - .github/workflows/apply-tracker-gnss-display-hosted.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute guarded transform embedded in staging workflow
        shell: bash
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-tracker-gnss-display-finalize.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          source = textwrap.dedent(workflow[start:end])
          exec(compile(source, 'tracker-gnss-display-transform.py', 'exec'))
          PYEXTRACT
          git diff --check
          git diff --stat

      - name: Commit transformed source
        shell: bash
        run: |
          git config user.name "JARNSEN Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/vehicle/TrackerCommonPolicy.cpp src/vehicle/TrackerEnhancements.cpp
          git diff --cached --check
          git commit -m "tracker: finalize GNSS and display timing"
          git push origin HEAD:automation/tracker-gnss-display-finalize
