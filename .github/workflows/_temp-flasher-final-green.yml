name: Temporary Flasher final green

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - .github/workflows/_temp-flasher-final-green.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install repository-pinned Trunk
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3

      - name: Apply final HIL and Windows gate patch
        shell: bash
        run: |
          set -euo pipefail
          python tools/jarnsen_mesh_flasher/_final_green_fix.py

      - name: Format exactly the remaining files
        shell: bash
        run: |
          set -euo pipefail
          "$TRUNK_PATH" fmt \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            tools/jarnsen_mesh_flasher/tests/supreme_full_hil.py \
            tools/jarnsen_mesh_flasher/tests/supreme_feature_matrix_hil.py \
            tools/jarnsen_mesh_flasher/tests/test_elapsed_progress_contract.py \
            ci-format/jarnsen-mesh-flasher-windows.yml
          "$TRUNK_PATH" check \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            tools/jarnsen_mesh_flasher/tests/supreme_full_hil.py \
            tools/jarnsen_mesh_flasher/tests/supreme_feature_matrix_hil.py \
            tools/jarnsen_mesh_flasher/tests/test_elapsed_progress_contract.py \
            ci-format/jarnsen-mesh-flasher-windows.yml

      - name: Compile and run critical source regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -r tools/jarnsen_mesh_flasher/requirements.txt
          python -m compileall -q \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            tools/jarnsen_mesh_flasher/tests/hardware_flash_contract.py \
            tools/jarnsen_mesh_flasher/tests/supreme_full_hil.py \
            tools/jarnsen_mesh_flasher/tests/supreme_feature_matrix_hil.py
          python tools/jarnsen_mesh_flasher/tests/test_elapsed_progress_contract.py
          python tools/jarnsen_mesh_flasher/tests/test_postflash_hardening.py
          python tools/jarnsen_mesh_flasher/tests/test_write_choice_unknown_current.py
          python tools/jarnsen_mesh_flasher/tests/test_hardware_identity_hardening.py
          python tools/jarnsen_mesh_flasher/tests/test_destructive_hil_prebind.py

      - name: Commit verified source changes and formatted workflow mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/jarnsen_mesh_flasher/_final_green_fix.py
          git add \
            tools/jarnsen_mesh_flasher/_final_green_fix.py \
            tools/jarnsen_mesh_flasher/app.py \
            tools/jarnsen_mesh_flasher/reference_dashboard.py \
            tools/jarnsen_mesh_flasher/tests/supreme_full_hil.py \
            tools/jarnsen_mesh_flasher/tests/supreme_feature_matrix_hil.py \
            tools/jarnsen_mesh_flasher/tests/test_elapsed_progress_contract.py \
            ci-format/jarnsen-mesh-flasher-windows.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix(flasher): finalize HIL reconnect and formatting'
          git push origin HEAD:feat/mini-serial-flasher
