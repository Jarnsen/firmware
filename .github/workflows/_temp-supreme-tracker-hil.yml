name: TEMP Supreme + Tracker + V3 HIL
run-name: "TEMP Supreme+Tracker+V3 REAL HIL · ${{ github.run_number }}"

on:
  push:
    branches:
      - feat/mini-serial-flasher
    paths:
      - ".github/workflows/_temp-supreme-tracker-hil.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: jarnsen-mesh-flasher-temp-hil
  cancel-in-progress: true

jobs:
  supreme-tracker-v3-hil:
    name: REAL HIL · Supreme COM25 + Tracker COM9 + V3 COM13
    runs-on: [self-hosted, Windows, X64, jarn-pc]
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      JARNSEN_FLASHER_HW_PORTS: "tbeam_supreme=COM25,tracker=COM9,repeater=COM13"
      JARNSEN_FLASHER_HW_FLASH: "1"
      JARNSEN_FLASHER_HW_FLASH_CONFIRM: "I_ACCEPT_FIRMWARE_FLASH"
      JARNSEN_IDENTIFIED_HIL_PORTS: "tracker=COM9,repeater=COM13"
      JARNSEN_IDENTIFIED_HIL_CONFIRM: "I_ACCEPT_IDENTIFIED_HARDWARE_FLASH"
      JARNSEN_DESTRUCTIVE_HIL_PORTS: "tbeam_supreme=COM25,tracker=COM9,repeater=COM13"
      JARNSEN_DESTRUCTIVE_HIL_SERIALS: "tbeam_supreme=48:CA:43:5C:2F:EC,tracker=F0:9E:9E:76:07:10,repeater=0001"
      JARNSEN_DESTRUCTIVE_HIL_CONFIRM: "I_ACCEPT_DESTRUCTIVE_MULTI_BOARD_FLASH"
      GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Prepare Python
        shell: powershell
        run: |
          $hostPy = "$env:LOCALAPPDATA\Programs\Python\Python310\python.exe"
          if (!(Test-Path $hostPy)) { throw "Python 3.10 runner installation missing: $hostPy" }
          if (Test-Path ".venv-hil") { Remove-Item ".venv-hil" -Recurse -Force }
          & $hostPy -m venv .venv-hil
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = ".\.venv-hil\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py -m pip install -r tools\jarnsen_mesh_flasher\requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Service, identity and post-flash regression
        shell: powershell
        run: |
          $py = ".\.venv-hil\Scripts\python.exe"
          & $py tools\jarnsen_mesh_flasher\tests\test_build289_regressions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools\jarnsen_mesh_flasher\tests\test_hardware_identity_hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $py tools\jarnsen_mesh_flasher\tests\test_postflash_hardening.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: REAL destructive full-cycle Tracker + V3 + Supreme HIL
        shell: powershell
        run: |
          $py = ".\.venv-hil\Scripts\python.exe"
          & $py tools\jarnsen_mesh_flasher\tests\destructive_multi_board_hil.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: REAL reversible Tracker + V3 HIL
        shell: powershell
        run: |
          $py = ".\.venv-hil\Scripts\python.exe"
          & $py tools\jarnsen_mesh_flasher\tests\identified_multi_board_hil.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: REAL Supreme + Tracker + V3 hardware contract
        shell: powershell
        run: |
          $py = ".\.venv-hil\Scripts\python.exe"
          & $py tools\jarnsen_mesh_flasher\tests\hardware_flash_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload HIL evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TEMP-SUPREME-TRACKER-V3-HIL-${{ github.run_number }}
          path: |
            ci-logs/**
          if-no-files-found: warn
          retention-days: 7

# rerun-marker: postflash-readiness-recovery-18b6d4ca
