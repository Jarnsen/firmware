name: Temporary fluid mirror optimization runner

on:
  push:
    branches:
      - feature/tactical-usb-display-mirror
    paths:
      - .github/workflows/temporary-mirror-fluid-input-pr.yml
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/temporary-mirror-fluid-input-pr.yml

permissions:
  contents: write

concurrency:
  group: temporary-fluid-mirror-optimization
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feature/tactical-usb-display-mirror
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply responsive mirror patch
        run: python tools/tactical-display-mirror/apply_fluid_mirror_patch.py

      - name: Format and validate
        run: |
          python -m pip install black==26.5.1 clang-format==16.0.3
          black tools/tactical-display-mirror/tactical_display_mirror.py
          clang-format -i src/graphics/TacticalDisplayMirror.cpp src/graphics/TacticalDisplayMirrorThread.cpp
          python -m py_compile tools/tactical-display-mirror/tactical_display_mirror.py

      - name: Commit final optimization
        shell: bash
        run: |
          rm -f .github/workflows/temporary-mirror-fluid-input.yml
          rm -f .github/workflows/temporary-mirror-fluid-input-pr.yml
          rm -f tools/tactical-display-mirror/apply_fluid_mirror_patch.py
          git config user.name "Jarnsen Tactical Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf: make mirror controls more responsive"
          git push origin HEAD:feature/tactical-usb-display-mirror
