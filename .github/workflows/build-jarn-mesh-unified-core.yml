name: Build JARN-MESH Unified Core
run-name: "Unified Core compile gate · ${{ github.sha }}"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - 'src/jarnsen/**'
      - 'src/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'tools/refactor_jarnsen_service_web_to_core.py'
      - '.github/workflows/build-jarn-mesh-unified-core.yml'
      - 'docs/jarn-mesh-unified-architecture.md'
  workflow_dispatch:

concurrency:
  group: jarn-mesh-unified-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Heltec Tracker V1.1
            environment: heltec-wireless-tracker
            test_artifact: true
            artifact_slug: tracker-v11
            device_id: HELTEC_TRACKER_V1.1
          - name: Heltec V3
            environment: heltec-v3
            test_artifact: true
            artifact_slug: heltec-v3
            device_id: HELTEC_V3
          - name: Heltec V4
            environment: heltec-v4
            test_artifact: false
          - name: Seeed Wio Tracker L1
            environment: seeed_wio_tracker_L1
            test_artifact: false
          - name: LILYGO T-Beam
            environment: tbeam
            test_artifact: false
          - name: LILYGO T-Beam Supreme
            environment: tbeam-s3-core
            test_artifact: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Repair broken PlatformIO package metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path.home() / ".platformio" / "packages"
          removed = []
          if root.exists():
              for marker in root.glob("*/.piopm"):
                  try:
                      with marker.open("r", encoding="utf-8") as handle:
                          json.load(handle)
                  except Exception as exc:
                      package_dir = marker.parent
                      removed.append(f"{package_dir.name}: {exc}")
                      shutil.rmtree(package_dir, ignore_errors=True)

          if removed:
              print("Removed broken PlatformIO package cache entries:")
              for item in removed:
                  print(f"- {item}")
          else:
              print("PlatformIO package metadata cache is healthy")
          PY

      - name: Verify Unified Core architecture contracts exist
        shell: bash
        run: |
          set -euo pipefail
          test -f src/jarnsen/core/capabilities/JarnsenCapabilities.h
          test -f src/jarnsen/core/roles/JarnsenDeviceRole.h
          test -f src/jarnsen/core/features/JarnsenFeatureManager.h
          test -f src/jarnsen/core/status/JarnsenNodeStatus.h
          test -f src/jarnsen/core/status/JarnsenStatusProvider.h
          test -f src/jarnsen/core/service/JarnsenServiceModel.h
          test -f src/jarnsen/core/service/JarnsenServicePlatform.h
          test -f src/jarnsen/core/service/JarnsenServiceDiagnostics.h
          test -f src/jarnsen/hardware/JarnsenHardwareProfiles.h
          test -f src/jarnsen/core/JarnsenArchitecture.cpp
          grep -q 'struct BoardCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct PeripheralCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct EffectiveCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct DisplayCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct NodeStatusSnapshot' src/jarnsen/core/status/JarnsenNodeStatus.h
          grep -q 'struct NodeServiceDescriptor' src/jarnsen/core/service/JarnsenServiceModel.h
          grep -q 'DeviceRole::TAK' src/jarnsen/core/JarnsenArchitecture.cpp
          grep -q 'heltecV4Profile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'seeedWioTrackerL1Profile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'lilygoTBeamProfile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'lilygoTBeamSupremeProfile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'BOARD_LILYGO_TBEAM' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'BOARD_LILYGO_TBEAM_SUPREME' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'External GPS must not accidentally unlock Drone Repeater on V3' src/jarnsen/core/JarnsenArchitecture.cpp

      - name: Route ServiceWeb through Unified Core seams
        shell: bash
        run: |
          set -euo pipefail
          python tools/refactor_jarnsen_service_web_to_core.py
          grep -q 'JarnsenServiceDiagnostics.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'JarnsenServicePlatform.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'SERVICE_DESCRIPTOR = jarnsen::platformServiceDescriptor' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'jarnsen::serviceDiagStartExport' src/mesh/http/JarnsenServiceWeb.cpp
          ! grep -q 'HeltecV3DiagnosticLog.h' src/mesh/http/JarnsenServiceWeb.cpp
          ! grep -q 'TrackerDiagnosticLog.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q '<h2>Taktische Lage</h2>' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q "satellite:{name:'SATELLIT'" src/mesh/http/JarnsenServiceWeb.cpp
          grep -q "hybrid:{name:'HYBRID'" src/mesh/http/JarnsenServiceWeb.cpp

      - name: Generate CI-only build metadata
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          printf '#pragma once\n#define JARNSEN_FIRMWARE_SEMVER "v0.0.0-unified-ci"\n#define JARNSEN_FIRMWARE_VERSION "JARN-MESH Unified CI"\n#define JARNSEN_BUILD_SHA "%s"\n#define JARNSEN_BUILD_NUMBER %s\n' \
            "$SHORT_SHA" "$GITHUB_RUN_NUMBER" > src/vehicle/JarnsenBuildGenerated.h

      - name: Compile ${{ matrix.name }} from shared source tree
        shell: bash
        run: |
          set -o pipefail
          pio run -e "${{ matrix.environment }}" 2>&1 | tee unified-${{ matrix.environment }}.log

      - name: Collect flashable Unified Core test firmware
        if: matrix.test_artifact == true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${{ matrix.environment }}"
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.factory.bin' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"

          SHORT_SHA="${GITHUB_SHA:0:8}"
          PREFIX="JARN-MESH-2.0-TEST-${{ matrix.artifact_slug }}-${SHORT_SHA}"
          mkdir -p test-artifact
          cp "$FACTORY_BIN" "test-artifact/${PREFIX}.factory.bin"
          cp "$APP_BIN" "test-artifact/${PREFIX}.update.bin"

          cat > test-artifact/README-FLASH.txt <<EOF
          JARN-MESH 2.0 Unified Core TESTBUILD
          Board: ${{ matrix.name }}
          Device: ${{ matrix.device_id }}
          Source SHA: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_NUMBER}

          USB-Ersttest / kompletter Flash:
            ${PREFIX}.factory.bin

          Update-Image (nicht fuer den ersten Unified-Core-Hardwaretest empfohlen):
            ${PREFIX}.update.bin

          Dies ist ein Entwicklungs-/Integrationstest fuer Display, Captive Portal
          und die schrittweise Unified-Core-Migration. Vor dem Test die bisherige
          stabile Firmware zum Zurueckflashen bereithalten.
          EOF

          (
            cd test-artifact
            sha256sum "${PREFIX}.factory.bin" "${PREFIX}.update.bin" > SHA256SUMS.txt
          )

      - name: Upload flashable Unified Core test firmware
        if: matrix.test_artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARN-MESH-2.0-TEST-${{ matrix.artifact_slug }}-build-${{ github.run_number }}
          path: test-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Extract compiler diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '=== Compiler error matches ==='
            grep -n -E '(^|[[:space:]])(error:|fatal error:)|undefined reference|collect2: error|FAILED:' unified-${{ matrix.environment }}.log || true
            echo
            echo '=== Last 300 build lines ==='
            tail -n 300 unified-${{ matrix.environment }}.log || true
          } > unified-${{ matrix.environment }}-compiler-errors.txt

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unified-${{ matrix.environment }}-compiler-errors-${{ github.run_number }}
          path: unified-${{ matrix.environment }}-compiler-errors.txt
          if-no-files-found: error
          retention-days: 7
