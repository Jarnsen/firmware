name: Build JARNSEN-MESH Unified Core
run-name: "JARNSEN-MESH v2.0.0-alpha.1 · ${{ github.sha }}"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - 'src/jarnsen/**'
      - 'src/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'tools/refactor_jarnsen_service_web_to_core.py'
      - 'tools/refactor_jarnsen_boot_splash_to_core.py'
      - 'tools/refactor_jarnsen_tracker_page_indicator.py'
      - '.github/workflows/build-jarn-mesh-unified-core.yml'
      - 'docs/jarn-mesh-unified-architecture.md'
  workflow_dispatch:

concurrency:
  group: jarn-mesh-unified-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Heltec Tracker V1.1
            environment: heltec-wireless-tracker
            test_artifact: true
            artifact_label: Tracker-V1.1
            device_id: HELTEC_TRACKER_V1.1
            boot_hardware: TRACKER V1.1
          - name: Heltec V3
            environment: heltec-v3
            test_artifact: true
            artifact_label: Heltec-V3
            device_id: HELTEC_V3
            boot_hardware: HELTEC V3
          - name: Heltec V4
            environment: heltec-v4
            test_artifact: false
            boot_hardware: HELTEC V4
          - name: Seeed Wio Tracker L1
            environment: seeed_wio_tracker_L1
            test_artifact: false
            boot_hardware: WIO TRACKER L1
          - name: LILYGO T-Beam
            environment: tbeam
            test_artifact: false
            boot_hardware: T-BEAM
          - name: LILYGO T-Beam Supreme
            environment: tbeam-s3-core
            test_artifact: false
            boot_hardware: T-BEAM SUPREME

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Show runner identity
        shell: bash
        run: |
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Arch: ${RUNNER_ARCH}"

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Repair broken PlatformIO package metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path.home() / ".platformio" / "packages"
          removed = []
          if root.exists():
              for marker in root.glob("*/.piopm"):
                  try:
                      with marker.open("r", encoding="utf-8") as handle:
                          json.load(handle)
                  except Exception as exc:
                      package_dir = marker.parent
                      removed.append(f"{package_dir.name}: {exc}")
                      shutil.rmtree(package_dir, ignore_errors=True)

          if removed:
              print("Removed broken PlatformIO package cache entries:")
              for item in removed:
                  print(f"- {item}")
          else:
              print("PlatformIO package metadata cache is healthy")
          PY

      - name: Verify Unified Core architecture contracts exist
        shell: bash
        run: |
          set -euo pipefail
          test -f src/jarnsen/core/capabilities/JarnsenCapabilities.h
          test -f src/jarnsen/core/roles/JarnsenDeviceRole.h
          test -f src/jarnsen/core/features/JarnsenFeatureManager.h
          test -f src/jarnsen/core/status/JarnsenNodeStatus.h
          test -f src/jarnsen/core/status/JarnsenStatusProvider.h
          test -f src/jarnsen/core/service/JarnsenServiceModel.h
          test -f src/jarnsen/core/service/JarnsenServicePlatform.h
          test -f src/jarnsen/core/service/JarnsenServiceDiagnostics.h
          test -f src/jarnsen/core/build/JarnsenBuildInfo.h
          test -f src/jarnsen/core/display/JarnsenBootSplash.h
          test -f src/jarnsen/hardware/JarnsenHardwareProfiles.h
          test -f src/jarnsen/core/JarnsenArchitecture.cpp
          grep -q 'struct BoardCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct PeripheralCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct EffectiveCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct DisplayCapabilities' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'struct NodeStatusSnapshot' src/jarnsen/core/status/JarnsenNodeStatus.h
          grep -q 'struct NodeServiceDescriptor' src/jarnsen/core/service/JarnsenServiceModel.h
          grep -q 'JARNSEN-MESH' src/jarnsen/core/build/JarnsenBuildInfo.h
          grep -q 'v2.0.0-alpha.1' src/jarnsen/core/build/JarnsenBuildInfo.h
          grep -q 'drawBootSplash' src/jarnsen/core/display/JarnsenBootSplash.h
          grep -q 'DeviceRole::TAK' src/jarnsen/core/JarnsenArchitecture.cpp
          grep -q 'heltecV4Profile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'seeedWioTrackerL1Profile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'lilygoTBeamProfile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'lilygoTBeamSupremeProfile' src/jarnsen/hardware/JarnsenHardwareProfiles.h
          grep -q 'BOARD_LILYGO_TBEAM' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'BOARD_LILYGO_TBEAM_SUPREME' src/jarnsen/core/capabilities/JarnsenCapabilities.h
          grep -q 'External GPS must not accidentally unlock Drone Repeater on V3' src/jarnsen/core/JarnsenArchitecture.cpp

      - name: Route ServiceWeb through Unified Core seams
        shell: bash
        run: |
          set -euo pipefail
          python tools/refactor_jarnsen_service_web_to_core.py
          grep -q 'JarnsenServiceDiagnostics.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'JarnsenServicePlatform.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'SERVICE_DESCRIPTOR = jarnsen::platformServiceDescriptor' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q 'jarnsen::serviceDiagStartExport' src/mesh/http/JarnsenServiceWeb.cpp
          ! grep -q 'HeltecV3DiagnosticLog.h' src/mesh/http/JarnsenServiceWeb.cpp
          ! grep -q 'TrackerDiagnosticLog.h' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q '<h2>Taktische Lage</h2>' src/mesh/http/JarnsenServiceWeb.cpp
          grep -q "satellite:{name:'SATELLIT'" src/mesh/http/JarnsenServiceWeb.cpp
          grep -q "hybrid:{name:'HYBRID'" src/mesh/http/JarnsenServiceWeb.cpp

      - name: Route boot splash through Unified Core
        shell: bash
        run: |
          set -euo pipefail
          python tools/refactor_jarnsen_boot_splash_to_core.py
          grep -q 'JarnsenBootSplash.h' src/graphics/Screen.cpp
          grep -q 'jarnsen::drawBootSplash(display, x, y)' src/graphics/Screen.cpp

      - name: Add Tracker page position indicator
        shell: bash
        run: |
          set -euo pipefail
          python tools/refactor_jarnsen_tracker_page_indicator.py
          grep -q 'drawPagePosition(display, x, y, currentPage)' src/vehicle/TrackerStatusModule.cpp
          grep -q 'displayPageNumber(page)' src/vehicle/TrackerStatusModule.cpp
          grep -q 'displayPageCount()' src/vehicle/TrackerStatusModule.cpp

      - name: Generate JARNSEN-MESH build metadata
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          mkdir -p src/jarnsen/core/build
          cat > src/jarnsen/core/build/JarnsenBuildGenerated.h <<EOF
          #pragma once
          #define JARNSEN_FIRMWARE_PRODUCT "JARNSEN-MESH"
          #define JARNSEN_FIRMWARE_SEMVER "v2.0.0-alpha.1"
          #define JARNSEN_BOOT_HARDWARE "${{ matrix.boot_hardware }}"
          #define JARNSEN_BUILD_SHA "${SHORT_SHA}"
          #define JARNSEN_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          EOF

          cat > src/vehicle/JarnsenBuildGenerated.h <<EOF
          #pragma once
          #define JARNSEN_FIRMWARE_SEMVER "v2.0.0-alpha.1"
          #define JARNSEN_FIRMWARE_VERSION "JARNSEN-MESH v2.0.0-alpha.1"
          #define JARNSEN_BUILD_SHA "${SHORT_SHA}"
          #define JARNSEN_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          EOF

      - name: Compile ${{ matrix.name }} from shared source tree
        shell: bash
        run: |
          set -o pipefail
          pio run -e "${{ matrix.environment }}" 2>&1 | tee unified-${{ matrix.environment }}.log

      - name: Collect flashable JARNSEN-MESH alpha firmware
        if: matrix.test_artifact == true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${{ matrix.environment }}"
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.factory.bin' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"

          # Never publish a mislabeled or incomplete factory image. ESP32 images
          # must begin with the 0xE9 image magic, the merged factory must contain
          # a valid partition table at 0x8000 and must embed the exact application
          # image at app0/0x10000.
          python - "$APP_BIN" "$FACTORY_BIN" <<'PY'
          from pathlib import Path
          import sys

          app_path = Path(sys.argv[1])
          factory_path = Path(sys.argv[2])
          app = app_path.read_bytes()
          factory = factory_path.read_bytes()

          if not app or app[0] != 0xE9:
              raise SystemExit(f"Invalid update image header in {app_path}: expected 0xE9")
          if not factory or factory[0] != 0xE9:
              raise SystemExit(f"Invalid factory bootloader header in {factory_path}: expected 0xE9")
          if len(factory) <= 0x10000:
              raise SystemExit(f"Factory image too small to contain app0: {len(factory)} bytes")
          if factory[0x8000:0x8002] != b"\xaa\x50":
              raise SystemExit(
                  f"Factory partition-table magic invalid: {factory[0x8000:0x8002].hex()}"
              )
          if factory[0x10000] != 0xE9:
              raise SystemExit(
                  f"Factory app0 header invalid at 0x10000: 0x{factory[0x10000]:02x}"
              )
          embedded = factory[0x10000:0x10000 + len(app)]
          if embedded != app:
              raise SystemExit("Factory app0 payload does not exactly match update image")

          print(
              f"Validated flash images: app={len(app)} bytes, "
              f"factory={len(factory)} bytes, app0 payload identical"
          )
          PY

          VERSION="v2.0.0-alpha.1"
          PREFIX="JARNSEN-MESH-${VERSION}-${{ matrix.artifact_label }}"
          mkdir -p firmware-artifact
          cp "$FACTORY_BIN" "firmware-artifact/${PREFIX}.factory.bin"
          cp "$APP_BIN" "firmware-artifact/${PREFIX}.update.bin"

          # Meshtastic Web Flasher's local-file "Update" path always writes the
          # selected binary at 0x10000 (app0). A device that currently boots
          # ota_1/app1 at 0x340000 would therefore keep running the old image.
          # Build a slot-independent Web-Flasher image which starts at 0x10000
          # and places the exact same application image into BOTH 0x330000-byte
          # OTA slots. NVS, otadata and SPIFFS are outside this write range and
          # remain untouched.
          python - "$APP_BIN" "firmware-artifact/${PREFIX}.webflasher.bin" <<'PY'
          from pathlib import Path
          import sys

          app_path = Path(sys.argv[1])
          out_path = Path(sys.argv[2])
          app = app_path.read_bytes()

          APP0_OFFSET = 0x10000
          APP1_OFFSET = 0x340000
          SPIFFS_OFFSET = 0x670000
          SLOT_SIZE = APP1_OFFSET - APP0_OFFSET

          if len(app) > SLOT_SIZE:
              raise SystemExit(
                  f"Application image is {len(app)} bytes, larger than OTA slot {SLOT_SIZE} bytes"
              )

          payload = app + (b"\xff" * (SLOT_SIZE - len(app))) + app
          if APP0_OFFSET + len(payload) > SPIFFS_OFFSET:
              raise SystemExit("Dual-slot Web Flasher image would overlap SPIFFS")

          out_path.write_bytes(payload)
          print(
              f"Web Flasher image: {len(payload)} bytes; "
              f"app0=0x{APP0_OFFSET:x}, app1=0x{APP1_OFFSET:x}, "
              f"end=0x{APP0_OFFSET + len(payload):x}"
          )
          PY

          cat > firmware-artifact/README-FLASH.txt <<EOF
          JARNSEN-MESH ${VERSION}
          Board: ${{ matrix.name }}
          Device: ${{ matrix.device_id }}
          Source SHA: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_NUMBER}

          USB-Erstinstallation / kompletter Flash:
            ${PREFIX}.factory.bin

          JARNSEN Service Tool / echtes OTA-Update:
            ${PREFIX}.update.bin

          Meshtastic Web Flasher -> lokale Datei -> Update:
            ${PREFIX}.webflasher.bin

          WICHTIG:
          Der Meshtastic Web Flasher schreibt eine lokal geladene normale BIN
          beim Update fest ab 0x10000. Wenn die bisherige Firmware aus OTA-Slot
          app1/0x340000 bootet, wuerde ein normales update.bin deshalb zwar
          geschrieben, aber nicht gestartet. Die webflasher.bin enthaelt das
          gleiche JARNSEN-MESH-App-Image fuer app0 UND app1 und funktioniert
          daher unabhaengig vom aktuell aktiven OTA-Slot. NVS, Einstellungen,
          Kanaele und SPIFFS bleiben erhalten.

          Das normale update.bin NICHT fuer diesen Web-Flasher-Fall verwenden;
          es bleibt das kleine App-Image fuer das JARNSEN Service Tool bzw.
          einen echten OTA-Mechanismus, der den inaktiven Slot und otadata
          korrekt verwaltet.

          Entwicklungsstand: Alpha. Die bisherige stabile Firmware zum
          Zurueckflashen bereithalten.
          EOF

          (
            cd firmware-artifact
            sha256sum "${PREFIX}.factory.bin" "${PREFIX}.update.bin" "${PREFIX}.webflasher.bin" > SHA256SUMS.txt
          )

      - name: Upload flashable JARNSEN-MESH alpha firmware
        if: matrix.test_artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARNSEN-MESH-v2.0.0-alpha.1-${{ matrix.artifact_label }}-build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Extract compiler diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '=== Compiler / build error matches ==='
            grep -n -E '(^|[[:space:]])(error:|fatal error:|fatal:)|CMake Error|undefined reference|collect2: error|FAILED:|\*\*\* .*Error' unified-${{ matrix.environment }}.log || true
            echo
            echo '=== Last 350 build lines ==='
            tail -n 350 unified-${{ matrix.environment }}.log || true
          } > unified-${{ matrix.environment }}-compiler-errors.txt

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unified-${{ matrix.environment }}-compiler-errors-${{ github.run_number }}
          path: unified-${{ matrix.environment }}-compiler-errors.txt
          if-no-files-found: error
          retention-days: 7
