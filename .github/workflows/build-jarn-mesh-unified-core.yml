name: Build JARNSEN-MESH Unified Core
run-name: "JARNSEN-MESH · self-hosted · ${{ github.sha }}"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - 'src/**'
      - 'variants/**'
      - 'platformio.ini'
      - 'tools/jarnsen_version.*'
      - 'tools/refactor_jarnsen_service_web_to_core.py'
      - 'tools/refactor_jarnsen_boot_splash_to_core.py'
      - 'tools/refactor_jarnsen_tracker_page_indicator.py'
      - '.github/workflows/build-jarn-mesh-unified-core.yml'
      - 'VERSION.json'
  workflow_dispatch:

concurrency:
  group: jarn-mesh-unified-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Heltec Tracker V1.1
            environment: heltec-wireless-tracker
            test_artifact: true
            artifact_label: Tracker-V1.1
            device_id: HELTEC_TRACKER_V1.1
            boot_hardware: TRACKER V1.1
          - name: Heltec V3
            environment: heltec-v3
            test_artifact: true
            artifact_label: Heltec-V3
            device_id: HELTEC_V3
            boot_hardware: HELTEC V3
          - name: Heltec V4
            environment: heltec-v4
            test_artifact: false
            boot_hardware: HELTEC V4
          - name: Seeed Wio Tracker L1
            environment: seeed_wio_tracker_L1
            test_artifact: false
            boot_hardware: WIO TRACKER L1
          - name: LILYGO T-Beam
            environment: tbeam
            test_artifact: false
            boot_hardware: T-BEAM
          - name: LILYGO T-Beam Supreme
            environment: tbeam-s3-core
            test_artifact: false
            boot_hardware: T-BEAM SUPREME

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: pip

      - name: Show self-hosted runner identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}"
          echo "OS: ${RUNNER_OS}"
          echo "Arch: ${RUNNER_ARCH}"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - name: Install PlatformIO
        shell: bash
        run: python -m pip install -U platformio

      - name: Repair broken PlatformIO package metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import shutil
          root = pathlib.Path.home() / '.platformio' / 'packages'
          if root.exists():
              for marker in root.glob('*/.piopm'):
                  try:
                      json.loads(marker.read_text(encoding='utf-8'))
                  except Exception as exc:
                      print(f'Removing broken PlatformIO cache {marker.parent.name}: {exc}')
                      shutil.rmtree(marker.parent, ignore_errors=True)
          PY

      - name: Resolve central version and apply Unified Core transforms
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          python - "$VERSION" <<'PY'
          from pathlib import Path
          import re, sys
          version = sys.argv[1]
          path = Path('src/jarnsen/core/build/JarnsenBuildInfo.h')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(r'#define JARNSEN_FIRMWARE_SEMVER "[^"]+"', f'#define JARNSEN_FIRMWARE_SEMVER "{version}"', text, count=1)
          if count != 1:
              raise SystemExit('Could not inject resolved version into JarnsenBuildInfo.h')
          path.write_text(updated, encoding='utf-8')
          PY
          python tools/refactor_jarnsen_service_web_to_core.py
          python tools/refactor_jarnsen_boot_splash_to_core.py
          python tools/refactor_jarnsen_tracker_page_indicator.py
          grep -q 'jarnsen::drawBootSplash(display, x, y)' src/graphics/Screen.cpp
          grep -q 'drawPagePosition(display, x, y, currentPage)' src/vehicle/TrackerStatusModule.cpp
          grep -q 'displayPageCount()' src/vehicle/TrackerStatusModule.cpp
          grep -q 'JarnsenHardwareProfiles.h' src/jarnsen/core/JarnsenArchitecture.cpp

      - name: Generate JARNSEN-MESH build metadata
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:8}"
          mkdir -p src/jarnsen/core/build
          cat > src/jarnsen/core/build/JarnsenBuildGenerated.h <<EOF
          #pragma once
          #define JARNSEN_FIRMWARE_PRODUCT "JARNSEN-MESH"
          #define JARNSEN_FIRMWARE_SEMVER "${JARNSEN_VERSION}"
          #define JARNSEN_BOOT_HARDWARE "${{ matrix.boot_hardware }}"
          #define JARNSEN_BUILD_SHA "${SHORT_SHA}"
          #define JARNSEN_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          EOF
          cat > src/vehicle/JarnsenBuildGenerated.h <<EOF
          #pragma once
          #define JARNSEN_FIRMWARE_SEMVER "${JARNSEN_VERSION}"
          #define JARNSEN_FIRMWARE_VERSION "JARNSEN-MESH ${JARNSEN_VERSION}"
          #define JARNSEN_BUILD_SHA "${SHORT_SHA}"
          #define JARNSEN_BUILD_NUMBER ${GITHUB_RUN_NUMBER}
          EOF

      - name: Compile ${{ matrix.name }} from shared source tree
        shell: bash
        run: |
          set -o pipefail
          pio run -e "${{ matrix.environment }}" 2>&1 | tee unified-${{ matrix.environment }}.log

      - name: Collect factory/update/webflasher firmware
        if: matrix.test_artifact == true
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${{ matrix.environment }}"
          APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.bin' ! -name '*.factory.bin' -print -quit)
          FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware-${{ matrix.environment }}-*.factory.bin' -print -quit)
          test -n "$APP_BIN"
          test -n "$FACTORY_BIN"
          PREFIX="JARNSEN-MESH-${JARNSEN_VERSION}-${{ matrix.artifact_label }}"
          mkdir -p firmware-artifact
          cp "$FACTORY_BIN" "firmware-artifact/${PREFIX}.factory.bin"
          cp "$APP_BIN" "firmware-artifact/${PREFIX}.update.bin"
          python - "$APP_BIN" "$FACTORY_BIN" "firmware-artifact/${PREFIX}.webflasher.bin" <<'PY'
          from pathlib import Path
          import sys
          app = Path(sys.argv[1]).read_bytes()
          factory = Path(sys.argv[2]).read_bytes()
          out = Path(sys.argv[3])
          if not app or app[0] != 0xE9:
              raise SystemExit('Invalid update image header')
          if not factory or factory[0] != 0xE9:
              raise SystemExit('Invalid factory image header')
          if len(factory) <= 0x10000 or factory[0x8000:0x8002] != b'\xaa\x50' or factory[0x10000] != 0xE9:
              raise SystemExit('Invalid merged factory layout')
          if factory[0x10000:0x10000 + len(app)] != app:
              raise SystemExit('Factory app0 payload does not match update image')
          app0, app1, spiffs = 0x10000, 0x340000, 0x670000
          slot = app1 - app0
          if len(app) > slot:
              raise SystemExit('Application image exceeds OTA slot')
          payload = app + (b'\xff' * (slot - len(app))) + app
          if app0 + len(payload) > spiffs:
              raise SystemExit('Dual-slot Web Flasher image overlaps SPIFFS')
          out.write_bytes(payload)
          print(f'Validated images: app={len(app)}, factory={len(factory)}, webflasher={len(payload)}')
          PY
          cat > firmware-artifact/README-FLASH.txt <<EOF
          JARNSEN-MESH ${JARNSEN_VERSION}
          Board: ${{ matrix.name }}
          Device: ${{ matrix.device_id }}
          Source SHA: ${GITHUB_SHA}
          GitHub Actions run: ${GITHUB_RUN_NUMBER}

          factory.bin: kompletter USB-Flash
          update.bin: echtes OTA/Service-Tool App-Image
          webflasher.bin: Meshtastic Web Flasher; App in app0 und app1
          EOF
          (cd firmware-artifact && sha256sum *.factory.bin *.update.bin *.webflasher.bin > SHA256SUMS.txt)

      - name: Upload Tracker/V3 firmware artifact
        if: matrix.test_artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: JARNSEN-MESH-${{ matrix.artifact_label }}-run-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 7

      - name: Extract compiler diagnostics
        if: failure()
        shell: bash
        run: |
          LOG="unified-${{ matrix.environment }}.log"
          {
            echo '=== Compiler / build error matches ==='
            grep -n -E '(^|[[:space:]])(error:|fatal error:|fatal:)|CMake Error|undefined reference|collect2: error|FAILED:|\*\*\* .*Error' "$LOG" || true
            echo
            echo '=== Last 350 build lines ==='
            tail -n 350 "$LOG" || true
          } > "unified-${{ matrix.environment }}-compiler-errors.txt"

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unified-${{ matrix.environment }}-compiler-errors-${{ github.run_number }}
          path: unified-${{ matrix.environment }}-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 7
