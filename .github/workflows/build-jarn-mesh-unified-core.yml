name: Build JARNSEN-MESH Unified Core
run-name: "JARNSEN-MESH · GitHub · Build ${{ github.run_number }}"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - 'src/**'
      - 'variants/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'tools/**'
      - '.buildkite/run-unified-build.sh'
      - '.buildkite/run-unified-build-daily.sh'
      - '.github/workflows/build-jarn-mesh-unified-core.yml'
      - 'VERSION.json'
  workflow_dispatch:

concurrency:
  group: jarn-mesh-unified-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: Heltec Tracker V1.1
            environment: heltec-wireless-tracker
            artifact_label: Heltec-Tracker-V1.1
            boot_hardware: TRACKER V1.1
            artifact_kind: esp32
            webflasher: true
          - name: Heltec V3
            environment: heltec-v3
            artifact_label: Heltec-V3
            boot_hardware: HELTEC V3
            artifact_kind: esp32
            webflasher: true
          - name: Heltec V4
            environment: heltec-v4
            artifact_label: Heltec-V4
            boot_hardware: HELTEC V4
            artifact_kind: esp32
            webflasher: false
          - name: Seeed Wio Tracker L1
            environment: seeed_wio_tracker_L1
            artifact_label: Seeed-Wio-Tracker-L1
            boot_hardware: WIO TRACKER L1
            artifact_kind: uf2
            webflasher: false
          - name: LILYGO T-Beam
            environment: tbeam
            artifact_label: LILYGO-T-Beam
            boot_hardware: T-BEAM
            artifact_kind: esp32
            webflasher: false
          - name: LILYGO T-Beam Supreme
            environment: tbeam-s3-core
            artifact_label: LILYGO-T-Beam-Supreme
            boot_hardware: T-BEAM SUPREME
            artifact_kind: esp32
            webflasher: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve JARNSEN-MESH version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Compile shared Unified Core
        shell: bash
        env:
          JARNSEN_BOARD_NAME: ${{ matrix.name }}
          JARNSEN_PIO_ENV: ${{ matrix.environment }}
          JARNSEN_BOOT_HARDWARE: ${{ matrix.boot_hardware }}
          JARNSEN_TEST_ARTIFACT: '0'
          BUILDKITE_BUILD_NUMBER: ${{ github.run_number }}
        run: bash .buildkite/run-unified-build-daily.sh

      - name: Collect flashable firmware
        shell: bash
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          BOARD_NAME: ${{ matrix.name }}
          ARTIFACT_LABEL: ${{ matrix.artifact_label }}
          ARTIFACT_KIND: ${{ matrix.artifact_kind }}
          WEBFLASHER: ${{ matrix.webflasher }}
        run: |
          set -euo pipefail
          VERSION="${JARNSEN_VERSION}"
          BUILD_DIR=".pio/build/${ENVIRONMENT}"
          PREFIX="JARNSEN-MESH-${ARTIFACT_LABEL}-${VERSION}-Build-${GITHUB_RUN_NUMBER}"
          OUT="firmware-artifact"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          if [[ "$ARTIFACT_KIND" == "uf2" ]]; then
            UF2=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware*.uf2' -print -quit)
            if [[ -z "$UF2" ]]; then
              echo "No UF2 firmware found in $BUILD_DIR" >&2
              find "$BUILD_DIR" -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$UF2" "$OUT/${PREFIX}-firmware.uf2"
          else
            APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name "firmware-${ENVIRONMENT}-*.bin" ! -name '*.factory.bin' ! -name '*.webflasher.bin' -print -quit)
            if [[ -z "$APP_BIN" ]]; then
              APP_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name 'firmware.bin' -print -quit)
            fi
            if [[ -z "$APP_BIN" ]]; then
              echo "No application BIN found in $BUILD_DIR" >&2
              find "$BUILD_DIR" -maxdepth 1 -type f -print || true
              exit 1
            fi
            cp "$APP_BIN" "$OUT/${PREFIX}-update.bin"

            FACTORY_BIN=$(find "$BUILD_DIR" -maxdepth 1 -type f -name "firmware-${ENVIRONMENT}-*.factory.bin" -print -quit)
            if [[ -n "$FACTORY_BIN" ]]; then
              cp "$FACTORY_BIN" "$OUT/${PREFIX}-factory.bin"
            fi

            python - "$APP_BIN" "$FACTORY_BIN" <<'PY'
          from pathlib import Path
          import sys

          app_path = Path(sys.argv[1])
          app = app_path.read_bytes()
          if not app or app[0] != 0xE9:
              raise SystemExit(f"Invalid ESP32 application image: {app_path}")

          factory_arg = sys.argv[2]
          if factory_arg:
              factory_path = Path(factory_arg)
              factory = factory_path.read_bytes()
              app_offset = 0x10000
              if len(factory) < app_offset + len(app):
                  raise SystemExit(f"Factory image too small to contain application: {factory_path}")
              if factory[0x8000:0x8002] != b'\xaa\x50':
                  raise SystemExit(f"Factory partition-table magic invalid: {factory_path}")
              if factory[app_offset] != 0xE9:
                  raise SystemExit(f"Factory application header invalid at 0x{app_offset:x}: {factory_path}")
              if factory[app_offset:app_offset + len(app)] != app:
                  raise SystemExit(f"Factory application payload does not match update image: {factory_path}")

          print(f"Validated ESP32 application image: {len(app)} bytes")
          PY

            if [[ "$WEBFLASHER" == "true" ]]; then
              if [[ -z "$FACTORY_BIN" ]]; then
                echo "Factory BIN required for validated Web Flasher package" >&2
                exit 1
              fi
              python - "$APP_BIN" "$FACTORY_BIN" "$OUT/${PREFIX}-webflasher.bin" <<'PY'
          from pathlib import Path
          import sys

          app = Path(sys.argv[1]).read_bytes()
          factory = Path(sys.argv[2]).read_bytes()
          out = Path(sys.argv[3])
          if len(factory) <= 0x10000:
              raise SystemExit("Factory image too small to contain app0")
          if factory[0x8000:0x8002] != b'\xaa\x50':
              raise SystemExit("Factory partition-table magic invalid")
          if factory[0x10000] != 0xE9:
              raise SystemExit("Factory app0 header invalid")
          if factory[0x10000:0x10000 + len(app)] != app:
              raise SystemExit("Factory app0 payload does not match update image")
          app0, app1, spiffs = 0x10000, 0x340000, 0x670000
          slot = app1 - app0
          if len(app) > slot:
              raise SystemExit("Application image exceeds OTA slot")
          payload = app + (b'\xff' * (slot - len(app))) + app
          if app0 + len(payload) > spiffs:
              raise SystemExit("Dual-slot Web Flasher image overlaps SPIFFS")
          out.write_bytes(payload)
          print(f"Validated dual-slot Web Flasher image: {len(payload)} bytes")
          PY
            fi
          fi

          cat > "$OUT/${PREFIX}-README.txt" <<EOF
          JARNSEN-MESH ${VERSION}
          Board: ${BOARD_NAME}
          PlatformIO environment: ${ENVIRONMENT}
          Build: ${GITHUB_RUN_NUMBER}
          Source SHA: ${GITHUB_SHA}

          This package was compiled from the shared JARNSEN-MESH Unified Core.
          The Wio Tracker L1 uses its native UF2 image. ESP32-family boards use
          the native application BIN; validated factory/webflasher images are
          added where that layout is explicitly verified.
          EOF

          (
            cd "$OUT"
            find . -maxdepth 1 -type f ! -name '*SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > "${PREFIX}-SHA256SUMS.txt"
          )
          ls -lah "$OUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-${{ matrix.artifact_label }}-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-errors-${{ matrix.environment }}-${{ github.run_number }}
          path: |
            unified-${{ matrix.environment }}.log
            unified-${{ matrix.environment }}-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 14
