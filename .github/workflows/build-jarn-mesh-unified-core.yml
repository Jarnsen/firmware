name: Build JARNSEN-MESH Unified Core
run-name: "JARNSEN-MESH Unified Core · Build ${{ github.run_number }}"

on:
  push:
    branches:
      - refactor/jarn-mesh-unified-core
    paths:
      - 'src/**'
      - 'variants/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'tools/**'
      - '.buildkite/run-unified-build.sh'
      - '.buildkite/run-unified-build-daily.sh'
      - '.buildkite/package-jarnsen-firmware.py'
      - '.github/workflows/build-jarn-mesh-unified-core.yml'
      - 'VERSION.json'
  workflow_dispatch:
    inputs:
      build_scope:
        description: 'Build scope (tracker = Tracker V1.1 + Heltec V3)'
        required: true
        default: tracker
        type: choice
        options:
          - tracker
          - full

concurrency:
  group: jarn-mesh-unified-core-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Unified Core checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate latest commit diff
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

      - name: Run JARNSEN contract checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/jarnsen_preflight.py
          python -m py_compile tools/jarnsen_runtime_reliability_preflight.py
          python -m py_compile tools/jarnsen_final_parity_preflight.py
          python -m py_compile tools/jarnsen_packaging_preflight.py
          python -m py_compile .buildkite/package-jarnsen-firmware.py
          python tools/jarnsen_preflight.py
          python tools/jarnsen_runtime_reliability_preflight.py
          python tools/jarnsen_final_parity_preflight.py
          python tools/jarnsen_packaging_preflight.py

      - name: Validate Tracker Full Lock source transform
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/patch_jarnsen_tracker_full_lock_ui.py
          python tools/patch_jarnsen_tracker_full_lock_ui.py
          git diff --check
          grep -q 'JARNSEN_TRACKER_FULL_LOCK_UI' src/graphics/Screen.cpp
          grep -q 'JARNSEN_TRACKER_LARGE_PIN' src/graphics/draw/NotificationRenderer.cpp
          grep -q 'JARNSEN_TRACKER_LOCK_BUTTON' src/input/ButtonThread.cpp
          grep -q 'JARNSEN_TRACKER_TAK_FULL_LOCK_BUTTON' src/vehicle/HeltecTrackerV11TakLeaderPolicy.cpp

  tracker:
    name: Compile Heltec Tracker V1.1
    needs: checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve JARNSEN-MESH version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Apply Tracker Full Lock UI
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_tracker_full_lock_ui.py
          git diff --check

      - name: Compile Tracker Unified Core
        shell: bash
        env:
          JARNSEN_BOARD_NAME: Heltec Tracker V1.1
          JARNSEN_PIO_ENV: heltec-wireless-tracker
          JARNSEN_BOOT_HARDWARE: TRACKER V1.1
          JARNSEN_BUILD_NUMBER: ${{ github.run_number }}
        run: bash .buildkite/run-unified-build-daily.sh

      - name: Collect and validate Tracker firmware
        shell: bash
        run: |
          set -euo pipefail
          python .buildkite/package-jarnsen-firmware.py \
            --environment 'heltec-wireless-tracker' \
            --board 'Heltec Tracker V1.1' \
            --artifact-label 'Heltec-Tracker-V1.1' \
            --artifact-kind 'esp32' \
            --webflasher 'true' \
            --version "${JARNSEN_VERSION}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --source-sha "${GITHUB_SHA}"

      - name: Upload Tracker firmware artifact
        id: upload_tracker_firmware
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-Tracker-V1.1-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Back off before Tracker artifact upload retry
        if: ${{ steps.upload_tracker_firmware.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Retry Tracker firmware artifact upload
        if: ${{ steps.upload_tracker_firmware.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-Tracker-V1.1-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Tracker compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-errors-heltec-wireless-tracker-${{ github.run_number }}
          path: |
            unified-heltec-wireless-tracker.log
            unified-heltec-wireless-tracker-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 14


  v3:
    name: Compile Heltec V3
    needs: tracker
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve JARNSEN-MESH version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Apply Unified Core source transforms
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_tracker_full_lock_ui.py
          git diff --check

      - name: Compile Heltec V3 Unified Core
        shell: bash
        env:
          JARNSEN_BOARD_NAME: Heltec V3
          JARNSEN_PIO_ENV: heltec-v3
          JARNSEN_BOOT_HARDWARE: HELTEC V3
          JARNSEN_BUILD_NUMBER: ${{ github.run_number }}
        run: bash .buildkite/run-unified-build-daily.sh

      - name: Collect and validate Heltec V3 firmware
        shell: bash
        run: |
          set -euo pipefail
          python .buildkite/package-jarnsen-firmware.py \
            --environment 'heltec-v3' \
            --board 'Heltec V3' \
            --artifact-label 'Heltec-V3' \
            --artifact-kind 'esp32' \
            --webflasher 'true' \
            --version "${JARNSEN_VERSION}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --source-sha "${GITHUB_SHA}"

      - name: Upload Heltec V3 firmware artifact
        id: upload_v3_firmware
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-V3-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Back off before Heltec V3 artifact upload retry
        if: ${{ steps.upload_v3_firmware.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Retry Heltec V3 firmware artifact upload
        if: ${{ steps.upload_v3_firmware.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-Heltec-V3-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload Heltec V3 compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-errors-heltec-v3-${{ github.run_number }}
          path: |
            unified-heltec-v3.log
            unified-heltec-v3-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 14

  compile_full:
    name: Compile ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_scope == 'full'
    needs: v3
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: Heltec V4
            environment: heltec-v4
            artifact_label: Heltec-V4
            boot_hardware: HELTEC V4
            artifact_kind: esp32
            webflasher: true
          - name: Seeed Wio Tracker L1
            environment: seeed_wio_tracker_L1
            artifact_label: Seeed-Wio-Tracker-L1
            boot_hardware: WIO TRACKER L1
            artifact_kind: uf2
            webflasher: false
          - name: LILYGO T-Beam
            environment: tbeam
            artifact_label: LILYGO-T-Beam
            boot_hardware: T-BEAM
            artifact_kind: esp32
            webflasher: false
          - name: LILYGO T-Beam Supreme
            environment: tbeam-s3-core
            artifact_label: LILYGO-T-Beam-Supreme
            boot_hardware: T-BEAM SUPREME
            artifact_kind: esp32
            webflasher: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve JARNSEN-MESH version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "JARNSEN_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Resolved version: ${VERSION}"

      - name: Apply Unified Core source transforms
        shell: bash
        run: |
          set -euo pipefail
          python tools/patch_jarnsen_tracker_full_lock_ui.py
          git diff --check

      - name: Compile shared Unified Core
        shell: bash
        env:
          JARNSEN_BOARD_NAME: ${{ matrix.name }}
          JARNSEN_PIO_ENV: ${{ matrix.environment }}
          JARNSEN_BOOT_HARDWARE: ${{ matrix.boot_hardware }}
          JARNSEN_BUILD_NUMBER: ${{ github.run_number }}
        run: bash .buildkite/run-unified-build-daily.sh

      - name: Collect and validate flashable firmware
        shell: bash
        run: |
          set -euo pipefail
          python .buildkite/package-jarnsen-firmware.py \
            --environment '${{ matrix.environment }}' \
            --board '${{ matrix.name }}' \
            --artifact-label '${{ matrix.artifact_label }}' \
            --artifact-kind '${{ matrix.artifact_kind }}' \
            --webflasher '${{ matrix.webflasher }}' \
            --version "${JARNSEN_VERSION}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --source-sha "${GITHUB_SHA}"

      - name: Upload firmware artifact
        id: upload_firmware
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-${{ matrix.artifact_label }}-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30

      - name: Back off before firmware artifact upload retry
        if: ${{ steps.upload_firmware.outcome == 'failure' }}
        shell: bash
        run: sleep 15

      - name: Retry firmware artifact upload
        if: ${{ steps.upload_firmware.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: JARNSEN-MESH-${{ matrix.artifact_label }}-${{ steps.version.outputs.version }}-Build-${{ github.run_number }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload compiler diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-errors-${{ matrix.environment }}-${{ github.run_number }}
          path: |
            unified-${{ matrix.environment }}.log
            unified-${{ matrix.environment }}-compiler-errors.txt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish successful JARNSEN-MESH prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.build_scope == 'full'
    needs: [tracker, v3, compile_full]
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write

    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python tools/jarnsen_version.py)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release candidate: ${VERSION}"

      - name: Download six successful firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: JARNSEN-MESH-*
          path: release-assets
          merge-multiple: true

      - name: Verify complete release set
        shell: bash
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          expected=(
            Heltec-Tracker-V1.1
            Heltec-V3
            Heltec-V4
            Seeed-Wio-Tracker-L1
            LILYGO-T-Beam
            LILYGO-T-Beam-Supreme
          )

          for label in "${expected[@]}"; do
            prefix="JARNSEN-MESH-${label}-${VERSION}-Build-${GITHUB_RUN_NUMBER}"
            test -f "release-assets/${prefix}-README.txt" || { echo "Missing README for ${label}" >&2; exit 1; }
            test -f "release-assets/${prefix}-SHA256SUMS.txt" || { echo "Missing checksums for ${label}" >&2; exit 1; }
            test -f "release-assets/${prefix}-package-manifest.json" || { echo "Missing package manifest for ${label}" >&2; exit 1; }

            if [[ "$label" == "Seeed-Wio-Tracker-L1" ]]; then
              test -f "release-assets/${prefix}-firmware.uf2" || { echo "Missing UF2 for ${label}" >&2; exit 1; }
            else
              test -f "release-assets/${prefix}-update.bin" || { echo "Missing update BIN for ${label}" >&2; exit 1; }
              test -f "release-assets/${prefix}-factory.bin" || { echo "Missing factory BIN for ${label}" >&2; exit 1; }
            fi

            case "$label" in
              Heltec-Tracker-V1.1|Heltec-V3|Heltec-V4|LILYGO-T-Beam-Supreme)
                test -f "release-assets/${prefix}-meshtastic-webflasher.bin" || { echo "Missing Meshtastic Web Flasher BIN for ${label}" >&2; exit 1; }
                ;;
            esac
          done

          echo "Verified all six release artifact sets for ${VERSION}"

      - name: Publish release only after green full build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail

          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Release tag already exists: ${VERSION}" >&2
            exit 1
          fi

          cat > release-notes.md <<EOF
          JARNSEN MESH ${VERSION}

          Unified Core prerelease generated only after the Tracker reference build and all five additional supported board builds completed successfully.

          Build: ${GITHUB_RUN_NUMBER}
          Source SHA: ${GITHUB_SHA}

          Firmware package policy:
          - Tracker / Heltec V3 / Heltec V4 / T-Beam Supreme: update + factory + Meshtastic-Web-Flasher custom BIN
          - LILYGO T-Beam: update + factory
          - Seeed Wio Tracker L1: native UF2
          - Every board package includes a package manifest and SHA256 checksums
          - factory.bin is an absolute full-flash image starting at 0x000000
          - meshtastic-webflasher.bin is relative to the first OTA app partition for Meshtastic Web Flasher custom upload
          - ESP32 application offsets are read from the generated partition table; no board-specific 0x10000 assumption is used

          Boards:
          - Heltec Tracker V1.1
          - Heltec V3
          - Heltec V4
          - Seeed Wio Tracker L1
          - LILYGO T-Beam
          - LILYGO T-Beam Supreme
          EOF

          python tools/publish_jarnsen_release.py \
            --repo "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "JARNSEN MESH ${VERSION} · Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md \
            --assets-dir release-assets
