name: Build JARNSEN-MESH Unified Core
run-name: "JARNSEN-MESH v2.0.0-alpha.1 · manual overview · ${{ github.sha }}"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buildkite-primary:
    name: Buildkite Hosted Linux is primary
    runs-on: ubuntu-latest
    steps:
      - name: Explain build execution
        run: |
          echo "Automatic JARN-MESH Unified Core builds run on Buildkite Hosted Linux."
          echo "Each board is published directly back to GitHub as a Compile <board> status check."
          echo "This workflow is manual-only so normal pushes do not consume or wait for a GitHub runner."
