<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #171717; }
    .title { font-size: 46px; font-weight: 700; }
    .sub { font-size: 27px; font-weight: 700; fill: #1457a0; }
    .head { font-size: 30px; font-weight: 700; }
    .row { font-size: 27px; font-weight: 700; }
    .note { font-size: 24px; }
    .small { font-size: 21px; }
  </style>

  <rect width="1400" height="860" fill="#ffffff"/>

  <text x="55" y="65" class="title">Heltec Wireless Tracker V1.1 – obere Pinleisten</text>
  <text x="55" y="108" class="sub">Board aufrecht: USB-C oben • Pins von oben nach unten 1–8 zählen</text>

  <!-- orientation cue -->
  <rect x="600" y="140" width="200" height="56" rx="10" fill="#e9edf2" stroke="#171717" stroke-width="3"/>
  <text x="700" y="177" text-anchor="middle" class="head">USB-C OBEN</text>

  <!-- left header panel -->
  <rect x="90" y="225" width="535" height="505" rx="18" fill="#f7f9fc" stroke="#1457a0" stroke-width="4"/>
  <text x="357" y="275" text-anchor="middle" class="head">LINKE obere 8er-Leiste</text>

  <!-- right header panel -->
  <rect x="775" y="225" width="535" height="505" rx="18" fill="#f7f9fc" stroke="#1457a0" stroke-width="4"/>
  <text x="1042" y="275" text-anchor="middle" class="head">RECHTE obere 8er-Leiste</text>

  <!-- center board direction -->
  <line x1="700" y1="200" x2="700" y2="705" stroke="#aeb7c2" stroke-width="4" stroke-dasharray="10,10"/>
  <text x="700" y="754" text-anchor="middle" class="small" fill="#6b7280">Richtung Display / GNSS ↓</text>

  <!-- left pin rows -->
  <g>
    <text x="180" y="337" class="row">1</text><circle cx="270" cy="328" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <text x="180" y="391" class="row">2</text><circle cx="270" cy="382" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <text x="180" y="445" class="row" fill="#d52424">3</text><circle cx="270" cy="436" r="23" fill="#ffffff" stroke="#d52424" stroke-width="8"/><text x="330" y="445" class="row" fill="#d52424">3V3</text>
    <text x="180" y="499" class="row">4</text><circle cx="270" cy="490" r="23" fill="#ffffff" stroke="#171717" stroke-width="8"/><text x="330" y="499" class="row">GND</text>
    <text x="180" y="553" class="row">5</text><circle cx="270" cy="544" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <text x="180" y="607" class="row">6</text><circle cx="270" cy="598" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <text x="180" y="661" class="row">7</text><circle cx="270" cy="652" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
    <text x="180" y="715" class="row">8</text><circle cx="270" cy="706" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/>
  </g>

  <!-- right pin rows -->
  <g>
    <circle cx="1130" cy="328" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="337" class="row">1</text>
    <circle cx="1130" cy="382" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="391" class="row">2</text>
    <circle cx="1130" cy="436" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="445" class="row">3</text>
    <circle cx="1130" cy="490" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="499" class="row">4</text>
    <circle cx="1130" cy="544" r="23" fill="#ffffff" stroke="#129141" stroke-width="8"/><text x="1220" y="553" class="row" fill="#129141">5</text><text x="860" y="553" class="row" fill="#129141">GPIO7</text>
    <circle cx="1130" cy="598" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="607" class="row">6</text>
    <circle cx="1130" cy="652" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="661" class="row">7</text>
    <circle cx="1130" cy="706" r="18" fill="#ffffff" stroke="#6b7280" stroke-width="5"/><text x="1220" y="715" class="row">8</text>
  </g>

  <!-- summary -->
  <rect x="155" y="780" width="1090" height="58" rx="12" fill="#ffffff" stroke="#aeb7c2" stroke-width="2"/>
  <text x="700" y="818" text-anchor="middle" class="note"><tspan fill="#d52424" font-weight="700">3V3 = links Pin 3</tspan><tspan>   •   </tspan><tspan font-weight="700">GND = links Pin 4</tspan><tspan>   •   </tspan><tspan fill="#129141" font-weight="700">GPIO7 = rechts Pin 5</tspan></text>
</svg>
